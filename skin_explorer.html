<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skin Explorer - Block Over It</title>
    <style>
      {
        box-sizing: border-box;
        border-radius: 0 !important;
      }
      body {
        background-color: #111;
        color: #fff;
        font-family: "Courier New", Courier, monospace;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      header {
        background-color: #1a1a1a;
        border-bottom: 4px solid #333;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        z-index: 10;
        position: relative;
        flex-shrink: 0;
      }
      .header-top {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .back-btn {
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        background: #444;
        border: 4px solid #333;
        color: #fff;
        padding: 8px 16px;
        cursor: pointer;
        text-transform: uppercase;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: bold;
        transition: all 0.2s;
        text-decoration: none;
      }
      .back-btn:hover {
        background: #335699;
        border-color: #eee;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 3.5vw, 2.2rem);
        text-transform: uppercase;
        letter-spacing: 4px;
        color: #fff;
        font-weight: 900;
        text-align: center;
      }

      #search-container {
        width: 100%;
        max-width: 650px;
      }
      #search-input {
        width: 100%;
        padding: 12px 16px;
        font-size: 1rem;
        background-color: #222;
        border: 4px solid #333;
        color: #fff;
        font-family: inherit;
        outline: none;
        text-transform: uppercase;
        transition: border-color 0.2s;
      }
      #search-input:focus {
        border-color: #335699;
      }
      #search-input::placeholder {
        color: #666;
      }

      .controls-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 800px;
      }
      .filter-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .filter-btn {
        background: #222;
        border: 3px solid #333;
        color: #aaa;
        padding: 6px 12px;
        font-size: 0.8rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        text-transform: uppercase;
      }
      .filter-btn:hover {
        background: #333;
        color: #fff;
      }
      .filter-btn.active {
        background: #335699;
        border-color: #eee;
        color: #fff;
      }
      #sort-select {
        background: #222;
        border: 3px solid #333;
        color: #fff;
        padding: 6px 12px;
        font-size: 0.8rem;
        font-weight: bold;
        font-family: inherit;
        cursor: pointer;
        outline: none;
        text-transform: uppercase;
      }
      #sort-select:focus {
        border-color: #335699;
      }

      #skins-grid {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
        align-content: start;
      }
      #skins-grid::-webkit-scrollbar {
        width: 10px;
      }
      #skins-grid::-webkit-scrollbar-track {
        background: #111;
      }
      #skins-grid::-webkit-scrollbar-thumb {
        background: #333;
        border: 2px solid #111;
      }
      #skins-grid::-webkit-scrollbar-thumb:hover {
        background: #335699;
      }

      .skin-card {
        background-color: #222;
        border: 4px solid #333;
        padding: 14px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
        cursor: pointer;
        position: relative;
      }
      .skin-card:hover {
        background-color: #2a2a2a;
        border-color: #335699;
      }
      .skin-preview {
        width: 60px;
        height: 120px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        flex-shrink: 0;
      }
      .skin-name {
        font-size: 0.85rem;
        font-weight: bold;
        text-align: center;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        line-height: 1.3;
      }
      .skin-copies {
        font-size: 0.7rem;
        color: #aaa;
        background-color: #111;
        padding: 3px 8px;
        border: 2px solid #335699;
        font-weight: bold;
      }
      .skin-copies.legendary {
        color: #ffd700;
        border-color: #ffd700;
      }
      .skin-tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .skin-tag {
        font-size: 0.6rem;
        padding: 2px 6px;
        font-weight: bold;
        text-transform: uppercase;
        border: 2px solid;
      }
      .skin-tag.honorary {
        background-color: #4a2d5c;
        border-color: #9b59b6;
        color: #e0b0ff;
      }
      .skin-tag.first-place {
        background-color: #5c4a1a;
        border-color: #f1c40f;
        color: #ffe680;
      }
      .skin-tag.competitive {
        background-color: #5c3a1a;
        border-color: #e67e22;
        color: #ffc180;
      }
      .skin-tag.unlock-code {
        background-color: #14514a;
        border-color: #1abc9c;
        color: #8ef0e0;
      }
      .skin-tag.game-unlock {
        background-color: #1c5233;
        border-color: #2ecc71;
        color: #9bf0bd;
      }
      .skin-tag.event {
        background-color: #5c221c;
        border-color: #e74c3c;
        color: #ffab9f;
      }
      .skin-artist {
        font-size: 0.65rem;
        color: #888;
        text-align: center;
      }
      .skin-for {
        font-size: 0.65rem;
        color: #5588cc;
        font-weight: bold;
        text-align: center;
      }
      .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 50px 20px;
        color: #666;
        font-size: 1.1rem;
        font-weight: bold;
        text-transform: uppercase;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 16px;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-content {
        background-color: #1a1a1a;
        border: 4px solid #335699;
        padding: 24px;
        width: 100%;
        max-width: 420px;
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        position: relative;
      }
      .modal-close {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #444;
        border: 3px solid #333;
        color: #fff;
        width: 36px;
        height: 36px;
        font-size: 1.3rem;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        line-height: 1;
      }
      .modal-close:hover {
        background: #a04040;
        border-color: #eee;
      }
      .modal-preview {
        width: 90px;
        height: 180px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        flex-shrink: 0;
      }
      .modal-title {
        font-size: 1.2rem;
        font-weight: 900;
        text-transform: uppercase;
        text-align: center;
        letter-spacing: 1px;
        line-height: 1.3;
      }
      .modal-subtitle {
        font-size: 0.85rem;
        color: #335699;
        font-weight: bold;
        text-transform: uppercase;
      }
      .modal-details {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: #aaa;
        text-align: center;
        width: 100%;
        border-top: 3px solid #333;
        padding-top: 12px;
      }
      .version-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .version-btn {
        background: #444;
        border: 3px solid #333;
        color: #fff;
        width: 34px;
        height: 34px;
        font-size: 1rem;
        font-family: inherit;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
      }
      .version-btn:hover {
        background: #335699;
        border-color: #eee;
      }

      /* ---- Mobile: same theme, tighter layout, works in both orientations */
      @media (max-width: 820px) {
        header {
          padding: 10px 12px;
          gap: 10px;
        }
        .header-top {
          flex-direction: row;
          gap: 8px;
          justify-content: flex-start;
        }
        .back-btn {
          position: static;
          transform: none;
          padding: 8px 12px;
          font-size: 0.7rem;
          flex-shrink: 0;
        }
        h1 {
          font-size: 1.1rem;
          letter-spacing: 2px;
          flex: 1;
          text-align: center;
        }
        #search-input {
          padding: 10px 12px;
          font-size: 0.9rem;
          border-width: 3px;
        }
        /* Filters scroll sideways instead of stacking into a tall wall */
        .controls-container {
          flex-direction: column;
          gap: 8px;
        }
        .filter-tags {
          flex-wrap: nowrap;
          overflow-x: auto;
          justify-content: flex-start;
          width: 100%;
          padding-bottom: 4px;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
        }
        .filter-tags::-webkit-scrollbar {
          display: none;
        }
        .filter-btn {
          flex-shrink: 0;
          padding: 8px 12px;
          font-size: 0.7rem;
        }
        #sort-select {
          width: 100%;
          padding: 8px 10px;
        }
        #skins-grid {
          grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
          gap: 10px;
          padding: 12px;
        }
        .skin-card {
          border-width: 3px;
          padding: 10px 6px;
          gap: 6px;
        }
        .skin-preview {
          width: 44px;
          height: 88px;
        }
        .skin-name {
          font-size: 0.7rem;
        }
        .skin-copies {
          font-size: 0.6rem;
          padding: 2px 6px;
        }
        .skin-tag {
          font-size: 0.5rem;
        }
        .skin-artist,
        .skin-for {
          font-size: 0.55rem;
        }
        .modal-content {
          border-width: 3px;
          padding: 20px 16px;
        }
      }

      /* Landscape phones: the header must not eat the screen */
      @media (max-width: 920px) and (orientation: landscape) and (max-height: 520px) {
        header {
          padding: 8px 12px;
          gap: 8px;
        }
        .header-top {
          gap: 10px;
        }
        h1 {
          font-size: 0.95rem;
          letter-spacing: 1px;
        }
        /* Search and sort share a row so the grid keeps its height */
        .controls-container {
          flex-direction: row;
          flex-wrap: nowrap;
          gap: 8px;
        }
        .filter-tags {
          flex: 1;
        }
        #sort-select {
          width: auto;
          flex-shrink: 0;
        }
        #skins-grid {
          grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
          padding: 10px;
        }
        .skin-preview {
          width: 38px;
          height: 76px;
        }
        .modal-content {
          max-width: 560px;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: flex-start;
          gap: 16px;
        }
        .modal-preview {
          width: 70px;
          height: 140px;
        }
        .modal-content > *:not(.modal-preview):not(.modal-close) {
          width: calc(100% - 90px);
          margin-left: auto;
        }
        .modal-details {
          align-items: flex-start;
          text-align: left;
        }
        .modal-title,
        .modal-subtitle {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-top">
        <a href="index.html" class="back-btn">&larr; Back to Game</a>
        <h1>Skin Explorer</h1>
      </div>
      <div id="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="SEARCH SKINS..."
        />
      </div>
      <div class="controls-container">
        <div class="filter-tags" id="filter-tags">
          <button class="filter-btn active" data-tag="all">All</button>
          <button class="filter-btn" data-tag="firstPlace">1st Place</button>
          <button class="filter-btn" data-tag="honorary">Honorary</button>
          <button class="filter-btn" data-tag="competitive">Competitive</button>
          <button class="filter-btn" data-tag="unlockCode">Code</button>
          <button class="filter-btn" data-tag="gameUnlock">Unlock</button>
          <button class="filter-btn" data-tag="event">Event</button>
        </div>
        <select id="sort-select">
          <option value="name_asc">Sort: Name (A-Z)</option>
          <option value="name_desc">Sort: Name (Z-A)</option>
          <option value="rarity_asc">Sort: Rarest First</option>
          <option value="rarity_desc">Sort: Common First</option>
          <option value="artist_asc">Sort: Artist (A-Z)</option>
          <option value="artist_desc">Sort: Artist (Z-A)</option>
        </select>
      </div>
    </header>
    <div id="skins-grid"></div>

    <div id="skin-modal" class="modal-overlay">
      <div class="modal-content">
        <button class="modal-close" onclick="closeSkinModal()">&times;</button>
        <div
          id="version-controls"
          class="version-controls"
          style="display: none"
        >
          <button class="version-btn" onclick="changeVersion(-1)">&lt;</button>
          <span id="version-label" style="font-size: 0.8rem; color: #aaa"
            >v1</span
          >
          <button class="version-btn" onclick="changeVersion(1)">&gt;</button>
        </div>
        <div id="modal-preview" class="modal-preview"></div>
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-subtitle" class="modal-subtitle"></div>
        <div id="modal-details" class="modal-details"></div>
      </div>
    </div>

        },

        },
        reddino: {
          name: "Dino (Red)",
          copies: "1/5",
          artist: "Torgaar & Mcdongos",
          event: true,
        },
        rainbowmonsterremastered: {
          name: "Rainbow Monster (Remastered)",
          copies: "1/5",
          artist: "Torgaar & Chairlord",
          event: true,
        },
        bluedino: {
          name: "Dino (Blue)",
          copies: "1/3",
          artist: "Torgaar & Mcdongos",
          event: true,
        },
        cubemouthdevourer: {
          name: "Cubemouth (Devourer)",
          copies: "N/A",
          artist: "Torgaar and Chairlord",
          event: true,
        },
        midgemidge: {
          name: "MidgeMidge",
          copies: "1/1",
          artist: "Torgaar and MidgeMidge22",
          honorary: true
        },
          blackbeard: {
          name: "Blocky (Blackbeard)",
          copies: "1/11",
          artist: "Torgaar",
          unlockCode: true
        },
        coolguypainted: {
          name: "Cool Guy (Painted)",
          copies: "1/5",
          artist: "Torgaar",
          unlockCode: true,        
          versions: [
            {name: "OG", img: "coolguypaintog.png"},
            {name: "Remaster", img: "coolguypainted.png"},
          ]
        },
        redtrail: {
          name: "Red Trail",
          copies: "1/3",
          artist: "Torgaar & pedro",
          unlockCode: true,
          img: "redtrail.png",
          color: "#c0392b"
        },
        coolguydeepbluespecial: {
          name: "Cool Guy (Deep Blue)",
          copies: "1/3",
          artist: "Torgaar",
          unlockCode: true
        },
          coolguymoney: {
          name: "Cool Guy (Money)",
          copies: "1/5",
          artist: "Torgaar",
          gameUnlock: true
        },
        demon: {
          name: "Demon",
          copies: "N/A",
          artist: "Torgaar",
          gameUnlock: true
        },
        coolguylogomonogram: {
          name: "Cool Guy (Logo Monogram)",
          copies: "1/5",
          artist: "Torgaar",
        },
        coolguy10:{
          name: "Cool Guy (1.10)",
          copies:"1/10",
          artist: "Torgaar"
        },
        coolguybloody:{
          name: "Cool Guy (Bloody)",
          copies:"1/3",
          artist: "Torgaar"
        },
          alien:{
          name: "Alien",
          copies:"1/10",
          artist: "Torgaar"
        },
          alienblocktober:{
          name: "Alien (Yellow Eyes)",
          copies:"1/3",
          artist: "Torgaar"
        },
      };


      const ANIMATED_SKINS = [
        "smiley",
        "deathfire",
        "WINSTONTHEGREAT",
        "coolguymagma",
        "coolguypurplemagma",
      ];
      function skinFileExtension(id) {
        return ANIMATED_SKINS.includes(id) ? "gif" : "png";
      }

      // Initialize new variables (Defaults)
      Object.values(SKIN_DEFINITIONS).forEach((def) => {
        if (typeof def.honorary === "undefined") def.honorary = false;
        if (typeof def.firstPlace === "undefined") def.firstPlace = false;
        if (typeof def.artist === "undefined") def.artist = "Unknown";
        if (typeof def.competitive === "undefined") def.competitive = false;
        if (typeof def.unlockCode === "undefined") def.unlockCode = false;
        if (typeof def.gameUnlock === "undefined") def.gameUnlock = false;
        if (typeof def.event === "undefined") def.event = false;
        if (typeof def.forPlayer === "undefined") def.forPlayer = "";
      });

      const modal = document.getElementById("skin-modal");
      const modalPreview = document.getElementById("modal-preview");
      const modalTitle = document.getElementById("modal-title");
      const modalSubtitle = document.getElementById("modal-subtitle");
      const modalDetails = document.getElementById("modal-details");
      const versionControls = document.getElementById("version-controls");
      const versionLabel = document.getElementById("version-label");

      let currentModalSkinId = null;
      let currentSkinData = null;
      let currentVersionIdx = 0;

      function openSkinModal(id, data) {
        currentModalSkinId = id;
        currentSkinData = data;
        modalTitle.textContent = data.name;
        modalSubtitle.textContent =
          data.copies === "N/A" ? "Unlock Skin" : `${data.copies} Copies`;

        // Modal Details
        let detailsHtml = `<div>Artist: ${data.artist}</div>`;
        if (data.forPlayer) {
          detailsHtml += `<div style="color: #335699; font-weight: bold;">For: ${data.forPlayer}</div>`;
        }
        if (data.honorary) {
          detailsHtml += `<div class="skin-tag honorary" style="display:inline-block;">Honorary</div>`;
        }
        if (data.firstPlace) {
          detailsHtml += `<div class="skin-tag first-place" style="display:inline-block;">First Place</div>`;
        }
        if (data.competitive) {
          detailsHtml += `<div class="skin-tag competitive" style="display:inline-block;">Competitive</div>`;
        }
        if (data.unlockCode) {
          detailsHtml += `<div class="skin-tag unlock-code" style="display:inline-block;">Unlock Code</div>`;
        }
        if (data.gameUnlock) {
          detailsHtml += `<div class="skin-tag game-unlock" style="display:inline-block;">Game Unlock</div>`;
        }
        if (data.event) {
          detailsHtml += `<div class="skin-tag event" style="display:inline-block;">Event</div>`;
        }
        modalDetails.innerHTML = detailsHtml;

        // Handle Versions
        if (data.versions && data.versions.length > 0) {
          currentVersionIdx = data.versions.length - 1; // Default to latest
          versionControls.style.display = "flex";
          updateModalVersionDisplay();
        } else {
          versionControls.style.display = "none";
          updateModalImage(id);
        }

        modal.classList.add("active");
      }

      function updateModalVersionDisplay() {
        const v = currentSkinData.versions[currentVersionIdx];
        versionLabel.textContent = v.name || `v${currentVersionIdx + 1}`;
        updateModalImage(currentModalSkinId, v.img);
      }

      function updateModalImage(id, customImg) {
        const data = currentSkinData || {};
        if (id === "default") {
          modalPreview.style.backgroundImage = "none";
          modalPreview.style.backgroundColor = "#335699";
        } else {
          const ext = skinFileExtension(id);
          const img = customImg || data.img || `${id}.${ext}`;
          modalPreview.style.backgroundImage = `url('${img}')`;
          modalPreview.style.backgroundColor = data.color || "transparent";
        }
      }

      function changeVersion(dir) {
        if (!currentSkinData || !currentSkinData.versions) return;
        currentVersionIdx += dir;
        if (currentVersionIdx < 0)
          currentVersionIdx = currentSkinData.versions.length - 1;
        if (currentVersionIdx >= currentSkinData.versions.length)
          currentVersionIdx = 0;
        updateModalVersionDisplay();
      }

      function closeSkinModal() {
        modal.classList.remove("active");
      }

      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeSkinModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("active")) {
          closeSkinModal();
        }
      });

      const grid = document.getElementById("skins-grid");
      const searchInput = document.getElementById("search-input");
      const sortSelect = document.getElementById("sort-select");
      const filterBtns = document.querySelectorAll(".filter-btn");

      let currentFilter = "all";

      function renderSkins(filterText = "") {
        grid.innerHTML = "";
        const searchString = filterText.toLowerCase();
        const searchTerms = searchString.split(/\s+/).filter((t) => t);
        const sortMode = sortSelect.value;

        let count = 0;
        let skinsList = Object.entries(SKIN_DEFINITIONS);

        // Filter by Tag
        if (currentFilter !== "all") {
          skinsList = skinsList.filter(([id, data]) => data[currentFilter]);
        }

        // Filter by Search
        skinsList = skinsList.filter(([id, data]) => {
          if (searchTerms.length === 0) return true;
          const searchableText =
            `${data.name} ${id} ${data.artist} ${data.forPlayer}`.toLowerCase();
          return searchTerms.every((term) => searchableText.includes(term));
        });

        // Sort
        skinsList.sort((a, b) => {
          const [idA, dataA] = a;
          const [idB, dataB] = b;

          if (sortMode === "name_asc")
            return dataA.name.localeCompare(dataB.name);
          if (sortMode === "name_desc")
            return dataB.name.localeCompare(dataA.name);
          if (sortMode === "artist_asc")
            return dataA.artist.localeCompare(dataB.artist);
          if (sortMode === "artist_desc")
            return dataB.artist.localeCompare(dataA.artist);

          if (sortMode.startsWith("rarity")) {
            const getScore = (copies) => {
              if (copies === "N/A") return 999;
              const parts = copies.split("/");
              if (parts.length === 2) return parseInt(parts[1]);
              return 100;
            };
            const scoreA = getScore(dataA.copies);
            const scoreB = getScore(dataB.copies);
            if (sortMode === "rarity_asc") return scoreA - scoreB;
            return scoreB - scoreA;
          }
          return 0;
        });

        skinsList.forEach(([id, data]) => {
          let match = true;

          if (match) {
            count++;
            const card = document.createElement("div");
            card.className = "skin-card";
            card.title = data.name;
            card.onclick = () => openSkinModal(id, data);

            const preview = document.createElement("div");
            preview.className = "skin-preview";

            if (id === "default") {
              preview.style.backgroundImage = "none";
              preview.style.backgroundColor = "#335699";
            } else {
              // Always apply a color fallback when provided so the grid shows a
              // visible preview even if the image asset is missing.
              preview.style.backgroundColor = data.color || "transparent";
              const ext = skinFileExtension(id);
              if (data.img) {
                preview.style.backgroundImage = `url('${data.img}')`;
              } else {
                preview.style.backgroundImage = `url('${id}.${ext}')`;
              }
            }

            const name = document.createElement("div");
            name.className = "skin-name";
            name.textContent = data.name;

            const copies = document.createElement("div");
            copies.className =
              "skin-copies" + (data.copies === "1/1" ? " legendary" : "");
            copies.textContent = data.copies;

            const tags = document.createElement("div");
            tags.className = "skin-tags";

            if (data.honorary) {
              const t = document.createElement("div");
              t.className = "skin-tag honorary";
              t.textContent = "Honorary";
              tags.appendChild(t);
            }
            if (data.firstPlace) {
              const t = document.createElement("div");
              t.className = "skin-tag first-place";
              t.textContent = "1st Place";
              tags.appendChild(t);
            }
            if (data.competitive) {
              const t = document.createElement("div");
              t.className = "skin-tag competitive";
              t.textContent = "Comp";
              tags.appendChild(t);
            }
            if (data.unlockCode) {
              const t = document.createElement("div");
              t.className = "skin-tag unlock-code";
              t.textContent = "Code";
              tags.appendChild(t);
            }
            if (data.gameUnlock) {
              const t = document.createElement("div");
              t.className = "skin-tag game-unlock";
              t.textContent = "Unlock";
              tags.appendChild(t);
            }
            if (data.event) {
              const t = document.createElement("div");
              t.className = "skin-tag event";
              t.textContent = "Event";
              tags.appendChild(t);
            }

            const artist = document.createElement("div");
            artist.className = "skin-artist";
            artist.textContent = data.artist;

            card.appendChild(preview);
            card.appendChild(name);
            card.appendChild(copies);
            if (tags.children.length > 0) card.appendChild(tags);
            card.appendChild(artist);
            if (data.forPlayer) {
              const forP = document.createElement("div");
              forP.className = "skin-for";
              forP.textContent = "For: " + data.forPlayer;
              card.appendChild(forP);
            }
            grid.appendChild(card);
          }
        });

        if (count === 0) {
          grid.innerHTML = `<div class="no-results">No skins found matching "${filterText}"</div>`;
        }
      }

      searchInput.addEventListener("input", (e) => {
        renderSkins(e.target.value);
      });

      sortSelect.addEventListener("change", () => renderSkins());

      filterBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          filterBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.tag;
          renderSkins();
        });
      });

      // Initial Render
      renderSkins();
    </script>
  </body>
</html>
