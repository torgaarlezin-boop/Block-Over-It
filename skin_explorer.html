<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Skin Explorer - Block Over It</title>
        <style>
            * {
                box-sizing: border-box;
                border-radius: 0 !important;
            }
            body {
                background-color: #111;
                color: #fff;
                font-family: "Courier New", Courier, monospace;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
            }

            header {
                background-color: #1a1a1a;
                border-bottom: 4px solid #333;
                padding: 16px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                z-index: 10;
                position: relative;
                flex-shrink: 0;
            }
            .header-top {
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }
            .back-btn {
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                background: #444;
                border: 4px solid #333;
                color: #fff;
                padding: 8px 16px;
                cursor: pointer;
                text-transform: uppercase;
                font-family: inherit;
                font-size: 0.85rem;
                font-weight: bold;
                transition: all 0.2s;
                text-decoration: none;
            }
            .back-btn:hover {
                background: #335699;
                border-color: #eee;
            }
            h1 {
                margin: 0;
                font-size: clamp(1.4rem, 3.5vw, 2.2rem);
                text-transform: uppercase;
                letter-spacing: 4px;
                color: #fff;
                font-weight: 900;
                text-align: center;
            }
            .count-line {
                font-size: 0.7rem;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: #777;
            }

            #search-container {
                width: 100%;
                max-width: 650px;
            }
            #search-input {
                width: 100%;
                padding: 12px 16px;
                font-size: 1rem;
                background-color: #222;
                border: 4px solid #333;
                color: #fff;
                font-family: inherit;
                outline: none;
                text-transform: uppercase;
                transition: border-color 0.2s;
            }
            #search-input:focus {
                border-color: #335699;
            }
            #search-input::placeholder {
                color: #666;
            }

            .controls-container {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
                align-items: center;
                width: 100%;
                max-width: 800px;
            }
            .filter-tags {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .filter-btn {
                background: #222;
                border: 3px solid #333;
                color: #aaa;
                padding: 6px 12px;
                font-size: 0.8rem;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.2s;
                font-family: inherit;
                text-transform: uppercase;
            }
            .filter-btn:hover {
                background: #333;
                color: #fff;
            }
            .filter-btn.active {
                background: #335699;
                border-color: #eee;
                color: #fff;
            }
            #sort-select {
                background: #222;
                border: 3px solid #333;
                color: #fff;
                padding: 6px 12px;
                font-size: 0.8rem;
                font-weight: bold;
                font-family: inherit;
                cursor: pointer;
                outline: none;
                text-transform: uppercase;
            }
            #sort-select:focus {
                border-color: #335699;
            }

            #skins-grid {
                flex: 1;
                overflow-y: auto;
                padding: 20px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 16px;
                align-content: start;
            }
            #skins-grid::-webkit-scrollbar {
                width: 10px;
            }
            #skins-grid::-webkit-scrollbar-track {
                background: #111;
            }
            #skins-grid::-webkit-scrollbar-thumb {
                background: #333;
                border: 2px solid #111;
            }
            #skins-grid::-webkit-scrollbar-thumb:hover {
                background: #335699;
            }

            /* ---- The item card, as the game draws it ---- */
            .skin-item {
                --card: #444;
                --card-ink: #fff;
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                padding: 14px 10px 12px;
                background: #1a1a1a;
                border: 2px solid #2b2b2b;
                color: #fff;
                cursor: pointer;
                user-select: none;
            }
            .skin-item:hover {
                border-color: var(--card);
            }
            .skin-item:focus-visible {
                outline: 2px solid #fff;
                outline-offset: 2px;
            }
            .skin-item-stage {
                width: 100%;
                height: 128px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                margin-bottom: 6px;
                pointer-events: none;
            }
            .skin-item-preview {
                width: 56px;
                height: 112px;
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center bottom;
            }
            .skin-item:hover .skin-item-preview {
                animation: skinHop 0.35s ease-in-out;
            }
            .skin-platform {
                width: 72px;
                height: 10px;
                background: #444;
                border: 2px solid #333;
                box-sizing: border-box;
            }
            .skin-item-name {
                font-size: 0.85rem;
                font-weight: bold;
                color: #fff;
                text-align: center;
                line-height: 1.2;
                pointer-events: none;
            }
            /* The one coloured thing on the card */
            .skin-item-desc {
                margin-top: 2px;
                padding: 2px 8px;
                font-size: 0.6rem;
                font-weight: 900;
                letter-spacing: 1px;
                text-transform: uppercase;
                text-align: center;
                color: var(--card-ink);
                background: var(--card);
                pointer-events: none;
            }
            /* A skin with more than one drawing of it says so in the corner. */
            .skin-item-versions {
                position: absolute;
                top: 8px;
                right: 8px;
                font-size: 0.55rem;
                font-weight: 900;
                letter-spacing: 1px;
                color: #888;
                pointer-events: none;
            }

            /* ---- What the explorer adds ---- */
            .skin-tags {
                display: flex;
                gap: 4px;
                flex-wrap: wrap;
                justify-content: center;
                margin-top: 2px;
                pointer-events: none;
            }
            .skin-tag {
                font-size: 0.6rem;
                padding: 2px 6px;
                font-weight: bold;
                text-transform: uppercase;
                border: 2px solid;
            }
            .skin-tag.honorary {
                background-color: #4a2d5c;
                border-color: #9b59b6;
                color: #e0b0ff;
            }
            .skin-tag.first-place {
                background-color: #5c4a1a;
                border-color: #f1c40f;
                color: #ffe680;
            }
            .skin-tag.competitive {
                background-color: #5c3a1a;
                border-color: #e67e22;
                color: #ffc180;
            }
            .skin-tag.unlock-code {
                background-color: #14514a;
                border-color: #1abc9c;
                color: #8ef0e0;
            }
            .skin-tag.game-unlock {
                background-color: #1c5233;
                border-color: #2ecc71;
                color: #9bf0bd;
            }
            /* Yellow for summer, pumpkin for Blocktober -- both kept clear of the
         first-place gold and the competitive orange they sit next to. */
            .skin-tag.blocky-summer {
                background-color: #4a4213;
                border-color: #ffe14d;
                color: #fff3b0;
            }
            .skin-tag.blocktober {
                background-color: #4a2408;
                border-color: #ff7a18;
                color: #ffc48c;
            }
            /* Anything a skin puts in its own `tag` field. No meaning attached, so
         it reads as plain as it is: the panel colours with a pale border. */
            .skin-tag.custom {
                background-color: #222;
                border-color: #555;
                color: #ddd;
            }
            .skin-artist {
                font-size: 0.65rem;
                color: #888;
                text-align: center;
                pointer-events: none;
            }
            .skin-for {
                font-size: 0.65rem;
                color: #5588cc;
                font-weight: bold;
                text-align: center;
                pointer-events: none;
            }
            .no-results {
                grid-column: 1 / -1;
                text-align: center;
                padding: 50px 20px;
                color: #666;
                font-size: 1.1rem;
                font-weight: bold;
                text-transform: uppercase;
            }

            /* ---- Inspecting an item ----------------------------------------
         The whole screen: the skin as big as it will go on the left, every
         other skin on the right to walk through. Same flat panels and hard
         edges as the grid behind it -- the only new thing is the size. */
            .modal-overlay {
                --card: #444;
                --card-ink: #fff;
                position: fixed;
                inset: 0;
                background: #0d0d0d;
                display: none;
                z-index: 1000;
                opacity: 0;
                transition: opacity 0.15s;
            }
            .modal-overlay.active {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 360px;
            }
            /* Left: the skin on its platform, with everything it is underneath */
            .modal-content {
                position: relative;
                background: #111;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 28px 24px;
                min-width: 0;
                overflow-y: auto;
            }
            .modal-close {
                position: absolute;
                top: 16px;
                left: 16px;
                background: #444;
                border: 3px solid #333;
                color: #fff;
                width: 40px;
                height: 40px;
                font-size: 1.4rem;
                font-family: inherit;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s;
                line-height: 1;
                z-index: 2;
            }
            .modal-close:hover {
                background: #a04040;
                border-color: #eee;
            }
            .modal-preview {
                width: min(38vh, 300px);
                height: min(58vh, 460px);
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center bottom;
                flex-shrink: 0;
            }
            .skin-inspect-platform {
                width: min(48vh, 380px);
                height: 16px;
                margin-bottom: 26px;
            }
            .modal-title {
                font-size: clamp(1.4rem, 3.2vw, 2.4rem);
                font-weight: 900;
                text-transform: uppercase;
                text-align: center;
                letter-spacing: 3px;
                line-height: 1.15;
            }

            /* Right: the rest of the collection, one tile each */
            .locker-list {
                background: #141414;
                border-left: 4px solid #333;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .locker-head {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px;
                border-bottom: 4px solid #333;
                flex-shrink: 0;
            }
            .locker-head input {
                flex: 1;
                min-width: 0;
                padding: 9px 12px;
                background: #0d0d0d;
                border: 3px solid #333;
                color: #fff;
                font-family: inherit;
                font-size: 0.8rem;
                text-transform: uppercase;
                outline: none;
            }
            .locker-head input:focus {
                border-color: #335699;
            }
            .locker-count {
                font-size: 0.6rem;
                letter-spacing: 1px;
                color: #777;
                white-space: nowrap;
            }
            .locker-grid {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
                gap: 8px;
                padding: 10px;
                align-content: start;
            }
            .locker-grid::-webkit-scrollbar {
                width: 10px;
            }
            .locker-grid::-webkit-scrollbar-track {
                background: #111;
            }
            .locker-grid::-webkit-scrollbar-thumb {
                background: #333;
                border: 2px solid #111;
            }
            .locker-tile {
                --card: #444;
                background: #1a1a1a;
                border: 2px solid #2b2b2b;
                padding: 8px 4px 6px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
                cursor: pointer;
                user-select: none;
            }
            .locker-tile:hover {
                border-color: var(--card);
            }
            .locker-tile.selected {
                border-color: var(--card);
                background: #262626;
            }
            .locker-tile-preview {
                width: 34px;
                height: 68px;
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center bottom;
            }
            .locker-tile-platform {
                width: 46px;
                height: 6px;
            }
            .locker-tile-name {
                font-size: 0.55rem;
                line-height: 1.25;
                color: #bbb;
                text-align: center;
            }
            .locker-tile.selected .locker-tile-name {
                color: #fff;
            }
            .locker-empty {
                grid-column: 1 / -1;
                text-align: center;
                color: #666;
                font-size: 0.75rem;
                padding: 30px 10px;
                letter-spacing: 1px;
            }
            .skin-inspect-desc {
                display: inline-block;
                margin-top: 8px;
                padding: 3px 10px;
                font-size: 0.7rem;
                font-weight: 900;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: var(--card-ink);
                background: var(--card);
            }
            .skin-inspect-lines {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                margin: 12px 0 6px;
                font-size: 0.8rem;
                color: #9a9a9a;
                text-align: center;
                width: 100%;
            }
            .skin-inspect-lines b {
                color: #fff;
            }
            .skin-inspect-file {
                font-size: 0.7rem;
                color: #5a5a5a;
                word-break: break-all;
            }
            .modal-content .skin-tags {
                margin: 10px 0 2px;
            }
            .version-controls {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 12px;
            }
            .version-btn {
                background: #444;
                border: 3px solid #333;
                color: #fff;
                width: 34px;
                height: 34px;
                font-size: 1rem;
                font-family: inherit;
                cursor: pointer;
                font-weight: bold;
                transition: all 0.2s;
            }
            .version-btn:hover {
                background: #335699;
                border-color: #eee;
            }

            /* The loading block's jump, once */
            @keyframes skinHop {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-10px);
                }
            }
            /* The intro cube's fall: same ease-in curve */
            @keyframes skinDrop {
                from {
                    transform: translateY(-150px);
                }
                to {
                    transform: translateY(0);
                }
            }
            .modal-overlay.active .modal-preview {
                animation: skinDrop 0.4s cubic-bezier(0.6, 0.04, 0.98, 0.335)
                    both;
            }
            @media (prefers-reduced-motion: reduce) {
                .skin-item:hover .skin-item-preview,
                .modal-overlay.active .modal-preview {
                    animation: none;
                }
            }

            /* ---- Mobile: same theme, tighter layout, both orientations */
            @media (max-width: 820px) {
                header {
                    padding: 10px 12px;
                    gap: 10px;
                }
                .header-top {
                    flex-direction: row;
                    gap: 8px;
                    justify-content: flex-start;
                }
                .back-btn {
                    position: static;
                    transform: none;
                    padding: 8px 12px;
                    font-size: 0.7rem;
                    flex-shrink: 0;
                }
                h1 {
                    font-size: 1.1rem;
                    letter-spacing: 2px;
                    flex: 1;
                    text-align: center;
                }
                .count-line {
                    display: none;
                }
                #search-input {
                    padding: 10px 12px;
                    font-size: 0.9rem;
                    border-width: 3px;
                }
                /* Filters scroll sideways instead of stacking into a tall wall */
                .controls-container {
                    flex-direction: column;
                    gap: 8px;
                }
                .filter-tags {
                    flex-wrap: nowrap;
                    overflow-x: auto;
                    justify-content: flex-start;
                    width: 100%;
                    padding-bottom: 4px;
                    -webkit-overflow-scrolling: touch;
                    scrollbar-width: none;
                }
                .filter-tags::-webkit-scrollbar {
                    display: none;
                }
                .filter-btn {
                    flex-shrink: 0;
                    padding: 8px 12px;
                    font-size: 0.7rem;
                }
                #sort-select {
                    width: 100%;
                    padding: 8px 10px;
                }
                #skins-grid {
                    grid-template-columns: repeat(
                        auto-fill,
                        minmax(124px, 1fr)
                    );
                    gap: 10px;
                    padding: 12px;
                }
                .skin-item {
                    padding: 10px 6px;
                }
                .skin-item-stage {
                    height: 96px;
                }
                .skin-item-preview {
                    width: 44px;
                    height: 88px;
                }
                .skin-platform {
                    width: 60px;
                    height: 8px;
                }
                .skin-item-name {
                    font-size: 0.7rem;
                }
                .skin-tag {
                    font-size: 0.5rem;
                }
                .skin-artist,
                .skin-for {
                    font-size: 0.55rem;
                }
                /* The locker stacks: the skin on top, the rest of them underneath */
                .modal-overlay.active {
                    grid-template-columns: 1fr;
                    grid-template-rows: minmax(0, 1fr) minmax(0, 42vh);
                }
                .modal-content {
                    padding: 16px 12px;
                }
                .modal-close {
                    top: 10px;
                    left: 10px;
                    width: 34px;
                    height: 34px;
                    font-size: 1.1rem;
                }
                .modal-preview {
                    width: min(30vh, 180px);
                    height: min(40vh, 270px);
                }
                .skin-inspect-platform {
                    width: min(38vh, 230px);
                    height: 12px;
                    margin-bottom: 16px;
                }
                .locker-list {
                    border-left: none;
                    border-top: 4px solid #333;
                }
                .locker-grid {
                    grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
                }
            }

            /* Landscape phones: the header must not eat the screen */
            @media (max-width: 920px) and (orientation: landscape) and (max-height: 520px) {
                header {
                    padding: 8px 12px;
                    gap: 8px;
                }
                .header-top {
                    gap: 10px;
                }
                h1 {
                    font-size: 0.95rem;
                    letter-spacing: 1px;
                }
                /* Search and sort share a row so the grid keeps its height */
                .controls-container {
                    flex-direction: row;
                    flex-wrap: nowrap;
                    gap: 8px;
                }
                .filter-tags {
                    flex: 1;
                }
                #sort-select {
                    width: auto;
                    flex-shrink: 0;
                }
                #skins-grid {
                    grid-template-columns: repeat(
                        auto-fill,
                        minmax(112px, 1fr)
                    );
                    padding: 10px;
                }
                .skin-item-stage {
                    height: 84px;
                }
                .skin-item-preview {
                    width: 38px;
                    height: 76px;
                }
                /* Wide and short: the locker keeps its two columns, with the list
           narrower and the skin sized off the height it actually has. */
                .modal-overlay.active {
                    grid-template-columns: minmax(0, 1fr) 42vw;
                    grid-template-rows: 1fr;
                }
                .modal-content {
                    padding: 12px;
                }
                .modal-preview {
                    width: min(26vh, 150px);
                    height: min(46vh, 230px);
                }
                .skin-inspect-platform {
                    width: min(32vh, 190px);
                    height: 10px;
                    margin-bottom: 12px;
                }
                .modal-title {
                    font-size: 1.1rem;
                    letter-spacing: 2px;
                }
                .skin-inspect-lines {
                    margin: 8px 0 2px;
                    font-size: 0.7rem;
                }
                .locker-grid {
                    grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="header-top">
                <a href="index.html" class="back-btn">&larr; Back to Game</a>
                <h1>Skin Explorer</h1>
            </div>
            <div class="count-line" id="count-line"></div>
            <div id="search-container">
                <input
                    type="text"
                    id="search-input"
                    placeholder="SEARCH SKINS..."
                />
            </div>
            <div class="controls-container">
                <div class="filter-tags" id="filter-tags">
                    <button class="filter-btn active" data-tag="all">
                        All
                    </button>
                    <button class="filter-btn" data-tag="firstPlace">
                        1st Place
                    </button>
                    <button class="filter-btn" data-tag="honorary">
                        Honorary
                    </button>
                    <button class="filter-btn" data-tag="competitive">
                        Competitive
                    </button>
                    <button class="filter-btn" data-tag="unlockCode">
                        Code
                    </button>
                    <button class="filter-btn" data-tag="gameUnlock">
                        Unlock
                    </button>
                    <button class="filter-btn" data-tag="blockySummer">
                        Summer
                    </button>
                    <button class="filter-btn" data-tag="blocktober">
                        Blocktober
                    </button>
                </div>
                <select id="sort-select">
                    <option value="name_asc">Sort: Name (A-Z)</option>
                    <option value="name_desc">Sort: Name (Z-A)</option>
                    <option value="rarity_asc">Sort: Rarest First</option>
                    <option value="rarity_desc">Sort: Common First</option>
                    <option value="artist_asc">Sort: Artist (A-Z)</option>
                    <option value="artist_desc">Sort: Artist (Z-A)</option>
                </select>
            </div>
        </header>
        <div id="skins-grid"></div>

        <!-- The full view: one skin as big as the screen allows, and every other
         skin beside it to step through. -->
        <div id="skin-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="modal-close" onclick="closeSkinModal()">
                    &times;
                </button>
                <div
                    id="version-controls"
                    class="version-controls"
                    style="display: none"
                >
                    <button class="version-btn" onclick="changeVersion(-1)">
                        &lt;
                    </button>
                    <span
                        id="version-label"
                        style="font-size: 0.8rem; color: #aaa"
                        >v1</span
                    >
                    <button class="version-btn" onclick="changeVersion(1)">
                        &gt;
                    </button>
                </div>
                <div id="modal-preview" class="modal-preview"></div>
                <div class="skin-platform skin-inspect-platform"></div>
                <div id="modal-title" class="modal-title"></div>
                <div id="modal-subtitle"></div>
                <div id="modal-tags" class="skin-tags"></div>
                <div id="modal-details" class="skin-inspect-lines"></div>
            </div>
            <div class="locker-list">
                <div class="locker-head">
                    <input
                        type="text"
                        id="locker-search"
                        placeholder="SEARCH..."
                        autocomplete="off"
                        spellcheck="false"
                    />
                    <span class="locker-count" id="locker-count"></span>
                </div>
                <div class="locker-grid" id="locker-grid"></div>
            </div>
        </div>

        <!-- The skin list, shared with the game. -->
        <script src="skins.js"></script>
        <script>
            // The skin list lives in skins.js, which the game loads too. This page
            // used to carry its own copy plus a separate table of card colours, and
            // both had drifted from the game's.
            const SKIN_DEFINITIONS = window.SKIN_DEFINITIONS || {};
            if (!window.SKIN_DEFINITIONS) {
                document.title = "Skin Explorer - skins.js missing";
                console.error("skins.js did not load; no skins to show.");
            }

            const SKIN_GOLD = "#e8b923";
            const SKIN_CARD_FALLBACK = "#444";

            // Which picture a skin is drawn from, and the two that are a flat
            // colour block rather than a picture, both come from skins.js.
            const SOLID_SKIN_PREVIEW = window.SOLID_SKIN_COLORS || {};
            const SOLID_SKIN_OUTLINE = "inset 0 0 0 2px rgba(0, 0, 0, 0.4)";

            // Fill in what the shared list leaves out, so the filters and the sort
            // never have to test for a missing field.
            Object.entries(SKIN_DEFINITIONS).forEach(([id, def]) => {
                if (typeof def.honorary === "undefined") def.honorary = false;
                if (typeof def.firstPlace === "undefined")
                    def.firstPlace = false;
                if (typeof def.artist === "undefined") def.artist = "Unknown";
                if (typeof def.competitive === "undefined")
                    def.competitive = false;
                if (typeof def.unlockCode === "undefined")
                    def.unlockCode = false;
                if (typeof def.gameUnlock === "undefined")
                    def.gameUnlock = false;
                if (typeof def.blockySummer === "undefined")
                    def.blockySummer = false;
                if (typeof def.blocktober === "undefined")
                    def.blocktober = false;
                if (typeof def.forPlayer === "undefined") def.forPlayer = "";
                if (typeof def.copies === "undefined") def.copies = "";
                if (typeof def.color === "undefined") def.color = "";
                // Honorary and first-place skins get a gold card in the game.
                if (typeof def.gold === "undefined")
                    def.gold = def.honorary || def.firstPlace;
            });

            // [r, g, b] for a hex colour, or null for anything else.
            function colorChannels(color) {
                const named = {
                    white: "#ffffff",
                    black: "#000000",
                    red: "#ff0000",
                };
                const value = String(color || "")
                    .trim()
                    .toLowerCase();
                const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/.exec(
                    named[value] || value,
                );
                if (!m) return null;
                let h = m[1];
                if (h.length === 3)
                    h = h
                        .split("")
                        .map((c) => c + c)
                        .join("");
                const n = parseInt(h, 16);
                return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            }

            // Whichever of white or near-black reads better on the card colour.
            function accentInk(color) {
                const c = colorChannels(color);
                if (!c) return "#fff";
                const linear = c.map((v) => {
                    const x = v / 255;
                    return x <= 0.03928
                        ? x / 12.92
                        : Math.pow((x + 0.055) / 1.055, 2.4);
                });
                const lum =
                    0.2126 * linear[0] +
                    0.7152 * linear[1] +
                    0.0722 * linear[2];
                const onWhite = 1.05 / (lum + 0.05);
                const onDark = (lum + 0.05) / 0.054;
                return onDark > onWhite ? "#0d0d0d" : "#fff";
            }

            function skinCardColor(id) {
                const def = SKIN_DEFINITIONS[id];
                if (def && def.gold) return SKIN_GOLD;
                return def && colorChannels(def.color)
                    ? def.color
                    : SKIN_CARD_FALLBACK;
            }

            function applySkinCardVars(el, id) {
                const card = skinCardColor(id);
                el.style.setProperty("--card", card);
                el.style.setProperty("--card-ink", accentInk(card));
            }

            // The line under a skin's name: "Honorary" or "First Place" when it is
            // one of those, otherwise how many copies exist.
            function skinDescription(id) {
                const def = SKIN_DEFINITIONS[id];
                if (!def) return "";
                if (def.honorary) return "Honorary";
                if (def.firstPlace) return "First Place";
                // A skin can name its own line -- which is what the game shows on the
                // card as well.
                if (def.desc) return def.desc;
                // "N/A" as the game writes it. What it means -- that anyone can
                // unlock it by playing -- is the Unlock Skin tag's job.
                if (def.copies === "N/A") return "N/A";
                return def.copies ? def.copies + " Copies" : "";
            }

            // The picture on a preview box, or a flat colour for the two skins that
            // are drawn as plain blocks.
            function paintPreview(el, id, customImg) {
                const solid = SOLID_SKIN_PREVIEW[id];
                if (solid && !customImg) {
                    el.style.backgroundImage = "none";
                    el.style.backgroundColor = solid;
                    el.style.boxShadow = SOLID_SKIN_OUTLINE;
                    return;
                }
                el.style.backgroundColor = "transparent";
                el.style.boxShadow = "";
                el.style.backgroundImage =
                    "url('" + (customImg || skinImageFile(id)) + "')";
            }

            const TAG_LIST = [
                { key: "honorary", cls: "honorary", label: "Honorary" },
                { key: "firstPlace", cls: "first-place", label: "First Place" },
                {
                    key: "competitive",
                    cls: "competitive",
                    label: "Competitive",
                },
                { key: "unlockCode", cls: "unlock-code", label: "Unlock Code" },
                { key: "gameUnlock", cls: "game-unlock", label: "Unlock Skin" },
                {
                    key: "blockySummer",
                    cls: "blocky-summer",
                    label: "Blocky Summer",
                },
                { key: "blocktober", cls: "blocktober", label: "Blocktober" },
            ];

            // A skin's own `tag`, which can say anything: one string, or several.
            function customTags(data) {
                const raw = data && data.tag;
                if (!raw) return [];
                return (Array.isArray(raw) ? raw : [raw])
                    .map((t) => String(t).trim())
                    .filter(Boolean);
            }

            // The coloured tag under the name already says Honorary or First
            // Place, so the chip that repeats it is left off.
            function tagElements(data, headline) {
                const chip = (cls, text) => {
                    const el = document.createElement("div");
                    el.className = "skin-tag " + cls;
                    el.textContent = text;
                    return el;
                };
                const known = TAG_LIST.filter(
                    (t) => data[t.key] && t.label !== headline,
                ).map((t) => chip(t.cls, t.label));
                return known.concat(
                    customTags(data)
                        .filter((t) => t !== headline)
                        .map((t) => chip("custom", t)),
                );
            }

            // ---- The full view ---------------------------------------------------
            // One skin filling the left of the screen, and the rest of the
            // collection down the right to step through -- click a tile or use the
            // arrow keys. The list carries its own search so picking through
            // everything never means closing this and starting the grid again.
            const modal = document.getElementById("skin-modal");
            const modalPreview = document.getElementById("modal-preview");
            const modalTitle = document.getElementById("modal-title");
            const modalSubtitle = document.getElementById("modal-subtitle");
            const modalTags = document.getElementById("modal-tags");
            const modalDetails = document.getElementById("modal-details");
            const versionControls = document.getElementById("version-controls");
            const versionLabel = document.getElementById("version-label");
            const modalContent = modal.querySelector(".modal-content");
            const lockerGrid = document.getElementById("locker-grid");
            const lockerSearch = document.getElementById("locker-search");
            const lockerCount = document.getElementById("locker-count");

            let currentModalSkinId = null;
            let currentSkinData = null;
            let currentVersionIdx = 0;
            // The ids in the right-hand list, in the order they are shown; the
            // arrow keys walk this.
            let lockerOrder = [];

            function openSkinModal(id) {
                modal.classList.add("active");
                buildLockerList();
                showInLocker(id);
                requestAnimationFrame(() => {
                    modal.style.opacity = 1;
                });
            }

            function buildLockerList() {
                const terms = (lockerSearch.value || "")
                    .trim()
                    .toLowerCase()
                    .split(/\s+/)
                    .filter(Boolean);

                lockerOrder = Object.entries(SKIN_DEFINITIONS)
                    .filter(([id, data]) => {
                        if (!terms.length) return true;
                        const hay = (
                            data.name +
                            " " +
                            id +
                            " " +
                            data.artist +
                            " " +
                            data.forPlayer +
                            " " +
                            customTags(data).join(" ")
                        ).toLowerCase();
                        return terms.every((t) => hay.includes(t));
                    })
                    .sort(skinComparator(sortSelect.value))
                    .map(([id]) => id);

                lockerGrid.innerHTML = "";
                if (!lockerOrder.length) {
                    lockerGrid.innerHTML =
                        '<div class="locker-empty">Nothing matches that</div>';
                }
                lockerOrder.forEach((id) => {
                    const data = SKIN_DEFINITIONS[id];
                    const tile = document.createElement("div");
                    tile.className = "locker-tile";
                    tile.dataset.skin = id;
                    tile.title = data.name;
                    applySkinCardVars(tile, id);

                    const preview = document.createElement("div");
                    preview.className = "locker-tile-preview";
                    paintPreview(preview, id);
                    const platform = document.createElement("div");
                    platform.className = "skin-platform locker-tile-platform";
                    const name = document.createElement("div");
                    name.className = "locker-tile-name";
                    name.textContent = data.name;

                    tile.append(preview, platform, name);
                    tile.onclick = () => showInLocker(id);
                    lockerGrid.appendChild(tile);
                });

                lockerCount.textContent =
                    lockerOrder.length +
                    "/" +
                    Object.keys(SKIN_DEFINITIONS).length;
                if (currentModalSkinId) markSelectedTile(currentModalSkinId);
            }

            function markSelectedTile(id) {
                lockerGrid.querySelectorAll(".locker-tile").forEach((tile) => {
                    const on = tile.dataset.skin === id;
                    tile.classList.toggle("selected", on);
                    if (on) tile.scrollIntoView({ block: "nearest" });
                });
            }

            function showInLocker(id) {
                const data = SKIN_DEFINITIONS[id];
                if (!data) return;
                currentModalSkinId = id;
                currentSkinData = data;
                applySkinCardVars(modal, id);
                applySkinCardVars(modalContent, id);

                modalTitle.textContent = data.name;

                modalSubtitle.innerHTML = "";
                const desc = document.createElement("span");
                desc.className = "skin-inspect-desc";
                desc.textContent = skinDescription(id);
                if (desc.textContent) modalSubtitle.appendChild(desc);

                // The tags live here and nowhere else: on the grid they were six
                // small words competing with the skin.
                modalTags.innerHTML = "";
                tagElements(data, skinDescription(id)).forEach((t) =>
                    modalTags.appendChild(t),
                );

                // The explorer's own reading: who drew it, who it was for, how many
                // exist even when the line above says something else, and the file
                // the game loads for it.
                modalDetails.innerHTML = "";
                const line = (html, cls) => {
                    const el = document.createElement("div");
                    if (cls) el.className = cls;
                    el.innerHTML = html;
                    modalDetails.appendChild(el);
                };
                line("Artist: <b>" + escapeHtml(data.artist) + "</b>");
                if (data.forPlayer)
                    line(
                        '<span style="color:#5588cc">For: <b>' +
                            escapeHtml(data.forPlayer) +
                            "</b></span>",
                    );
                if (
                    data.copies &&
                    skinDescription(id) !== data.copies + " Copies"
                )
                    line("Copies: " + escapeHtml(data.copies));
                line(
                    "File: " + escapeHtml(skinImageFile(id)),
                    "skin-inspect-file",
                );

                if (data.versions && data.versions.length > 0) {
                    currentVersionIdx = data.versions.length - 1; // latest by default
                    versionControls.style.display = "flex";
                    updateModalVersionDisplay();
                } else {
                    versionControls.style.display = "none";
                    paintPreview(modalPreview, id);
                }

                // The intro cube's fall, once per skin picked
                modalPreview.style.animation = "none";
                void modalPreview.offsetWidth;
                modalPreview.style.animation = "";

                markSelectedTile(id);
            }

            // One step through the list, whichever arrow was pressed.
            function stepLocker(dir) {
                if (!lockerOrder.length) return;
                const at = lockerOrder.indexOf(currentModalSkinId);
                const next =
                    lockerOrder[
                        (at + dir + lockerOrder.length) % lockerOrder.length
                    ];
                if (next) showInLocker(next);
            }

            lockerSearch.addEventListener("input", buildLockerList);

            function updateModalVersionDisplay() {
                const v = currentSkinData.versions[currentVersionIdx];
                versionLabel.textContent =
                    v.name || "v" + (currentVersionIdx + 1);
                paintPreview(modalPreview, currentModalSkinId, v.img);
            }

            function changeVersion(dir) {
                if (!currentSkinData || !currentSkinData.versions) return;
                currentVersionIdx += dir;
                if (currentVersionIdx < 0)
                    currentVersionIdx = currentSkinData.versions.length - 1;
                if (currentVersionIdx >= currentSkinData.versions.length)
                    currentVersionIdx = 0;
                updateModalVersionDisplay();
            }

            function closeSkinModal() {
                modal.style.opacity = 0;
                setTimeout(() => modal.classList.remove("active"), 150);
            }

            document.addEventListener("keydown", (e) => {
                if (!modal.classList.contains("active")) return;
                if (e.key === "Escape") {
                    closeSkinModal();
                    return;
                }
                // Left and right belong to the caret while the search box has focus
                const typing = document.activeElement === lockerSearch;
                const dir = { ArrowDown: 1, ArrowUp: -1 }[e.key];
                const sideways = typing
                    ? 0
                    : { ArrowRight: 1, ArrowLeft: -1 }[e.key] || 0;
                if (!dir && !sideways) return;
                e.preventDefault();
                stepLocker(dir || sideways);
            });

            function escapeHtml(text) {
                const d = document.createElement("div");
                d.textContent = text == null ? "" : String(text);
                return d.innerHTML;
            }

            // ---- The grid ---------------------------------------------------------
            const grid = document.getElementById("skins-grid");
            const searchInput = document.getElementById("search-input");
            const sortSelect = document.getElementById("sort-select");
            const filterBtns = document.querySelectorAll(".filter-btn");
            const countLine = document.getElementById("count-line");

            let currentFilter = "all";

            // Shared by the grid and the full view's list, so both are in the same
            // order and stepping through one matches what you were looking at.
            function skinComparator(sortMode) {
                return ([, dataA], [, dataB]) => {
                    if (sortMode === "name_asc")
                        return dataA.name.localeCompare(dataB.name);
                    if (sortMode === "name_desc")
                        return dataB.name.localeCompare(dataA.name);
                    if (sortMode === "artist_asc")
                        return dataA.artist.localeCompare(dataB.artist);
                    if (sortMode === "artist_desc")
                        return dataB.artist.localeCompare(dataA.artist);

                    if (sortMode.startsWith("rarity")) {
                        const getScore = (copies) => {
                            if (copies === "N/A") return 999;
                            const parts = String(copies).split("/");
                            if (parts.length === 2) return parseInt(parts[1]);
                            return 100;
                        };
                        const scoreA = getScore(dataA.copies);
                        const scoreB = getScore(dataB.copies);
                        if (sortMode === "rarity_asc") return scoreA - scoreB;
                        return scoreB - scoreA;
                    }
                    return 0;
                };
            }

            function renderSkins(filterText = "") {
                grid.innerHTML = "";
                const searchString = filterText.toLowerCase();
                const searchTerms = searchString.split(/\s+/).filter((t) => t);
                const sortMode = sortSelect.value;

                let skinsList = Object.entries(SKIN_DEFINITIONS);

                // Filter by Tag
                if (currentFilter !== "all") {
                    skinsList = skinsList.filter(
                        ([id, data]) => data[currentFilter],
                    );
                }

                // Filter by Search
                skinsList = skinsList.filter(([id, data]) => {
                    if (searchTerms.length === 0) return true;
                    const searchableText =
                        `${data.name} ${id} ${data.artist} ${data.forPlayer}`.toLowerCase();
                    return searchTerms.every((term) =>
                        searchableText.includes(term),
                    );
                });

                skinsList.sort(skinComparator(sortMode));

                skinsList.forEach(([id, data]) => {
                    const card = document.createElement("div");
                    card.className = "skin-item";
                    applySkinCardVars(card, id);
                    card.dataset.skin = id;
                    card.tabIndex = 0;
                    card.setAttribute("role", "button");
                    card.setAttribute(
                        "aria-label",
                        data.name + ", " + skinDescription(id),
                    );
                    card.title = data.name;
                    card.onclick = () => openSkinModal(id);
                    card.onkeydown = (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            openSkinModal(id);
                        }
                    };

                    const stage = document.createElement("div");
                    stage.className = "skin-item-stage";
                    const preview = document.createElement("div");
                    preview.className = "skin-item-preview";
                    paintPreview(preview, id);
                    const platform = document.createElement("div");
                    platform.className = "skin-platform";
                    stage.appendChild(preview);
                    stage.appendChild(platform);
                    card.appendChild(stage);

                    if (data.versions && data.versions.length > 1) {
                        const versions = document.createElement("div");
                        versions.className = "skin-item-versions";
                        versions.textContent = data.versions.length + " VER";
                        card.appendChild(versions);
                    }

                    const name = document.createElement("div");
                    name.className = "skin-item-name";
                    name.textContent = data.name;
                    card.appendChild(name);

                    const desc = document.createElement("div");
                    desc.className = "skin-item-desc";
                    desc.textContent = skinDescription(id);
                    if (desc.textContent) card.appendChild(desc);

                    // Tags are not on the card any more -- they crowded out the skin.
                    // They are all in the full view, which has room for them.

                    const artist = document.createElement("div");
                    artist.className = "skin-artist";
                    artist.textContent = data.artist;
                    card.appendChild(artist);

                    if (data.forPlayer) {
                        const forP = document.createElement("div");
                        forP.className = "skin-for";
                        forP.textContent = "For: " + data.forPlayer;
                        card.appendChild(forP);
                    }

                    grid.appendChild(card);
                });

                const total = Object.keys(SKIN_DEFINITIONS).length;
                countLine.textContent =
                    skinsList.length === total
                        ? total + " skins"
                        : skinsList.length + " of " + total + " skins";

                if (skinsList.length === 0) {
                    grid.innerHTML = `<div class="no-results">No skins found matching "${escapeHtml(filterText)}"</div>`;
                }
            }

            searchInput.addEventListener("input", (e) => {
                renderSkins(e.target.value);
            });

            sortSelect.addEventListener("change", () =>
                renderSkins(searchInput.value),
            );

            filterBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    filterBtns.forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentFilter = btn.dataset.tag;
                    renderSkins(searchInput.value);
                });
            });

            // Initial Render
            renderSkins();
        </script>
    </body>
</html>
