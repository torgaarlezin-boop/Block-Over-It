          watcher.disconnect();
          tailWatch.disconnect();
          const i = feeds.indexOf(feed);
          if (i >= 0) feeds.splice(i, 1);
        };
        feeds.push(feed);
        more();
        return feed;
      }
      function redrawVisible() {
        feeds.forEach((f) => f.redraw());
        drawChapterPreviews();
      }

      function levelCard(row) {
        const data = (row && row.data) || {};
        const card = document.createElement("div");
        card.className = "card";
        card._row = row;
        if (row.difficulty == null && data.difficulty != null) row.difficulty = data.difficulty;
        const creator = row.creator || data.creator || "unknown";
        card.innerHTML =
          '<canvas class="preview"></canvas>' +
          '<div class="info shade">' +
          '<button class="creator shade">' + esc(creator) + "</button>" +
          '<button class="lvl-name shade">' + esc(row.name || data.name || "Untitled") + "</button>" +
          '<div class="tags gtags"></div>' +
          (row.description ? '<div class="desc">' + esc(row.description) + "</div>" : "") +
          '<button class="play">' + ICONS.play + "PLAY</button>" +
          "</div>" +
          '<div class="rail shade">' +
          '<button data-act="up" aria-label="Upvote"><span class="ico">' + ICONS.like + '</span><span class="n"></span></button>' +
          '<button data-act="down" aria-label="Downvote"><span class="ico">' + ICONS.dislike + "</span></button>" +
          '<button data-act="comments" aria-label="Comments"><span class="ico">' + ICONS.comment + '</span><span class="n">-</span></button>' +
          '<button data-act="plays" disabled style="cursor:default"><span class="ico">' + ICONS.plays + '</span><span class="n">' + fmtCount(row.plays) + "</span></button>" +
          "</div>";
        const lvl = parseLevel(data);
        card._lvl = lvl;
        card.querySelector(".play").onclick = () => playRow(row);
        card.querySelector("canvas").onclick = () => !card._swiped && playRow(row);
        // A link only when the level is linked to an account (the
        // game's rule), and to that account, not the credit's spelling
        const account = creatorAccount(row);
        const by = card.querySelector(".creator");
        if (account) by.onclick = () => openProfile(account);
        else by.classList.add("plain");
        // The level's name opens MORE INFO (everything about it)
        card.querySelector(".lvl-name").onclick = () => openInfo(card);
        card.querySelector('[data-act="up"]').onclick = () => castVote(card, 1);
        card.querySelector('[data-act="down"]').onclick = () => castVote(card, -1);
        card.querySelector('[data-act="comments"]').onclick = () => openComments(card);
        paintVotes(card);
        paintStatus(card);
        swipeModes(card, row);
        return card;
      }

      // The account a level's credit links to, or null (as the game's
      // levelCreatorAccount: the row's creator_user wins, "" means no link)
      function creatorAccount(row) {
        if (!row) return null;
        if (row.creator_user != null) return String(row.creator_user).trim() || null;
        const d = row.data && typeof row.data === "object" ? row.data : null;
        if (d && d.linkAccount !== false && d.creatorAccount) return String(d.creatorAccount);
        return null;
      }

      // ---- SWIPE: left = SPEEDRUN, right = DEATHRUN ----
      // Only sideways drags: the feed still scrolls up and down (touch-action
      // pan-y leaves vertical moves to the browser). A coloured panel follows
      // the finger and says what letting go will do.
      const SWIPE_GO = 90;
      let swipeTold = false;
      function swipeModes(card, row) {
        // Said once per device, the first time a level shows
        if (!swipeTold) {
          swipeTold = true;
          if (!store.get("boi_swipe_told"))
            setTimeout(() => {
              toast("SWIPE LEFT: SPEEDRUN · RIGHT: DEATHRUN");
              try {
                localStorage.setItem("boi_swipe_told", "1");
              } catch (e) {}
            }, 2500);
        }
        const hint = document.createElement("div");
        hint.className = "swipe-hint";
        card.appendChild(hint);
        let start = null;
        let dx = 0;
        let sideways = null;
        const paint = () => {
          const left = dx < 0;
          const w = Math.min(Math.abs(dx), card.clientWidth * 0.7);
          hint.className = "swipe-hint on " + (left ? "speed" : "death") + (Math.abs(dx) >= SWIPE_GO ? " go" : "");
          hint.style.width = w + "px";
          hint.textContent = left ? "SPEEDRUN" : "DEATHRUN";
        };
        const reset = () => {
          start = null;
          sideways = null;
          dx = 0;
          hint.className = "swipe-hint";
          hint.style.width = "0";
        };
        card.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          if (e.target.closest(".rail, .info button")) return;
          start = { x: e.clientX, y: e.clientY, id: e.pointerId };
          sideways = null;
          dx = 0;
        });
        card.addEventListener("pointermove", (e) => {
          if (!start || e.pointerId !== start.id) return;
          const mx = e.clientX - start.x;
          const my = e.clientY - start.y;
          if (sideways === null && (Math.abs(mx) > 12 || Math.abs(my) > 12)) sideways = Math.abs(mx) > Math.abs(my) * 1.3;
          if (!sideways) return;
          dx = mx;
          card._swiped = true;
          paint();
        });
        const end = (e) => {
          if (!start || (e && e.pointerId !== start.id)) return;
          const go = sideways && Math.abs(dx) >= SWIPE_GO;
          const mode = dx < 0 ? "speedrun" : "deathrun";
          reset();
          if (go) playRow(row, mode);
          // The tap that ends a swipe is not a PLAY
          setTimeout(() => (card._swiped = false), 0);
        };
        card.addEventListener("pointerup", end);
        card.addEventListener("pointercancel", reset);
        card.addEventListener("pointerleave", (e) => e.pointerType === "mouse" && reset());
      }

      // ---- MORE INFO ----
      // The game itself, when it's loaded (same origin): its /word pictures,
      // emotes, track names and verification rules
      const gameApi = () => {
        try {
          return (frameReady && frame.contentWindow && frame.contentWindow.boiApp) || null;
        } catch (e) {
          return null;
        }
      };
      // Who verified a level and its Blue Coin (the game's rules when it's
      // up; the same columns read here otherwise)
      function verificationOf(row) {
        const api = gameApi();
        const v = api && api.verification(row);
        if (v)
          return {
            clear: v.clear.verified ? v.clear.verifier : null,
            coin: v.coin.verified ? v.coin.verifier : null,
            impossible: !!v.coinImpossible,
            hasBlue: v.hasBlue,
          };
        const named = (ok, who) => (ok && typeof who === "string" && who.trim() ? who : null);
        return {
          clear: named(row.ever_verified, row.ever_verifier) || named(row.verified, row.verifier),
          coin: named(row.ever_bluecoin_verified, row.ever_bluecoin_verifier) || named(row.bluecoin_verified, row.bluecoin_verifier),
          impossible: !!row.bluecoin_impossible,
          hasBlue: hasBlueCoin(row),
        };
      }
      const TIMES_MODES = [
        ["speedrun", "SPEEDRUN", "speedrun_"],
        ["blue", "BLUE COIN", "speedrun_blue_"],
        ["deathrun", "DEATHRUN", "deathrun_"],
      ];
      // Everything about a level in a sheet: a bigger look at it, its tags,
      // who verified it, the description, plays and score, the soundtrack
      // and its times
      let infoRun = 0;
      function openInfo(card) {
        const row = card._row;
        const data = row.data || {};
        const creator = row.creator || data.creator || "unknown";
        const score = (Number(row.upvotes) || 0) - (Number(row.downvotes) || 0);
        const stat = (k, v, style) =>
          '<div class="istat"><span class="k">' + k + '</span><span class="v"' + (style ? ' style="' + style + '"' : "") + ">" + v + "</span></div>";
        const ver = verificationOf(row);
        const vtag = (cls, text, who) =>
          '<span class="tag vtag ' + cls + '">' + text + (who ? ' <button class="vwho" data-who="' + esc(who) + '">' + esc(who) + "</button>" : "") + "</span>";
        let vtags = ver.clear ? vtag("ok", "✓ VERIFIED BY", ver.clear) : vtag("no", "UNVERIFIED");
        if (ver.hasBlue)
          vtags += ver.impossible
            ? vtag("imp", '<span class="bc"></span>IMPOSSIBLE BLUE COIN')
            : ver.coin
              ? vtag("blue", '<span class="bc"></span>BLUE COIN VERIFIED BY', ver.coin)
              : vtag("blue no", '<span class="bc"></span>UNVERIFIED BLUE COIN');
        const api = gameApi();
        const music = api && api.music(data);
        const modes = TIMES_MODES.filter(([k]) => k !== "blue" || ver.hasBlue);
        const body = $("info-body");
        body.innerHTML =
          '<canvas class="info-view"></canvas>' +
          '<h2 class="info-name">' + esc(row.name || data.name || "Untitled") + "</h2>" +
          (creatorAccount(row)
            ? '<button class="info-by">BY <span>' + esc(creator) + "</span></button>"
            : '<div class="info-by plain">BY <span>' + esc(creator) + "</span></div>") +
          '<div class="tags gtags" id="info-tags"></div>' +
          (api && api.verificationLines ? '<div class="dver" id="info-ver"></div>' : '<div class="tags vtags">' + vtags + "</div>") +
          '<div class="info-desc">' + (row.description ? esc(row.description) : '<span class="dim">No description.</span>') + "</div>" +
          '<div class="istats">' +
          stat("PLAYS", fmtCount(row.plays), "color:#6a9bd8") +
          stat("SCORE", (score > 0 ? "+" : "") + score, "color:" + (score >= 0 ? "#2ecc71" : "#e74c3c")) +
          stat("VERSION", "V" + (row.version || 1), "color:#9b8cff") +
          "</div>" +
          '<div class="info-music"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg><div class="im-text">' +
          '<span class="k">SOUNDTRACK</span><span class="t">' + esc(music ? music.title : data.music ? "Custom Track" : "Synth") + "</span>" +
          (music && music.artist ? '<span class="a">' + esc(music.artist) + "</span>" : "") +
          "</div>" + (music && music.speed ? '<span class="im-speed">' + music.speed + "x SPEED</span>" : "") + "</div>" +
          '<div class="info-sec">TIMES</div>' +
          '<div class="lb-seg" style="grid-template-columns:repeat(' + modes.length + ',1fr)">' +
          modes.map(([k, label], i) => '<button data-tm="' + k + '"' + (i ? "" : ' class="on"') + ">" + (k === "blue" ? '<span class="bc"></span>' : "") + label + "</button>").join("") +
          "</div>" +
          '<div id="info-times"></div>' +
          '<div class="info-btns"><button class="btn blue" data-i="play">' + ICONS.play + " PLAY</button></div>";
        const run = ++infoRun;
        const times = (mode) => {
          body.querySelectorAll("[data-tm]").forEach((b) => b.classList.toggle("on", b.dataset.tm === mode));
          const m = TIMES_MODES.find(([k]) => k === mode);
          const mine = ++infoRun;
          drawTimes($("info-times"), m[2] + "custom_comm_" + row.id, () => mine === infoRun && $("info").classList.contains("on"),
            () => times(mode), "NO " + m[1] + " TIMES YET");
        };
        body.querySelectorAll("[data-tm]").forEach((b) => (b.onclick = () => times(b.dataset.tm)));
        times(modes[0][0]);
        // What opens next takes the sheet's place in the back history
        body.querySelector('[data-i="play"]').onclick = () => (closeInfo(true), playRow(row));
        const acct = creatorAccount(row);
        if (acct) body.querySelector(".info-by").onclick = () => (closeInfo(true), openProfile(acct));
        body.querySelectorAll(".vwho").forEach((b) => (b.onclick = () => (closeInfo(true), openProfile(b.dataset.who))));
        paintTags($("info-tags"), row);
        const verBox = $("info-ver");
        if (verBox) {
          const vroot = gameBits(verBox, api.verificationLines(row));
          // The verifiers' names open their profiles here
          const who = { "verifier-link": ver.clear, "coin-verifier-link": ver.coin };
          Object.keys(who).forEach((id) => {
            const el = vroot.getElementById(id);
            if (el && who[id]) el.onclick = () => (closeInfo(true), openProfile(who[id]));
          });
        }
        if (!$("info").classList.contains("on")) {
          try {
            history.pushState({ boiInfo: true }, "");
          } catch (e) {}
        }
        $("info-dim").classList.add("on");
        $("info").classList.add("on");
        body.scrollTop = 0;
        const cv = body.querySelector(".info-view");
        if (card._lvl)
          requestAnimationFrame(() =>
            drawLevel(cv, card._lvl, { w: cv.clientWidth, h: cv.clientHeight, top: 4, bottom: 4, min: 4, max: 14 }),
          );
        else cv.remove();
      }
      function closeInfo(fromPop) {
        if (!$("info").classList.contains("on")) return;
        $("info").classList.remove("on");
        $("info-dim").classList.remove("on");
        if (!fromPop && history.state && history.state.boiInfo) {
          skipNextPop();
          history.back();
        }
      }
      $("info-dim").onclick = () => closeInfo(false);
      $("info-close").onclick = () => closeInfo(false);

      // ---- VOTES ----
      // Remembered on this device under the same key the game uses
      // (voted_level_<id>), and sent with the game's upvote/downvote calls,
      // so a vote here shows up there and the other way round.
      const voteKey = (id) => "voted_level_" + id;
      function myVote(id) {
        const v = parseInt(store.get(voteKey(id)), 10);
        return v === 1 || v === -1 ? v : 0;
      }
      function paintVotes(card) {
        const row = card._row;
        const v = myVote(row.id);
        const up = card.querySelector('[data-act="up"]');
        const down = card.querySelector('[data-act="down"]');
        up.querySelector(".ico").classList.toggle("voted-up", v === 1);
        down.querySelector(".ico").classList.toggle("voted-down", v === -1);
        // The level's score (up minus down), as desktop shows it
        const score = (Number(row.upvotes) || 0) - (Number(row.downvotes) || 0);
        up.querySelector(".n").textContent = (score < 0 ? "-" : "") + fmtCount(Math.abs(score));
        const plays = card.querySelector('[data-act="plays"] .n');
        if (plays) plays.textContent = fmtCount(row.plays);
        up.setAttribute("aria-pressed", String(v === 1));
        down.setAttribute("aria-pressed", String(v === -1));
      }
      function setMyVote(id, v) {
        try {
          if (v) localStorage.setItem(voteKey(id), String(v));
          else localStorage.removeItem(voteKey(id));
        } catch (e) {}
      }
      // Moves the counts on every copy of the row from vote `from` to `to`
      function shiftCounts(row, from, to) {
        const up = (Number(row.upvotes) || 0) + (to === 1) - (from === 1);
        const down = (Number(row.downvotes) || 0) + (to === -1) - (from === -1);
        row.upvotes = Math.max(0, up);
        row.downvotes = Math.max(0, down);
      }
      const repaintLevel = (id) =>
        document.querySelectorAll(".card").forEach((c) => c._row && c._row.id === id && paintVotes(c));
      // Tapping the vote you gave takes it back; tapping the other one
      // moves it across. The game sends it (it holds the sign-in) with
      // boi_set_level_vote, which keeps one vote per account.
      const voteWaits = new Map();
      function castVote(card, val) {
        const row = card._row;
        if (!signedInAs()) return openView("login");
        if (!frameReady) {
          loadFrame();
          return toast("STILL LOADING, TRY AGAIN");
        }
        if (voteWaits.has(row.id)) return;
        const before = myVote(row.id);
        const next = before === val ? 0 : val;
        setMyVote(row.id, next);
        shiftCounts(row, before, next);
        repaintLevel(row.id);
        if (next) taste.vote(row, next);
        const nonce = Date.now() + ":" + Math.random();
        const wait = { nonce, row, before, next };
        wait.timer = setTimeout(() => voteDone({ nonce, levelId: row.id, ok: false, reason: "timeout" }), 10000);
        voteWaits.set(row.id, wait);
        tellGame({ type: "boi-vote", levelId: row.id, vote: next, prev: before, nonce });
      }
      function voteDone(m) {
        const wait = voteWaits.get(m.levelId);
        if (!wait || wait.nonce !== m.nonce) return;
        clearTimeout(wait.timer);
        voteWaits.delete(m.levelId);
        const row = wait.row;
        if (m.ok) {
          if (!m.legacy && m.up != null) {
            row.upvotes = m.up;
            row.downvotes = m.down;
          }
          return repaintLevel(row.id);
        }
        // Not saved: back as it was
        setMyVote(row.id, wait.before);
        shiftCounts(row, wait.next, wait.before);
        repaintLevel(row.id);
        if (m.reason === "signin") openView("login");
        else if (m.reason === "session") toast("SIGN OUT AND IN AGAIN TO CHANGE VOTES");
        else toast("COULD NOT SAVE YOUR VOTE");
      }

      // ---- COMMENTS ----
      const commentCounts = new Map();
      async function fillCommentCount(card) {
        const id = card._row.id;
        const n = card.querySelector('[data-act="comments"] .n');
        if (commentCounts.has(id)) return void (n.textContent = fmtCount(commentCounts.get(id)));
        if (!db || card._counting) return;
        card._counting = true;
        const { count, error } = await db
          .from("level_comments")
          .select("id", { count: "exact", head: true })
          .eq("level_id", id);
        card._counting = false;
        if (error) return;
        commentCounts.set(id, count || 0);
        document.querySelectorAll(".card").forEach((c) => {
          if (c._row && c._row.id === id) c.querySelector('[data-act="comments"] .n').textContent = fmtCount(count || 0);
        });
      }
      function timeAgo(iso) {
        const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
        if (!isFinite(s)) return "";
        if (s < 60) return "NOW";
        if (s < 3600) return Math.floor(s / 60) + "M";
        if (s < 86400) return Math.floor(s / 3600) + "H";
        if (s < 86400 * 30) return Math.floor(s / 86400) + "D";
        if (s < 86400 * 365) return Math.floor(s / (86400 * 30)) + "MO";
        return Math.floor(s / (86400 * 365)) + "Y";
      }
      let sheetCard = null;
      let sheetRun = 0;
      function openComments(card) {
        sheetCard = card;
        if (!$("sheet").classList.contains("on")) pushEntry({ boiSheet: true });
        $("sheet-dim").classList.add("on");
        $("sheet").classList.add("on");
        renderCommentInput();
        loadSheetComments();
      }
      function closeComments(fromPop) {
        if (!$("sheet").classList.contains("on")) return;
        $("sheet").classList.remove("on");
        $("sheet-dim").classList.remove("on");
        const input = $("comment-text");
        if (input) input.blur();
        sheetCard = null;
        if (!fromPop && history.state && history.state.boiSheet) {
          skipNextPop();
          history.back();
        }
      }
      $("sheet-close").onclick = () => closeComments(false);
      $("sheet-dim").onclick = () => closeComments(false);
      function sheetTitle(n) {
        $("sheet-title").textContent = n == null ? "COMMENTS" : fmtCount(n) + (n === 1 ? " COMMENT" : " COMMENTS");
      }
      async function loadSheetComments() {
        if (!sheetCard) return;
        const run = ++sheetRun;
        const id = sheetCard._row.id;
        const list = $("sheet-list");
        sheetTitle(commentCounts.has(id) ? commentCounts.get(id) : null);
        list.innerHTML = '<div class="feed-msg" style="height:auto;padding-top:40px">LOADING...</div>';
        if (!db) return void (list.innerHTML = '<div class="feed-msg" style="height:auto">NOT CONNECTED</div>');
        const { data, error } = await db
          .from("level_comments")
          .select("*")
          .eq("level_id", id)
          .order("created_at", { ascending: false })
          .limit(100);
        if (run !== sheetRun) return;
        if (error) {
          list.innerHTML = '<div class="feed-msg" style="height:auto;padding-top:40px">COULD NOT LOAD COMMENTS<button class="btn">TRY AGAIN</button></div>';
          list.querySelector("button").onclick = loadSheetComments;
          return;
        }
        const rows = data || [];
        if (rows.length < 100) {
          commentCounts.set(id, rows.length);
          sheetTitle(rows.length);
          document.querySelectorAll(".card").forEach((c) => {
            if (c._row && c._row.id === id) c.querySelector('[data-act="comments"] .n').textContent = fmtCount(rows.length);
          });
        }
        if (!rows.length) {
          list.innerHTML = '<div class="feed-msg" style="height:auto;padding-top:40px">NO COMMENTS YET<br>BE THE FIRST</div>';
          return;
        }
        list.innerHTML = "";
        // The game is up: each comment exactly as the level page draws it
        // (badges, emote, Edit / Delete), with its profile links and
        // questions answered here instead of in the hidden game
        const api = gameApi();
        if (api && api.commentRows) {
          const card = sheetCard;
          const level = { id, appReload: () => sheetCard === card && loadSheetComments() };
          const nodes = await api.commentRows(rows, level, {
            profile: (name) => {
              closeComments(false);
              openProfile(name);
            },
            confirm: (title, text, yes) => ask(title, text, "OK", yes),
            moderate: () => {
              closeComments(false);
              openLevelPage(card._row);
            },
          });
          if (run !== sheetRun) return;
          list.innerHTML = "";
          list.classList.add("desk");
          nodes.forEach((node) => {
            if (!node) return;
            const host = document.createElement("div");
            host.className = "dcmt";
            const root = gameBits(host, node);
            // An emote's press opens its viewer in the hidden game: not here
            ["click", "pointerdown", "pointerup", "keydown"].forEach((t) =>
              root.addEventListener(t, (e) => e.target.closest && e.target.closest(".comment-emote") && e.stopPropagation(), true),
            );
            list.appendChild(host);
          });
          return;
        }
        list.classList.remove("desk");
        rows.forEach((c) => {
          const el = document.createElement("div");
          el.className = "cmt";
          const name = c.username || "unknown";
          const badges =
            (c.show_progress && c.beaten ? '<span class="badge">BEATEN</span>' : "") +
            (c.show_progress && c.blue_coin ? '<span class="badge blue">BLUE COIN</span>' : "");
          const text = c.deleted ? "Comment Deleted" : c.content || "";
          el.innerHTML =
            '<div class="cbody"><div class="cwho"><button class="cname">' + esc(name) + "</button>" +
            badges + "<span>" + timeAgo(c.created_at) + (c.edited && !c.deleted ? " &middot; EDITED" : "") + "</span></div>" +
            (text ? '<div class="ctext' + (c.deleted ? " gone" : "") + '"></div>' : "") +
            (!c.deleted && c.emote ? '<div class="cemote"></div>' : "") +
            "</div>";
          const textBox = el.querySelector(".ctext");
          // /jumppad, /lava, skin names... drawn the game's way
          // (Blocky Emojis only for SEC members' comments)
          const api0 = gameApi();
          const secAuthor = !api0 || !api0.isSecName || api0.isSecName(c.username);
          if (textBox) gameBits(textBox, c.deleted || !secAuthor ? esc(text) : tokensIn(text));
          const emoteBox = el.querySelector(".cemote");
          if (emoteBox) {
            const api = gameApi();
            const pv = api && api.commentEmote(c);
            if (pv) {
              gameBits(emoteBox, pv);
              // Its press opens a viewer in the (hidden) game: not here
              ["click", "pointerdown", "pointerup", "keydown"].forEach((t) =>
                emoteBox.addEventListener(t, (e) => e.stopPropagation(), true),
              );
            } else emoteBox.remove();
          }
          const open = () => {
            closeComments(false);
            openProfile(name);
          };
          el.querySelector(".cname").onclick = open;
          list.appendChild(el);
        });
      }
      function renderCommentInput() {
        const box = $("sheet-input");
        if (!signedInAs()) {
          box.innerHTML = '<button class="btn blue wide">SIGN IN TO COMMENT</button>';
          box.firstChild.onclick = () => {
            closeComments(false);
            openView("login");
          };
          return;
        }
        const api = gameApi();
        const emotes = api ? api.myEmotes() : [];
        commentEmote = null;
        box.innerHTML =
          '<label class="cmt-progress"><input type="checkbox" id="comment-progress" /> SHOW MY PROGRESS</label>' +
          '<div class="cmt-extra" id="cmt-extra"></div>' +
          '<div class="cmt-row">' +
          '<input id="comment-text" type="text" maxlength="500" placeholder="Comment" enterkeyhint="send" autocomplete="off" />' +
          '<button class="btn" id="comment-emote" aria-label="Emote">EMOTE</button>' +
          '<button class="btn" id="comment-post">POST</button></div>';
        $("comment-post").onclick = sendComment;
        const input = $("comment-text");
        input.addEventListener("keydown", (e) => e.key === "Enter" && sendComment());
        input.addEventListener("input", suggestTokens);
        input.addEventListener("click", suggestTokens);
        // Your emotes as they are now (the game may have loaded since)
        $("comment-emote").onclick = () => {
          const now = gameApi();
          if (!now) {
            loadFrame();
            return toast("STILL LOADING, TRY AGAIN");
          }
          showEmotePicker(now.myEmotes());
        };
      }

      // ---- the game's drawing, inside the app ----
      // The game frame is same-origin: its stylesheet is loaded once into a
      // shared sheet, and anything the game draws (a /word picture, an
      // emote) goes in a small shadow root that has it, so it looks exactly
      // as it does in the game and the game's CSS touches nothing else here.
      let gameSheet = null;
      function gameSheetNow() {
        if (gameSheet) return gameSheet;
        const api = gameApi();
        if (!api) return null;
        try {
          gameSheet = new CSSStyleSheet();
          gameSheet.replaceSync(api.css());
        } catch (e) {
          gameSheet = { text: api.css() };
        }
        return gameSheet;
      }
      function gameBits(host, content) {
        const root = host.shadowRoot || host.attachShadow({ mode: "open" });
        root.innerHTML = "";
        const sheet = gameSheetNow();
        if (sheet && sheet.text != null) {
          const st = document.createElement("style");
          st.textContent = sheet.text;
          root.appendChild(st);
        } else if (sheet) root.adoptedStyleSheets = [sheet];
        const wrap = document.createElement("span");
        wrap.style.cssText = "font:inherit;color:inherit;white-space:pre-wrap;overflow-wrap:anywhere";
        if (typeof content === "string") wrap.innerHTML = content;
        else wrap.appendChild(content);
        root.appendChild(wrap);
        return root;
      }
      const tokensIn = (text) => {
        const api = gameApi();
        const safe = esc(text);
        return api ? api.tokens(safe) : safe;
      };

      // Typing /something: the pictures it could be, tap one to put it in
      function suggestTokens() {
        const input = $("comment-text");
        const extra = $("cmt-extra");
        const api = gameApi();
        if (!input || !extra || !api) return;
        if (extra.dataset.kind === "emotes") return;
        const upTo = input.value.slice(0, input.selectionStart == null ? input.value.length : input.selectionStart);
        // Blocky Emojis are an SEC benefit
        const m = !api.isSec || api.isSec() !== false ? upTo.match(/\/([A-Za-z0-9_]*)$/) : null;
        if (!m) {
          if (extra.dataset.kind === "tokens") {
            extra.innerHTML = "";
            extra.dataset.kind = "";
            paintPicked();
          }
          return;
        }
        const hits = api.tokenMatches(m[1], 30);
        extra.dataset.kind = "tokens";
        extra.innerHTML = hits.length ? "" : '<span class="cx-none">NO PICTURE CALLED /' + esc(m[1]) + "</span>";
        hits.forEach((h) => {
          const b = document.createElement("button");
          b.className = "cx-chip";
          const pic = document.createElement("span");
          pic.className = "cx-pic";
          gameBits(pic, h.html);
          const label = document.createElement("span");
          label.textContent = "/" + h.key;
          b.append(pic, label);
          b.onclick = () => {
            const start = upTo.length - m[0].length;
            const after = input.value.slice(upTo.length);
            input.value = input.value.slice(0, start) + "/" + h.key + " " + after.replace(/^\s+/, "");
            const at = start + h.key.length + 2;
            input.focus();
            input.setSelectionRange(at, at);
            suggestTokens();
          };
          extra.appendChild(b);
        });
      }

      // One emote can go with a comment (one per level, like the game)
      let commentEmote = null;
      function showEmotePicker(emotes) {
        const extra = $("cmt-extra");
        const api = gameApi();
        if (!extra || !api) return;
        if (extra.dataset.kind === "emotes") {
          extra.dataset.kind = "";
          return paintPicked();
        }
        extra.dataset.kind = "emotes";
        extra.innerHTML = emotes.length ? "" : '<span class="cx-none">NO EMOTES YET - GET THEM IN THE SHOP OR FROM CRATES</span>';
        emotes.forEach((id) => {
          const b = document.createElement("button");
          b.className = "cx-emote" + (id === commentEmote ? " on" : "");
          b.setAttribute("aria-label", api.emoteName(id));
          // (a button can't hold a shadow root: a span inside it does)
          const tile = document.createElement("span");
          tile.className = "cx-epv";
          b.appendChild(tile);
          gameBits(tile, api.emoteTile(id));
          b.onclick = () => {
            commentEmote = id === commentEmote ? null : id;
            extra.dataset.kind = "";
            paintPicked();
          };
          extra.appendChild(b);
        });
      }
      // The emote waiting to go with the comment
      function paintPicked() {
        const extra = $("cmt-extra");
        const api = gameApi();
        if (!extra || extra.dataset.kind) return;
        extra.innerHTML = "";
        if (!commentEmote || !api) return;
        const box = document.createElement("div");
        box.className = "cx-picked";
        const pv = document.createElement("span");
        pv.className = "cx-epv";
        gameBits(pv, api.commentEmote({ emote: commentEmote, emote_skin: api.mySkin(), username: signedInAs() }));
        ["click", "pointerdown", "pointerup", "keydown"].forEach((t) => pv.addEventListener(t, (e) => e.stopPropagation(), true));
        const name = document.createElement("span");
        name.textContent = api.emoteName(commentEmote);
        const off = document.createElement("button");
        off.className = "btn";
        off.textContent = "REMOVE";
        off.onclick = () => {
          commentEmote = null;
          paintPicked();
        };
        box.append(pv, name, off);
        extra.appendChild(box);
      }
      let commentWait = null;
      // Posting goes through the game: it knows who is signed in
      function sendComment() {
        const input = $("comment-text");
        const text = input ? input.value.trim() : "";
        if ((!text && !commentEmote) || !sheetCard || commentWait) return;
        if (!frameReady) {
          loadFrame();
          return toast("STILL LOADING, TRY AGAIN");
        }
        const nonce = Date.now() + ":" + Math.random();
        commentWait = { nonce, levelId: sheetCard._row.id };
        $("comment-post").disabled = true;
        $("comment-post").textContent = "...";
        const progress = $("comment-progress");
        tellGame({ type: "boi-comment", levelId: sheetCard._row.id, text, emote: commentEmote, showProgress: !!(progress && progress.checked), nonce });
        setTimeout(() => commentWait && commentWait.nonce === nonce && commentDone({ ok: false, nonce }), 10000);
      }
      // The game's answer to a posted comment
      function commentDone(m) {
        if (!commentWait || m.nonce !== commentWait.nonce) return;
        const levelId = commentWait.levelId;
        commentWait = null;
        const btn = $("comment-post");
        if (btn) {
          btn.disabled = false;
          btn.textContent = "POST";
        }
        if (!m.ok) {
          if (m.reason === "signin") return renderCommentInput();
          if (m.reason === "emote-used") {
            commentEmote = null;
            paintPicked();
            return toast("YOU'VE ALREADY USED AN EMOTE ON THIS LEVEL");
          }
          return toast("COULD NOT POST THE COMMENT");
        }
        const input = $("comment-text");
        if (input) input.value = "";
        commentEmote = null;
        const extra = $("cmt-extra");
        if (extra) {
          extra.dataset.kind = "";
          extra.innerHTML = "";
        }
        commentCounts.delete(levelId);
        if (sheetCard && sheetCard._row.id === levelId) loadSheetComments();
      }

      function drawCard(card) {
        if (card._drawn) return;
        card._drawn = true;
        const r = card.getBoundingClientRect();
        const info = card.querySelector(".info");
        const infoH = info ? info.offsetHeight + 24 : 200;
        drawLevel(card.querySelector("canvas"), card._lvl, {
          w: r.width || card.clientWidth,
          h: r.height || card.clientHeight,
          top: 56,
          bottom: infoH,
        });
      }

      // ---- where rows come from ----
      const base = () => db.from(LEVELS_VIEW).select("*");
      async function rowsOrThrow(q) {
        const { data, error } = await q;
        if (error) throw error;
        return data || [];
      }
      function pagedLoader(build) {
        let offset = 0;
        return async () => {
          const rows = await rowsOrThrow(build().range(offset, offset + PAGE - 1));
          offset += PAGE;
          return rows;
        };
      }
      // ---- TASTE: what this player seems to like ----
      // Learnt on this device from what they do in the feed and the game:
      //  - creators: watching a level to the end of its card, playing it,
      //    upvoting it and beating it count for its creator; a quick swipe
      //    away and a downvote count against
      //  - difficulty: a spread over the ten difficulties of the levels they
      //    stay on, play, like and beat, plus how far they are in the
      //    campaign (their skill), so the feed sits near what they can do
      //  - rating: how the people who voted liked a level (smoothed), plays
      //    per day, and the game's own marks (verified, featured...)
      // Old evidence fades, so the taste can move.
      const TASTE_KEY = "boi_mobile_taste_v2";
      const taste = (() => {
        let t = null;
        try {
          t = JSON.parse(store.get(TASTE_KEY) || "null");
        } catch (e) {}
        if (!t || typeof t !== "object") {
          // What v1 learnt is kept
          let old = null;
          try {
            old = JSON.parse(store.get("boi_mobile_taste_v1") || "null");
          } catch (e) {}
          t = old && typeof old === "object" ? { seen: old.seen, played: old.played, creators: old.creators } : {};
        }
        t.seen = t.seen || {}; // level id -> times shown
        t.played = t.played || {}; // level id -> 1
        t.creators = t.creators || {}; // creator (lower case) -> affinity
        t.names = t.names || {}; // creator (lower case) -> as written
        t.hist = Array.isArray(t.hist) && t.hist.length === 11 ? t.hist : new Array(11).fill(0);
        t.beatenSeen = t.beatenSeen || {}; // beaten level ids already learnt from
        let saveTimer = null;
        function save() {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            // Kept small: the newest 1500 levels seen, 300 creators
            const trim = (o, max) => {
              const k = Object.keys(o);
              if (k.length > max) k.slice(0, k.length - max).forEach((x) => delete o[x]);
            };
            trim(t.seen, 1500);
            trim(t.played, 1500);
            trim(t.beatenSeen, 1500);
            trim(t.creators, 300);
            trim(t.names, 300);
            try {
              localStorage.setItem(TASTE_KEY, JSON.stringify(t));
            } catch (e) {}
          }, 400);
        }
        const creatorName = (row) => String(row.creator || (row.data && row.data.creator) || "");
        const creatorOf = (row) => creatorName(row).toLowerCase();
        const diffOf = (row) => {
          const d = parseInt(row.difficulty != null ? row.difficulty : row.data && row.data.difficulty, 10);
          return d >= 1 && d <= 10 ? d : 0;
        };
        function nudge(row, by) {
          const c = creatorOf(row);
          if (!c) return;
          t.creators[c] = Math.max(-6, Math.min(8, (t.creators[c] || 0) + by));
          t.names[c] = creatorName(row);
        }
        function learnDifficulty(row, weight) {
          const d = diffOf(row);
          if (!d) return;
          for (let i = 1; i <= 10; i++) t.hist[i] *= 0.97;
          t.hist[d] += weight;
          // A little for the difficulties either side
          if (d > 1) t.hist[d - 1] += weight * 0.35;
          if (d < 10) t.hist[d + 1] += weight * 0.35;
        }
        // How far they are in the campaign, as a difficulty they can manage
        function skill() {
          const chapters = (gameState && gameState.chapters) || [];
          let s = 2;
          chapters.forEach((ch) => {
            if (ch.beaten) s += 1.2;
            else if (ch.open) {
              const done = ch.levels.filter((l) => !l.locked).length;
              s += (1.2 * Math.max(0, done - 1)) / Math.max(1, ch.levels.length);
            }
          });
          return Math.min(9, s);
        }
        // The difficulty they seem to want, and how sure that is
        function wanted() {
          let sum = 0;
          let n = 0;
          for (let i = 1; i <= 10; i++) {
            sum += i * t.hist[i];
            n += t.hist[i];
          }
          const sk = skill();
          if (n < 1) return { d: sk, sure: 0.2 };
          const k = Math.min(1, n / 8);
          return { d: (sum / n) * k + sk * (1 - k), sure: 0.3 + 0.7 * k };
        }
        // Beaten levels teach difficulty and creator once each
        function learnBeaten(row, beaten) {
          if (!beaten || !beaten.has(String(row.id)) || t.beatenSeen[row.id]) return;
          t.beatenSeen[row.id] = 1;
          learnDifficulty(row, 1.5);
          nudge(row, 1);
          save();
        }
        return {
          // A level left after `ms` on screen
          view(row, ms) {
            t.seen[row.id] = (t.seen[row.id] || 0) + 1;
            if (ms < 1200) {
              nudge(row, -0.3);
              learnDifficulty(row, -0.15);
            } else if (ms > 6000) {
              nudge(row, 0.5);
              learnDifficulty(row, 0.5);
            }
            for (let i = 1; i <= 10; i++) t.hist[i] = Math.max(0, t.hist[i]);
            save();
          },
          played(row) {
            t.played[row.id] = 1;
            nudge(row, 2);
            learnDifficulty(row, 2);
            save();
          },
          vote(row, val) {
            nudge(row, val > 0 ? 2 : -3);
            if (val > 0) learnDifficulty(row, 1.5);
            save();
          },
          // Creators they like most, as written, for the pool
          favourites(n) {
            return Object.keys(t.creators)
              .filter((c) => t.creators[c] >= 1.5 && t.names[c])
              .sort((a, b) => t.creators[b] - t.creators[a])
              .slice(0, n)
              .map((c) => t.names[c]);
          },
          // How much this player should see a level now (higher = sooner)
          score(row, beaten) {
            learnBeaten(row, beaten);
            const up = Number(row.upvotes) || 0;
            const down = Number(row.downvotes) || 0;
            const plays = Number(row.plays) || 0;
            let s = 0;
            // RATING: liked by the people who voted (smoothed toward 70%,
            // so a 1-0 level is not 100%) and how sure that is
            const liked = (up + 7) / (up + down + 10);
            s += 4 * (liked - 0.5) * Math.min(1, (up + down) / 6 + 0.4);
            // POPULAR: lots of plays and upvotes count for a lot, and so do
            // plays a day since it came out (popular right now)
            s += Math.min(3.5, 1.1 * Math.log10(plays + 1));
            s += Math.min(2, 0.9 * Math.log10(up + 1));
            const born = Date.parse(row.first_created_at || row.created_at);
            const days = born ? Math.max(1, (Date.now() - born) / 864e5) : 60;
            s += Math.min(2.5, 1.0 * Math.log10(plays / days + 1));
            if (popularIds.has(row.id)) s += 1.5;
            if (row.verified || row.ever_verified) s += 1;
            if (row.featured) s += 1.5;
            if (row.legendary) s += 1;
            if (row.official_rating) s += 0.5;
            // IMPOSSIBLE levels are rare: pushed far down, with only a small
            // chance each time of being let through
            if (row.impossible && Math.random() > 0.05) s -= 10;
            // New levels get a lift for their first couple of weeks
            if (born) s += 1.5 * Math.exp(-(days - 1) / 14);
            // CREATOR: ones they like, ones they skip
            s += 0.7 * (t.creators[creatorOf(row)] || 0);
            // DIFFICULTY: near what they want; much harder is worse than
            // a bit easier
            const d = diffOf(row);
            if (d) {
              const w = wanted();
              const off = d - w.d;
              s -= w.sure * (off > 0 ? 0.75 * off : 0.45 * -off);
              let top = 0;
              for (let i = 1; i <= 10; i++) top = Math.max(top, t.hist[i]);
              if (top > 0) s += 1.2 * w.sure * (t.hist[d] / top);
            }
            // Already seen, played, rated or beaten: much later
            s -= 2.5 * Math.min(3, t.seen[row.id] || 0);
            if (t.played[row.id]) s -= 4;
            if (myVote(row.id)) s -= 3;
            if (beaten && beaten.has(String(row.id))) s -= 6;
            // A little luck, so the feed is never the same twice
            return s + Math.random() * 1.5;
          },
          creatorOf,
        };
      })();

      // For You: a pool of levels from random places in the whole catalogue,
      // some of the newest, and some by creators this player likes, ranked
      // by taste.score; each page is the best few, with no creator twice in
      // a row and at most two per page.
      function forYouLoader() {
        let total = null;
        const usedPages = new Set();
        const inPool = new Set();
        let pool = [];
        let lastCreator = null;
        let exhausted = false;
        let favPage = 0;
        let popPage = 0;
        let topPage = 0;
        async function refill() {
          if (total == null) {
            const { count, error } = await db.from(LEVELS_VIEW).select("id", { count: "exact", head: true });
            if (error) throw error;
            total = count || 0;
          }
          const pages = Math.max(1, Math.ceil(total / PAGE));
          const pick = () => {
            if (usedPages.size >= pages) return null;
            let p;
            do p = Math.floor(Math.random() * pages);
            while (usedPages.has(p));
            usedPages.add(p);
            return p;
          };
          const want = [pick(), pick()].filter((p) => p != null);
          const asks = want.map((p) => base().order("id", { ascending: true }).range(p * PAGE, p * PAGE + PAGE - 1));
          // One page from the newest 80 levels each time
          const fresh = Math.floor(Math.random() * 10);
          asks.push(base().order("id", { ascending: false }).range(fresh * PAGE, fresh * PAGE + PAGE - 1));
          // ...a page of what's POPULAR now (the POPULAR tab's list) and
          // of the most played ever, so popular levels come round often
          let popAsk = -1;
          if (popPage < 4) {
            popAsk = asks.length;
            asks.push(popularQuery().range(popPage * PAGE, popPage * PAGE + PAGE - 1));
            popPage++;
          }
          if (topPage < 8) {
            asks.push(base().order("plays", { ascending: false }).order("id", { ascending: false }).range(topPage * PAGE, topPage * PAGE + PAGE - 1));
            topPage++;
          }
          // ...and the best-liked levels of their favourite creators
          const favs = taste.favourites(4);
          if (favs.length && favPage < 6) {
            asks.push(
              base()
                .in("creator", favs)
                .order("upvotes", { ascending: false })
                .order("id", { ascending: false })
                .range(favPage * PAGE, favPage * PAGE + PAGE - 1),
            );
            favPage++;
          }
          const results = await Promise.all(asks.map((q) => rowsOrThrow(q).catch(() => [])));
          if (popAsk >= 0) (results[popAsk] || []).forEach((r) => r && popularIds.add(r.id));
          let added = 0;
          results.flat().forEach((r) => {
            if (!r || r.id == null || inPool.has(r.id)) return;
            inPool.add(r.id);
            pool.push(r);
            added++;
          });
          if (!want.length && !added) exhausted = true;
        }
        return async () => {
          if (pool.length < PAGE * 2 && !exhausted) await refill();
          if (!pool.length) return [];
          const beaten = new Set(((gameState && gameState.beaten) || []).map(String));
          pool.forEach((r) => (r._score = taste.score(r, beaten)));
          pool.sort((a, b) => b._score - a._score);
          const out = [];
          const perCreator = {};
          const rest = [];
          for (const r of pool) {
            const c = taste.creatorOf(r);
            if (out.length < PAGE && c !== lastCreator && (perCreator[c] || 0) < 2) {
              out.push(r);
              perCreator[c] = (perCreator[c] || 0) + 1;
              lastCreator = c;
            } else rest.push(r);
          }
          // Only one creator left in the pool: let them through
          if (!out.length) out.push(...rest.splice(0, PAGE));
          pool = rest;
          return out;
        };
      }
      // POPULAR, the way the game's Popular is: the most upvoted of the
      // levels first put up in the last 20 days, newest first on a tie
      const POPULAR_DAYS = 20;
      function popularQuery() {
        const since = new Date(Date.now() - POPULAR_DAYS * 864e5).toISOString();
        return base()
          .gte("first_created_at", since)
          .order("upvotes", { ascending: false })
          .order("created_at", { ascending: false });
      }
      // Levels on the POPULAR list right now (For You lifts them)
      const popularIds = new Set();
      const LOADERS = {
        foryou: forYouLoader,
        new: () => pagedLoader(() => base().order("id", { ascending: false })),
        popular: () => pagedLoader(popularQuery),
      };

      // The address follows the level on screen, so a copied link is it
      function followLevel(row) {
        if (!row) return;
        try {
          history.replaceState(history.state, "", location.pathname + "?level=" + row.id);
        } catch (e) {}
      }

      let mainFeed = null;
      let firstRow = null; // a ?level= link goes first
      function startMainFeed(sort) {
        feedSort = sort;
        document.querySelectorAll(".sort[data-sort]").forEach((b) => b.classList.toggle("on", b.dataset.sort === sort));
        if (mainFeed) mainFeed.dispose();
        if (!db) {
          $("feed").innerHTML = '<div class="feed-msg">NOT CONNECTED<button class="btn" onclick="location.reload()">RELOAD</button></div>';
          return;
        }
        const load = LOADERS[sort]();
        let lead = firstRow ? [firstRow] : null;
        firstRow = null;
        mainFeed = makeFeed(
          $("feed"),
          async () => {
            if (lead) {
              const rows = lead.concat(await load());
              lead = null;
              return rows;
            }
            return load();
          },
          { onCurrent: (row) => currentTab === "levels" && !panel && followLevel(row) },
        );
      }
      document.querySelectorAll(".sort[data-sort]").forEach((b) => {
        b.onclick = () => {
          const wasPanel = !!panel;
          showPanel(null);
          if (b.classList.contains("on") && mainFeed) {
            if (!wasPanel) mainFeed.el.scrollTo({ top: 0 });
            return;
          }
          startMainFeed(b.dataset.sort);
        };
      });
      document.querySelectorAll(".sort[data-panel]").forEach((b) => {
        b.onclick = () => showPanel(b.dataset.panel);
      });
      $("shop-btn").onclick = () => openView("shop");

      // ---- LIVE and LEADERBOARDS: tabs of the levels screen ----
      // The feed stays where it was underneath; the header goes solid and
      // the tab is lit instead of the feed's sort.
      let panel = null;
      let feedSort = "foryou";
      function showPanel(name) {
        if (panel === name) return;
        const was = panel;
        panel = name;
        $("live-panel").classList.toggle("on", name === "live");
        $("boards-panel").classList.toggle("on", name === "boards");
        $("feed-head").classList.toggle("solid", !!name);
        document.querySelectorAll(".sort").forEach((b) =>
          b.classList.toggle("on", name ? b.dataset.panel === name : b.dataset.sort === feedSort),
        );
        const lit = document.querySelector(".sort.on");
        if (lit) lit.scrollIntoView({ inline: "nearest", block: "nearest" });
        if (was === "live") stopLiveWatch();
        if (name === "live") startLiveWatch();
        if (name === "boards") renderBoards();
        if (name) {
          try {
            history.replaceState(history.state, "", location.pathname);
          } catch (e) {}
        } else if (mainFeed && mainFeed.current) followLevel(mainFeed.current._row);
      }

      // ---- LIVE ----
      // The game keeps the lobby up while this is open and sends what is in
      // it every second (boi-live); making or joining a room opens the game.
      let liveInfo = null;
      const livePanelOn = () => currentTab === "levels" && panel === "live";
      function startLiveWatch() {
        buildLive();
        renderLive();
        if (frameReady) tellGame({ type: "boi-live-watch", on: true });
        else loadFrame();
      }
      function stopLiveWatch() {
        if (frameReady && !frameOpen) tellGame({ type: "boi-live-watch", on: false });
      }
      function onLive(m) {
        liveInfo = m;
        if (livePanelOn()) renderLive();
      }
      function buildLive() {
        const el = $("live-body");
        if (el._built) return;
        el._built = true;
        el.innerHTML =
          '<div id="live-guest" class="panel-in" style="display:none;padding-top:40px">' +
          '<div class="note">SIGN IN TO PLAY LIVE</div><button class="btn blue" id="live-signin">SIGN IN</button></div>' +
          '<div id="live-main" class="panel-in">' +
          '<div class="live-who"><div class="sw" id="live-sw"></div><div style="min-width:0"><div class="sub">PLAYING AS</div><div id="live-name" style="overflow-wrap:anywhere"></div></div></div>' +
          '<div class="note" id="live-status"></div>' +
          '<button class="btn blue live-create" id="live-create">CREATE ROOM</button>' +
          '<div class="live-join" id="live-join-row"><input id="live-code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code" enterkeyhint="go" />' +
          '<button class="btn" id="live-join">JOIN</button></div>' +
          '<div class="label">OPEN ROOMS</div><div class="board" id="live-rooms"></div></div>';
        $("live-signin").onclick = () => openView("login");
        $("live-create").onclick = () => {
          const s = liveInfo && liveInfo.status;
          if (s === "full" || s === "offline") {
            tellGame({ type: "boi-live-watch", on: false });
            tellGame({ type: "boi-live-watch", on: true });
            return;
          }
          openGame({ type: "boi-live-go", create: true });
        };
        const input = $("live-code");
        input.oninput = () => (input.value = input.value.toUpperCase().replace(/[^A-Z]/g, ""));
        input.onkeydown = (e) => e.key === "Enter" && $("live-join").click();
        $("live-join").onclick = () => joinLive(input.value);
      }
      function joinLive(code) {
        code = String(code || "").toUpperCase().replace(/[^A-Z]/g, "");
        if (code.length !== 4) return toast("ROOM CODES ARE 4 LETTERS");
        const rooms = (liveInfo && liveInfo.rooms) || [];
        const r = rooms.find((x) => x.code === code);
        if (!liveInfo || liveInfo.status !== "on") return toast("NOT CONNECTED YET");
        if (!r) return toast("NO ROOM CALLED " + code);
        if (r.count >= r.size) return toast("ROOM " + code + " IS FULL");
        if (!r.sameVersion) return toast("THAT ROOM IS ON ANOTHER VERSION");
        $("live-code").blur();
        openGame({ type: "boi-live-go", code });
      }
      const LIVE_STATUS = {
        on: "",
        full: "SERVERS FULL, TRY AGAIN SOON",
        offline: "CAN'T REACH THE SERVERS",
        reconnecting: "RECONNECTING...",
        missing: "LIVE DIDN'T LOAD, RELOAD THE APP",
      };
      let liveRoomsSig = "";
      function renderLive() {
        buildLive();
        const user = signedInAs();
        $("live-guest").style.display = user ? "none" : "";
        $("live-main").style.display = user ? "" : "none";
        if (!user) return;
        const info = liveInfo || { status: "joining", rooms: [] };
        const s = info.status;
        const ok = s === "on";
        const status = $("live-status");
        status.textContent = s in LIVE_STATUS ? LIVE_STATUS[s] : "CONNECTING...";
        status.classList.toggle("bad", s === "full" || s === "offline" || s === "missing");
        status.style.display = status.textContent ? "" : "none";
        $("live-name").textContent = String(info.name || user).toUpperCase();
        const sw = $("live-sw");
        const url = gameState && gameState.skinUrl;
        sw.classList.toggle("img", !!url);
        sw.style.backgroundImage = url ? 'url("' + url.replace(/"/g, "%22") + '")' : "none";
        sw.style.backgroundColor = url ? "transparent" : (gameState && gameState.skinColor) || "";
        const create = $("live-create");
        create.textContent = s === "full" || s === "offline" ? "TRY AGAIN" : "CREATE ROOM";
        create.disabled = !(ok || s === "full" || s === "offline");
        create.style.display = info.eventOnly && ok ? "none" : "";
        $("live-join-row").style.display = info.eventOnly ? "none" : "";
        $("live-join").disabled = !ok;
        const rooms = info.rooms || [];
        const sig = JSON.stringify([ok, info.eventOnly, rooms]);
        if (sig === liveRoomsSig) return;
        liveRoomsSig = sig;
        const list = $("live-rooms");
        list.innerHTML = "";
        if (!ok) return void (list.innerHTML = '<div class="empty">' + (s in LIVE_STATUS ? "NOT CONNECTED" : "CONNECTING...") + "</div>");
        const shown = info.eventOnly ? rooms.filter((r) => r.ev) : rooms;
        if (!shown.length) {
          list.innerHTML = '<div class="empty">' + esc(info.eventOnly ? info.eventText : "NO OPEN ROOMS, CREATE ONE") + "</div>";
          return;
        }
        shown.forEach((r) => {
          const b = document.createElement("button");
          b.className = "room";
          const slots = Array.from({ length: Math.min(r.size, 10) }, (_, i) =>
            '<i class="' + (i < r.count ? "on" : "") + '"></i>',
          ).join("");
          b.innerHTML =
            '<span class="rc">' + esc(r.code) + '</span><span class="rh">' + esc(r.host || "...") + "</span>" +
            '<span class="rs"><span class="slots">' + slots + "</span><span>" +
            '<span class="tagb' + (r.racing || r.ev ? " gold" : "") + '">' + (r.ev ? "AWARDS" : r.racing ? "RACING" : "OPEN") + "</span>" +
            (r.priv ? ' <span class="tagb red">PRIVATE</span>' : "") + "</span></span>";
          b.disabled = r.count >= r.size || !r.sameVersion;
          b.onclick = () => joinLive(r.code);
          list.appendChild(b);
        });
      }

      // ---- LEADERBOARDS ----
      // Read straight from the leaderboard table, with the game's keys
      const LB_MODES = [
        ["speedrun", "SPEEDRUN"],
        ["deathrun", "DEATHRUN"],
        ["chapter_speedrun", "CHAPTER SPEEDRUN"],
        ["impossible", "IMPOSSIBLE"],
        ["level_awards", "LEVEL AWARDS"],
      ];
      const lb = { mode: "speedrun", ch: 1, lvl: 0, cat: "any", award: null, place: 1 };
      let awardsList = null;
      let boardRun = 0;
      function lbKey() {
        if (lb.mode === "chapter_speedrun") return "chapter_speedrun_" + lb.ch;
        if (lb.mode === "impossible") return "impossible_chapter_" + lb.ch;
        if (lb.mode === "level_awards") {
          if (lb.award == null) return null;
          return "speedrun_award_" + lb.award + "_" + lb.place + (lb.cat === "blue" ? "_blue" : "");
        }
        const prefix = lb.mode === "deathrun" ? "deathrun_" : "speedrun_" + (lb.cat === "blue" ? "blue_" : "");
        return prefix + "campaign_" + lb.ch + "_" + lb.lvl;
      }
      const ROMAN = ["I", "II", "III", "IV", "V"];
      const lbTime = (ms) => {
        const t = Number(ms) || 0;
        return (
          String(Math.floor(t / 60000)).padStart(2, "0") + ":" +
          String(Math.floor(t / 1000) % 60).padStart(2, "0") + "." +
          String(t % 1000).padStart(3, "0")
        );
      };
      const levelCount = (ch) => {
        const c = gameState && gameState.chapters && gameState.chapters[ch - 1];
        return c ? c.levels.length : 0;
      };
      // What the second picker says
      function lbWhere() {
        if (lb.mode === "level_awards") {
          const a = (awardsList || []).find((x) => x.id === lb.award);
          return { k: "AWARD", v: (a ? a.title : "-") + " · " + ["1ST", "2ND", "3RD"][lb.place - 1] };
        }
        if (lb.mode === "chapter_speedrun" || lb.mode === "impossible") return { k: "CHAPTER", v: "CHAPTER " + ROMAN[lb.ch - 1] };
        return { k: "LEVEL", v: "CHAPTER " + ROMAN[lb.ch - 1] + " · " + (lb.lvl + 1) };
      }

      // A list that slides up to pick from
      function openPick(title, build) {
        $("pick-title").textContent = title;
        const list = $("pick-list");
        list.innerHTML = "";
        build(list, closePick);
        $("pick-dim").classList.add("on");
        $("pick").classList.add("on");
        const on = list.querySelector(".on");
        if (on) on.scrollIntoView({ block: "center" });
      }
      function closePick() {
        $("pick-dim").classList.remove("on");
        $("pick").classList.remove("on");
      }
      $("pick-dim").onclick = closePick;
      $("pick-close").onclick = closePick;
      const pickRow = (label, on, onTap) => {
        const b = document.createElement("button");
        b.className = "pick-row" + (on ? " on" : "");
        b.textContent = label;
        b.onclick = onTap;
        return b;
      };

      function pickMode() {
        openPick("MODE", (list, close) =>
          LB_MODES.forEach(([v, label]) =>
            list.appendChild(
              pickRow(label, v === lb.mode, () => {
                close();
                if (v === lb.mode) return;
                lb.mode = v;
                lb.lvl = 0;
                renderBoards();
              }),
            ),
          ),
        );
      }
      function pickWhere() {
        if (lb.mode === "level_awards") {
          openPick("LEVEL AWARDS", (list, close) =>
            (awardsList || []).forEach((a) => {
              const head = document.createElement("div");
              head.className = "pick-head";
              head.textContent = a.title;
              list.appendChild(head);
              const grid = document.createElement("div");
              grid.className = "pick-grid";
              [1, 2, 3].forEach((p) =>
                grid.appendChild(
                  pickRow(["1ST", "2ND", "3RD"][p - 1], a.id === lb.award && p === lb.place, () => {
                    close();
                    lb.award = a.id;
                    lb.place = p;
                    renderBoards();
                  }),
                ),
              );
              list.appendChild(grid);
            }),
          );
          return;
        }
        if (lb.mode === "chapter_speedrun" || lb.mode === "impossible") {
          openPick("CHAPTER", (list, close) =>
            [1, 2, 3, 4, 5].forEach((n) =>
              list.appendChild(
                pickRow("CHAPTER " + ROMAN[n - 1], n === lb.ch, () => {
                  close();
                  lb.ch = n;
                  renderBoards();
                }),
              ),
            ),
          );
          return;
        }
        if (!gameState || !gameState.chapters) {
          loadFrame();
          return toast("STILL LOADING, TRY AGAIN");
        }
        openPick("LEVEL", (list, close) =>
          [1, 2, 3, 4, 5].forEach((n) => {
            const head = document.createElement("div");
            head.className = "pick-head";
            head.textContent = "CHAPTER " + ROMAN[n - 1];
            list.appendChild(head);
            const grid = document.createElement("div");
            grid.className = "pick-grid";
            for (let i = 0; i < levelCount(n); i++)
              grid.appendChild(
                pickRow(String(i + 1), n === lb.ch && i === lb.lvl, () => {
                  close();
                  lb.ch = n;
                  lb.lvl = i;
                  renderBoards();
                }),
              );
            list.appendChild(grid);
          }),
        );
      }

      async function renderBoards() {
        const el = $("boards-body");
        if (lb.mode === "level_awards" && !awardsList && db) {
          el.innerHTML = '<div class="note">LOADING...</div>';
          const { data } = await db.from("level_awards").select("id, title").order("created_at", { ascending: false });
          awardsList = data || [];
          if (lb.award == null && awardsList[0]) lb.award = awardsList[0].id;
        }
        const modeName = (LB_MODES.find(([v]) => v === lb.mode) || [, ""])[1];
        const where = lbWhere();
        el.innerHTML =
          '<div class="lb-pick">' +
          '<button class="lb-sel" id="lb-mode"><span class="k">MODE</span><span class="v">' + esc(modeName) + "</span></button>" +
          '<button class="lb-sel" id="lb-where"><span class="k">' + where.k + '</span><span class="v">' + esc(where.v) + "</span></button>" +
          "</div>" +
          (lb.mode === "speedrun" || lb.mode === "level_awards"
            ? '<div class="lb-seg"><button data-cat="any"' + (lb.cat === "any" ? ' class="on"' : "") + ">ANY</button>" +
              '<button data-cat="blue"' + (lb.cat === "blue" ? ' class="on"' : "") + '><span class="bc"></span>BLUE COIN</button></div>'
            : "") +
          '<div id="lb-out"><div class="note">LOADING...</div></div>';
        $("lb-mode").onclick = pickMode;
        $("lb-where").onclick = pickWhere;
        el.querySelectorAll("[data-cat]").forEach(
          (b) =>
            (b.onclick = () => {
              if (lb.cat === b.dataset.cat) return;
              lb.cat = b.dataset.cat;
              renderBoards();
            }),
        );
        const out = $("lb-out");
        if (lb.mode === "level_awards" && (!awardsList || !awardsList.length))
          return void (out.innerHTML = '<div class="empty">NO AWARDS YET</div>');
        const key = lbKey();
        const run = ++boardRun;
        drawTimes(out, key, () => run === boardRun, renderBoards);
      }

      // A leaderboard's times: the top three on a podium, then the rest, and
      // a YOU bar when you're further down. Shared by LEADERBOARDS and a
      // level's MORE INFO. `live()` says the result is still wanted.
      async function drawTimes(out, key, live, retry, empty) {
        if (!key || !db) return void (out.innerHTML = '<div class="empty">NOT CONNECTED</div>');
        out.innerHTML = '<div class="note">LOADING...</div>';
        const { data, error } = await db
          .from("leaderboard")
          .select("username, time_ms")
          .eq("level_key", key)
          .order("time_ms", { ascending: true })
          .limit(50);
        if (live && !live()) return;
        if (error) {
          out.innerHTML = '<div class="empty">COULD NOT LOAD<br><button class="btn" style="margin-top:10px">TRY AGAIN</button></div>';
          out.querySelector("button").onclick = retry;
          return;
        }
        const rows = data || [];
        if (!rows.length) return void (out.innerHTML = '<div class="empty">' + (empty || "NO RECORDS YET") + "</div>");
        out.innerHTML = "";
        const list = document.createElement("div");
        list.className = "lb-cards";
        const api = gameApi();
        const me = signedInAs();
        rows.forEach((sc, i) => {
          const host = document.createElement("div");
          host.className = "lb-host";
          const node = api && api.lbRow && api.lbRow(sc, i + 1);
          if (node) gameBits(host, node);
          else {
            // Before the game is up: the same card, drawn here
            host.className = "lb-host lb-card" + (sc.username === me ? " me" : "");
            host.innerHTML =
              '<span class="l"><span class="n">' + (i + 1) + '</span><span class="who">' + esc(sc.username) + "</span></span>" +
              '<span class="time">' + lbTime(sc.time_ms) + "</span>";
          }
          host.onclick = () => openProfile(sc.username);
          list.appendChild(host);
        });
        out.appendChild(list);
      }

      // ---- the layer: a feed opened from a grid of levels ----
      let layerFeed = null;
      function openLayer(next, opts) {
        opts = opts || {};
        const layer = $("layer");
        if (!layer.classList.contains("on")) {
          try {
            history.pushState({ boiLayer: true }, "");
          } catch (e) {}
        }
        layer.classList.add("on");
        if (layerFeed) layerFeed.dispose();
        layerFeed = makeFeed($("layer-feed"), next, { empty: opts.empty });
      }
      function closeLayer(fromPop) {
        if (!$("layer").classList.contains("on")) return;
        $("layer").classList.remove("on");
        if (layerFeed) layerFeed.dispose();
        layerFeed = null;
        $("layer-feed").innerHTML = "";
        if (!fromPop && history.state && history.state.boiLayer) {
          skipNextPop();
          history.back();
        }
      }
      $("layer-back").onclick = () => closeLayer(false);
      // A grid of levels opened as a feed starting at the tapped one
      function openRowsAsFeed(rows, start) {
        let given = false;
        openLayer(async () => {
          if (given) return [];
          given = true;
          return rows.slice(start).concat(rows.slice(0, start));
        });
      }

      // ---- SEARCH: a results page, players first, then levels ----
      const SEARCH_PAGE = 24;
      let searchRun = 0;
      function openSearch() {
        const page = $("search");
        if (!page.classList.contains("on")) {
          try {
            history.pushState({ boiSearch: true }, "");
          } catch (e) {}
        }
        page.classList.add("on");
        if (!$("search-input").value) searchHint();
        setTimeout(() => $("search-input").focus(), 0);
      }
      function closeSearch(fromPop) {
        if (!$("search").classList.contains("on")) return;
        closeLayer(fromPop);
        $("search").classList.remove("on");
        $("search-input").blur();
        if (!fromPop && history.state && history.state.boiSearch) {
          skipNextPop();
          history.back();
        }
      }
      function searchHint() {
        $("results").innerHTML = '<div class="feed-msg" style="height:auto;padding-top:60px">TYPE A LEVEL NAME OR A PLAYER</div>';
      }
      $("search-btn").onclick = openSearch;
      $("search-back").onclick = () => closeSearch(false);
      $("search-go").onclick = () => runSearch();
      $("search-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") runSearch();
      });
      async function runSearch() {
        // Characters that mean something to the filter syntax are dropped
        const q = $("search-input").value.replace(/[%,()*\_]/g, " ").replace(/\s+/g, " ").trim();
        $("search-input").blur();
        if (!q) return searchHint();
        if (!db) {
          $("results").innerHTML = '<div class="feed-msg" style="height:auto">NOT CONNECTED</div>';
          return;
        }
        const run = ++searchRun;
        const box = $("results");
        box.innerHTML = '<div class="feed-msg" style="height:auto;padding-top:60px">SEARCHING...</div>';
        const like = "%" + q + "%";
        const levelsQuery = (from) =>
          base()
            .or("name.ilike.*" + q + "*,creator.ilike.*" + q + "*")
            .order("plays", { ascending: false })
            .order("id", { ascending: false })
            .range(from, from + SEARCH_PAGE - 1);
        const [players, levels] = await Promise.all([
          db.from("users").select("username").ilike("username", like).limit(12)
            .then((r) => (r.error ? [] : r.data || []), () => []),
          levelsQuery(0).then((r) => (r.error ? null : r.data || []), () => null),
        ]);
        if (run !== searchRun) return;
        box.innerHTML = "";
        // Exact name first, then shortest (closest) names
        const lower = q.toLowerCase();
        players.sort((a, b) =>
          (b.username.toLowerCase() === lower) - (a.username.toLowerCase() === lower) ||
          a.username.length - b.username.length,
        );
        if (players.length) {
          box.insertAdjacentHTML("beforeend", '<div class="res-label">PLAYERS</div><div class="players"></div>');
          const list = box.querySelector(".players");
          players.forEach((p) => {
            const b = document.createElement("button");
            b.className = "player";
            b.innerHTML = '<span class="pfp">' + esc(p.username.charAt(0).toUpperCase()) + '</span><span class="pname">' + esc(p.username) + "</span>";
            b.onclick = () => openProfile(p.username);
            list.appendChild(b);
          });
        }
        box.insertAdjacentHTML("beforeend", '<div class="res-label">LEVELS</div>');
        if (levels === null) {
          box.insertAdjacentHTML("beforeend", '<div class="empty">COULD NOT LOAD LEVELS</div>');
          return;
        }
        if (!levels.length) {
          box.insertAdjacentHTML("beforeend", '<div class="empty">NO LEVELS FOUND FOR ' + esc(q.toUpperCase()) + "</div>");
          return;
        }
        const grid = document.createElement("div");
        grid.className = "grid3";
        box.appendChild(grid);
        const found = [];
        const addLevels = (rows) =>
          rows.forEach((row) => {
            const i = found.push(row) - 1;
            grid.appendChild(levelThumb(row, () => openRowsAsFeed(found, i)));
          });
        addLevels(levels);
        if (levels.length === SEARCH_PAGE) {
          const more = document.createElement("button");
          more.className = "btn more-btn";
          more.textContent = "MORE LEVELS";
          box.appendChild(more);
          more.onclick = async () => {
            more.disabled = true;
            more.textContent = "LOADING...";
            const r = await levelsQuery(found.length).catch(() => ({ error: true }));
            if (run !== searchRun) return;
            const rows = (!r.error && r.data) || [];
            addLevels(rows);
            more.disabled = false;
            more.textContent = "MORE LEVELS";
            if (r.error) more.textContent = "TRY AGAIN";
            else if (rows.length < SEARCH_PAGE) more.remove();
          };
        }
      }
      // A small picture of a level with its name, for grids
      function levelThumb(row, onTap) {
        const b = document.createElement("button");
        b.className = "thumb";
        b.innerHTML = "<canvas></canvas><span>" + esc(row.name || "Untitled") + "</span>";
        b.onclick = onTap;
        const lvl = parseLevel(row.data);
        requestAnimationFrame(() =>
          drawLevel(b.querySelector("canvas"), lvl, { w: b.clientWidth, h: b.clientHeight, top: 4, bottom: 4, min: 5, max: 12 }),
        );
        return b;
      }

      // ---------------------------------------------------------------------
      // CAMPAIGN
      // ---------------------------------------------------------------------
      function renderChapters() {
        const el = $("chapters");
        if (!gameState || !gameState.chapters) {
          el.innerHTML = '<div class="feed-msg"><div class="jumper"><div class="cube"></div><div class="ground"></div></div>LOADING</div>';
          return;
        }
        const keep = el.scrollTop;
        el.innerHTML = "";
        gameState.chapters.forEach((ch) => {
          const card = document.createElement("div");
          card.className = "card chapter";
          const done = ch.levels.filter((l) => !l.locked).length;
          const beatenCount = ch.beaten ? ch.levels.length : Math.max(0, done - 1);
          const blues = ch.levels.filter((l) => l.blue).length;
          // The preview is the level the player is up to
          const at = ch.beaten ? 0 : Math.min(beatenCount, ch.levels.length - 1);
          card._plan = (ch.levels[at] || ch.levels[0] || {}).plan;
          let body =
            '<canvas class="preview"></canvas><div class="veil"></div><div class="body">' +
            '<div class="ch-num shade">CAMPAIGN</div>' +
            '<h2 class="ch-title">' + esc(ch.name.toUpperCase()) + "</h2>";
          if (!ch.open) {
            body += '<div class="locked-note">BEAT CHAPTER ' + ["I", "II", "III", "IV"][ch.number - 2] + " TO UNLOCK</div>";
          } else {
            body +=
              '<div class="ch-stat shade">' + beatenCount + " / " + ch.levels.length + " BEATEN" +
              (blues ? ' &nbsp;<span class="bc"></span> ' + blues : "") + "</div>" +
              '<div class="lvl-grid">' +
              ch.levels
                .map((l, i) => {
                  const beat = ch.beaten || i < beatenCount;
                  return (
                    '<button class="lvl' + (beat ? " beaten" : "") + '" data-i="' + i + '"' +
                    (l.locked ? " disabled" : "") + ">" + (i + 1) +
                    (l.blue ? '<span class="bc"></span>' : "") + "</button>"
                  );
                })
                .join("") +
              "</div>" +
              // A beaten chapter has no button: its levels are picked above
              (ch.beaten
                ? ""
                : '<div class="btn-col" style="margin-top:10px"><button class="btn blue" data-go="' + at + '">' +
                  (beatenCount ? "CONTINUE" : "START") + "</button></div>");
          }
          body += "</div>";
          card.innerHTML = body;
          card.querySelectorAll(".lvl").forEach((b) => {
            b.onclick = () => openGame({ type: "boi-campaign", chapter: ch.number, index: +b.dataset.i });
          });
          const go = card.querySelector("[data-go]");
          if (go) go.onclick = () => openGame({ type: "boi-campaign", chapter: ch.number, index: +go.dataset.go });
          el.appendChild(card);
        });
        // The last card: the other ways to play
        const more = document.createElement("div");
        more.className = "card chapter";
        more.innerHTML =
          '<div class="body"><h2 class="ch-title">MORE</h2><div class="btn-col">' +
          '<button class="btn" data-v="other-modes">OTHER MODES</button>' +
          '<button class="btn" data-v="live">LIVE</button>' +
          '<button class="btn" data-v="leaderboards-new">LEADERBOARDS</button>' +
          '<button class="btn" data-v="custom">CUSTOM LEVELS</button>' +
          "</div></div>";
        more.querySelectorAll("[data-v]").forEach((b) => {
          b.onclick = () => {
            const v = b.dataset.v;
            // LIVE and LEADERBOARDS are tabs of the levels screen
