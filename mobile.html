            if (v === "live" || v === "leaderboards-new") {
              showTab("levels");
              showPanel(v === "live" ? "live" : "boards");
            } else openView(v);
          };
        });
        el.appendChild(more);
        el.scrollTop = keep;
        drawChapterPreviews();
      }
      function drawChapterPreviews() {
        if (currentTab !== "campaign") return;
        $("chapters")
          .querySelectorAll(".card")
          .forEach((card) => {
            const cv = card.querySelector("canvas");
            if (!cv || !card._plan) return;
            drawLevel(cv, parseLevel({ plan: card._plan }), {
              w: card.clientWidth,
              h: card.clientHeight,
              top: 0,
              bottom: 0,
              max: 40,
            });
          });
      }

      // ---------------------------------------------------------------------
      // ME
      // ---------------------------------------------------------------------
      function signedInAs() {
        return (gameState && gameState.user) || store.get("blockoverit_username") || null;
      }
      // The tab is named after you once you are signed in
      function nameMeTab() {
        $("me-tab-name").textContent = signedInAs() || "ME";
      }
      // A skin's picture, or its plain colour, or the plain blue block
      function skinArt(box, skin) {
        box.innerHTML = "";
        const block = () => {
          box.innerHTML = '<div class="block"></div>';
          if (skin.color) box.firstChild.style.background = skin.color;
        };
        if (!skin.image) return block();
        const img = new Image();
        img.alt = "";
        img.onerror = block;
        img.src = skin.image;
        box.appendChild(img);
      }
      // The profile tab, laid out like the game's Account screen: your name,
      // BLUE COINS / COMMUNITY / STREAK, your crates, your locker (skins,
      // emotes, loading screens, environments), then the account buttons.
      let lockerTab = "skins";
      let signingOut = false;
      const doAction = (name, extra) => openGame(Object.assign({ type: "boi-action", name }, extra || {}));
      function renderMe() {
        nameMeTab();
        const el = $("me-body");
        const user = signedInAs();
        const acct = (gameState && gameState.user === user && gameState.account) || null;
        // Signed in, the tab is the game's own Account screen (syncDock);
        // this only covers the moment before it is up
        if (user && !signingOut) {
          el.innerHTML = '<div class="feed-msg"><div class="jumper"><div class="cube"></div><div class="ground"></div></div>LOADING</div>';
          return;
        }
        const keep = el.scrollTop;
        let html = '<div class="acct"><div class="me-name">' + esc(signingOut ? "SIGNING OUT..." : user || "GUEST") + "</div>";
        if (user) {
          html +=
            '<div class="stats">' +
            '<div class="stat"><span class="k">BLUE COINS</span><span class="v" style="color:#4d8ce0">' +
            (acct ? acct.blue + " / " + acct.bluePossible : "-") + "</span></div>" +
            '<button class="stat" data-act="beaten"><span class="k">COMMUNITY</span><span class="v" style="color:#2ecc71">' +
            (acct ? acct.community : "-") + '</span><span class="t">VIEW LIST</span></button>' +
            '<button class="stat wide" data-act="streak"><span class="k">STREAK</span><span class="v" style="color:#e67e22">' +
            esc(acct ? acct.streakText : "-") + '</span><span class="t">REWARDS</span></button>' +
            "</div>";
          if (acct && acct.crates.length) html += '<div class="sec-head">MY CRATES</div><div class="skins" id="my-crates"></div>';
          const tabs = [
            ["skins", "MY SKINS", (gameState && gameState.skins) || []],
            ["emotes", "MY EMOTES", (acct && acct.emotes) || []],
            ["loading", "LOADING SCREENS", (acct && acct.loading) || []],
            ["environments", "ENVIRONMENTS", (acct && acct.environments) || []],
          ].filter(([k, , list]) => k === "skins" || k === "loading" || k === "environments" || list.length);
          if (!tabs.some(([k]) => k === lockerTab)) lockerTab = "skins";
          html +=
            '<div class="locker-tabs">' +
            tabs
              .map(([k, label, list]) => {
                const n = k === "skins" ? list.reduce((a, s) => a + (s.count || 1), 0) : list.length;
                return '<button class="locker-tab' + (k === lockerTab ? " on" : "") + '" data-locker="' + k + '">' +
                  label + (k === lockerTab && n ? " (" + n + ")" : "") + "</button>";
              })
              .join("") +
            '</div><div class="skins' + (lockerTab === "loading" || lockerTab === "environments" ? " wide" : "") + '" id="my-locker"></div>';
        } else {
          html += '<div class="acct-btns" style="margin-top:0"><button class="btn blue" data-v="login">SIGN IN</button></div>';
        }
        html +=
          '<div class="acct-btns">' +
          '<button class="btn" data-v="friends">FRIENDS</button>' +
          '<button class="btn" data-v="news">NEWS</button>' +
          '<button class="btn" data-v="mobile-settings">SETTINGS</button>' +
          (user
            ? '<button class="btn" data-act="password" style="margin-top:14px">CHANGE PASSWORD</button>' +
              '<button class="btn" data-act="signout-all">SIGN OUT OF ALL DEVICES</button>' +
              '<button class="btn red" data-logout>LOG OUT</button>'
            : "") +
          "</div></div>";
        el.innerHTML = html;
        el.scrollTop = keep;
        const lit = el.querySelector(".locker-tab.on");
        if (lit) lit.parentNode.scrollLeft = lit.offsetLeft - 16;
        el.querySelectorAll("[data-v]").forEach((b) => {
          b.onclick = () => {
            const v = b.dataset.v;
            if (v === "friends" && !user) openView("login");
            else openView(v);
          };
        });
        el.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => doAction(b.dataset.act)));
        el.querySelectorAll("[data-locker]").forEach((b) => {
          b.onclick = () => {
            lockerTab = b.dataset.locker;
            renderMe();
          };
        });
        const logout = el.querySelector("[data-logout]");
        if (logout)
          logout.onclick = () =>
            ask("LOG OUT", "Are you sure you want to log out?", "LOG OUT", () => {
              if (!frameReady) return toast("STILL LOADING, TRY AGAIN");
              signingOut = true;
              renderMe();
              tellGame({ type: "boi-logout" });
              // The game forgets the account and reloads; it says hello again
              setTimeout(() => {
                signingOut = false;
                if (currentTab === "me") renderMe();
              }, 6000);
            });
        if (!user) return;
        const crates = $("my-crates");
        if (crates)
          acct.crates.forEach((c) => {
            const b = document.createElement("button");
            b.className = "skin";
            b.innerHTML =
              '<div class="art"><div class="block" style="width:44px;height:44px;background:#8a5a2b;border:4px solid #5e3c1c"></div></div>' +
              '<div class="sname">' + esc(c.name) + "</div>" + (c.count > 1 ? '<span class="count">x' + c.count + "</span>" : "") +
              '<span class="flag">OPEN</span>';
            b.onclick = () => doAction("crate", { id: c.id });
            crates.appendChild(b);
          });
        renderLocker($("my-locker"), acct);
      }
      function renderLocker(grid, acct) {
        const using = (gameState && gameState.skin) || "default";
        const empty = (text) => (grid.innerHTML = '<div class="empty" style="grid-column:1/-1">' + text + "</div>");
        if (lockerTab === "skins") {
          const skins = gameState && gameState.skins;
          if (!skins) return empty("LOADING...");
          skins.forEach((skin) => {
            const b = document.createElement("button");
            b.className = "skin" + (skin.id === using ? " using" : "");
            b.innerHTML =
              '<div class="art"></div><div class="sname">' + esc(skin.name) + "</div>" +
              (skin.id === using ? '<span class="flag">USING</span>' : "") +
              (skin.count > 1 ? '<span class="count">x' + skin.count + "</span>" : "");
            skinArt(b.querySelector(".art"), skin);
            // Tapping a skin puts it on
            b.onclick = () => {
              if (skin.id === using || !frameReady) return;
              tellGame({ type: "boi-equip", skin: skin.id });
              toast("NOW USING " + String(skin.name).toUpperCase());
            };
            grid.appendChild(b);
          });
          return;
        }
        if (!acct) return empty("LOADING...");
        if (lockerTab === "emotes") {
          if (!acct.emotes.length) return empty("NO EMOTES YET");
          acct.emotes.forEach((em) => {
            const b = document.createElement("div");
            b.className = "skin";
            b.innerHTML =
              '<div class="art"><div class="block" style="width:30px;height:56px"></div></div><div class="sname">' + esc(em.name) + "</div>";
            b.querySelector(".block").style.background = em.color || "var(--blue)";
            grid.appendChild(b);
          });
          return;
        }
        const kind = lockerTab === "loading" ? "loading" : "environment";
        const list = kind === "loading" ? acct.loading : acct.environments;
        const on = kind === "loading" ? acct.usingLoading : acct.usingEnv;
        if (!list.length) return empty("NONE YET");
        list.forEach((item, i) => {
          const isOn = item.id === on || (!on && i === 0);
          const b = document.createElement("button");
          b.className = "skin" + (isOn ? " using" : "");
          b.innerHTML =
            '<div class="art"></div><div class="sname">' + esc(item.name) + "</div>" + (isOn ? '<span class="flag">USING</span>' : "");
          const art = b.querySelector(".art");
          if (kind === "loading" && item.img) {
            art.innerHTML = '<div class="pic"></div>';
            art.firstChild.style.backgroundImage = 'url("' + encodeURI(item.img).replace(/"/g, "%22") + '")';
          } else if (item.plan) {
            const cv = document.createElement("canvas");
            art.appendChild(cv);
            requestAnimationFrame(() =>
              drawLevel(cv, parseLevel({ plan: item.plan, background: item.bg }), { w: art.clientWidth, h: art.clientHeight, top: 2, bottom: 2, min: 3, max: 8 }),
            );
          }
          b.onclick = () => {
            if (isOn || !frameReady) return;
            tellGame({ type: "boi-use", kind, id: item.id });
            toast("NOW USING " + String(item.name).toUpperCase());
          };
          grid.appendChild(b);
        });
      }
      // A yes / no box
      function ask(title, text, yes, onYes) {
        $("ask-title").textContent = title;
        $("ask-text").textContent = text;
        $("ask-yes").textContent = yes || "OK";
        $("ask").classList.add("on");
        const close = () => $("ask").classList.remove("on");
        $("ask-no").onclick = close;
        $("ask").onclick = (e) => e.target === $("ask") && close();
        $("ask-yes").onclick = () => {
          close();
          onYes();
        };
      }

      // ---------------------------------------------------------------------
      // TABS
      // ---------------------------------------------------------------------
      let currentTab = "levels";
      function showTab(name) {
        closeComments(false);
        closeLayer(false);
        closeSearch(false);
        if (currentTab === "levels" && name !== "levels" && panel === "live") stopLiveWatch();
        if (name === "levels" && currentTab !== "levels" && panel === "live") startLiveWatch();
        currentTab = name;
        document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.tab === name));
        document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === name));
        if (name === "campaign") {
          if (!gameState) loadFrame();
          drawChapterPreviews();
        }
        if (name === "me") {
          renderMe();
          // Skins may have changed since (bought, traded, signed in)
          if (frameReady) tellGame({ type: "boi-state", full: currentTab === "me" });
          else loadFrame();
        }
        syncDock();
        if (name === "levels" && !panel && mainFeed && mainFeed.current) followLevel(mainFeed.current._row);
        else
          try {
            history.replaceState(history.state, "", location.pathname);
          } catch (e) {}
      }
      document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => showTab(t.dataset.tab)));

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(redrawVisible, 150);
      });

      // ---------------------------------------------------------------------
      // START
      // ---------------------------------------------------------------------
      (async function start() {
        renderChapters();
        nameMeTab();
        let params;
        try {
          params = new URLSearchParams(location.search);
        } catch (e) {
          params = new URLSearchParams();
        }
        const levelId = (params.get("level") || "").trim();
        if (db && /^\d+$/.test(levelId)) {
          try {
            const { data } = await base().eq("id", parseInt(levelId, 10)).limit(1).maybeSingle();
            if (data) firstRow = data;
          } catch (e) {}
        }
        startMainFeed("foryou");
        // The game loads behind the feed, so PLAY is quick when it comes
        setTimeout(() => loadFrame(), 0);
        // Links meant for the game itself
        const user = (params.get("user") || "").trim();
        if (user) openProfile(user.slice(0, 64));
        else if (params.has("code") || params.has("leaderboard"))
          openGame({ type: "boi-open", view: "link", search: location.search });
      })();
    </script>
  </body>
</html>
