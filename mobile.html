<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <title>Block Over It</title>
    <link rel="icon" href="blockoverit.png" />
    <script>
      // An Xbox gets the full game: its browser reads as a phone to some
      // checks, but it plays with a controller on a TV.
      (function () {
        try {
          if (/Xbox/i.test(navigator.userAgent || ""))
            location.replace("index.html" + location.search + location.hash);
        } catch (e) {}
      })();
    </script>
    <!-- skins.js: the 13+ age check blurs gated skins here too -->
    <script src="skins.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
    <script>
      window.supabase ||
        document.write(
          '<script src="https://unpkg.com/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"><\/script>',
        );
    </script>
    <style>
      :root {
        --bg: #111;
        --panel: #1a1a1a;
        --block: #444;
        --edge: #333;
        --blue: #335699;
        --blue-edge: #2a4a7a;
        --text: #fff;
        --dim: #888;
        --tabs-h: 64px;
        --head-h: 52px;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        border-radius: 0 !important;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Courier New", Courier, monospace;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      button {
        font-family: inherit;
        color: inherit;
        cursor: pointer;
      }

      /* ---- screens ---- */
      .screen {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: calc(var(--tabs-h) + var(--safe-b));
        display: none;
      }
      .screen.on {
        display: block;
      }

      /* ---- the vertical feed (levels and chapters) ---- */
      .feed {
        position: absolute;
        inset: 0;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        overscroll-behavior: contain;
        /* Cards are added above the "LOADING" row; without this the
           browser keeps that row in view and skips past them */
        overflow-anchor: none;
      }
      .feed::-webkit-scrollbar {
        display: none;
      }
      .card {
        position: relative;
        height: 100%;
        width: 100%;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        overflow: hidden;
        background: #222 center / cover no-repeat;
      }
      .card {
        touch-action: pan-y;
      }
      .swipe-hint {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 0;
        z-index: 3;
        display: none;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        white-space: nowrap;
        font-weight: 900;
        font-size: 20px;
        letter-spacing: 3px;
        color: #fff;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
        opacity: 0.75;
        pointer-events: none;
      }
      .swipe-hint.on {
        display: flex;
      }
      .swipe-hint.go {
        opacity: 1;
      }
      .swipe-hint.speed {
        right: 0;
        background: #e67e22;
        border-left: 6px solid #d35400;
      }
      .swipe-hint.death {
        left: 0;
        background: #a04040;
        border-right: 6px solid #802020;
      }
      .card canvas.preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .shade {
        text-shadow: 2px 2px 0 #000;
      }
      .feed-msg {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: var(--dim);
        font-weight: bold;
        text-align: center;
        padding: 24px;
        scroll-snap-align: start;
      }
      /* While more are loading the row must not be a snap point: the feed
         would re-snap to it every time cards are added above it */
      .feed-msg.loading {
        scroll-snap-align: none;
      }

      /* ---- feed header: FOR YOU / NEW / TOP ---- */
      .feed-head {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: calc(var(--head-h) + var(--safe-t));
        padding-top: var(--safe-t);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 13px;
        padding-left: 58px;
        padding-right: 58px;
        z-index: 5;
        pointer-events: none;
      }
      .feed-head > * {
        pointer-events: auto;
      }
      /* Over LIVE and LEADERBOARDS the header is a solid bar */
      .feed-head.solid {
        background: var(--panel);
        border-bottom: 3px solid var(--edge);
      }
      /* The tabs scroll sideways when they don't fit, centred when they do */
      .sorts {
        display: flex;
        align-items: center;
        gap: 16px;
        max-width: 100%;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 0 2px;
      }
      .sorts::-webkit-scrollbar {
        display: none;
      }
      .sorts > :first-child {
        margin-left: auto;
      }
      .sorts > :last-child {
        margin-right: auto;
      }
      .sort {
        flex-shrink: 0;
      }

      /* ---- LIVE and LEADERBOARDS: tabs of the levels screen ---- */
      .panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: calc(var(--head-h) + var(--safe-t));
        overflow-y: auto;
        background: var(--bg);
        display: none;
        z-index: 4;
        padding: 14px 16px 28px;
        overscroll-behavior: contain;
      }
      .panel.on {
        display: block;
      }
      .panel-in {
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .panel-in .panel-in {
        width: 100%;
        margin: 0;
      }
      .label {
        font-weight: bold;
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 2px;
        margin-top: 6px;
      }
      .note {
        color: var(--dim);
        font-weight: bold;
        text-align: center;
        padding: 14px;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .note.bad {
        color: #e74c3c;
      }
      .live-who {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--panel);
        border: 3px solid var(--edge);
        padding: 10px 12px;
        font-weight: bold;
        font-size: 14px;
        text-transform: uppercase;
      }
      .live-who .sw {
        flex-shrink: 0;
        width: 22px;
        height: 40px;
        background: var(--blue) center bottom / contain no-repeat;
      }
      .live-who .sw.img {
        background-color: transparent;
      }
      .live-who .sub {
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 2px;
      }
      .live-create {
        font-size: 20px;
        letter-spacing: 3px;
        padding: 18px 12px;
        border-bottom-width: 8px;
      }
      .live-join {
        display: flex;
        gap: 8px;
      }
      .live-join input {
        flex: 1;
        min-width: 0;
        height: 56px;
        background: #222;
        border: 4px solid var(--edge);
        color: #fff;
        font-family: inherit;
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 10px;
        text-align: center;
        text-transform: uppercase;
        outline: none;
      }
      .live-join input:focus {
        border-color: var(--blue);
      }
      .live-join .btn {
        width: 110px;
      }
      .room {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: var(--block);
        border: 4px solid var(--edge);
        padding: 10px 12px;
        font-weight: bold;
        text-align: left;
        text-transform: uppercase;
      }
      .room:active:not(:disabled) {
        border-color: #eee;
      }
      .room:disabled {
        opacity: 0.5;
      }
      .room .rc {
        flex-shrink: 0;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 4px;
        text-shadow: 3px 3px 0 var(--blue);
      }
      .room .rh {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #ddd;
        font-size: 14px;
      }
      .room .rs {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
      }
      .slots {
        display: flex;
        gap: 3px;
      }
      .slots i {
        width: 10px;
        height: 10px;
        background: #2a2a2a;
        border: 2px solid var(--edge);
      }
      .slots i.on {
        background: var(--blue);
        border-color: var(--blue-edge);
      }
      .tagb {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 1px;
        padding: 1px 5px;
        background: var(--blue);
        color: #fff;
      }
      .tagb.gold {
        background: #d4a017;
        color: #1a1a1a;
      }
      .tagb.red {
        background: #8a2a2a;
      }
      /* ---- the leaderboard: two pickers, a podium, then the rest ---- */
      .lb-pick {
        display: grid;
        grid-template-columns: 1fr 1.25fr;
        gap: 8px;
      }
      .lb-sel {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        min-width: 0;
        background: var(--panel);
        border: 3px solid var(--edge);
        padding: 8px 30px 8px 10px;
        text-align: left;
        font-weight: bold;
      }
      .lb-sel:active {
        border-color: #eee;
      }
      .lb-sel::after {
        content: "";
        position: absolute;
        right: 10px;
        top: 50%;
        margin-top: -3px;
        border: 6px solid transparent;
        border-top-color: #aaa;
        border-bottom: 0;
      }
      .lb-sel .k {
        font-size: 10px;
        color: var(--dim);
        letter-spacing: 2px;
      }
      .lb-sel .v {
        font-size: 14px;
        letter-spacing: 1px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lb-seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 3px solid var(--edge);
        background: var(--panel);
      }
      .lb-seg button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: none;
        border: none;
        padding: 9px 6px;
        font-weight: bold;
        font-size: 13px;
        letter-spacing: 1px;
        color: #888;
      }
      .lb-seg button.on {
        background: var(--blue);
        color: #fff;
      }
      .podium {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        align-items: end;
        gap: 6px;
        margin-top: 8px;
      }
      .pod {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 0;
        background: none;
        border: none;
        padding: 0;
        font-weight: bold;
      }
      .pod-who {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        padding: 0 2px;
      }
      .pod-time {
        font-size: 12px;
        color: #aaa;
      }
      .pod-step {
        width: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 8px;
        margin-top: 4px;
        font-size: 26px;
        font-weight: 900;
        border: 3px solid;
      }
      .pod.p1 .pod-step {
        height: 92px;
        background: #d4a017;
        border-color: #8a6a0e;
        color: #1a1a1a;
      }
      .pod.p2 .pod-step {
        height: 68px;
        background: #a3acb5;
        border-color: #646c74;
        color: #1a1a1a;
      }
      .pod.p3 .pod-step {
        height: 52px;
        background: #b06d34;
        border-color: #6e4320;
        color: #fff;
      }
      .pod.p1 .pod-who {
        font-size: 15px;
      }
      .pod.me .pod-who {
        color: #8fb4ff;
      }
      .pod:active .pod-step {
        border-color: #eee;
      }
      .lb-list {
        display: flex;
        flex-direction: column;
        border-top: 3px solid var(--edge);
      }
      .lb-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: none;
        border: none;
        border-bottom: 2px solid var(--edge);
        padding: 12px 6px;
        font-weight: bold;
        font-size: 14px;
        text-align: left;
      }
      .lb-row:active {
        background: var(--panel);
      }
      .lb-row .n {
        flex-shrink: 0;
        width: 28px;
        color: var(--dim);
        text-align: right;
      }
      .lb-row .who {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lb-row .time {
        flex-shrink: 0;
        color: #ddd;
      }
      .lb-row.me {
        background: #1d2533;
        box-shadow: inset 4px 0 0 var(--blue);
      }
      .lb-row.lb-you {
        position: sticky;
        bottom: -28px;
        margin-top: 10px;
        background: var(--blue);
        border: 3px solid var(--blue-edge);
        color: #fff;
      }
      .lb-row.lb-you .n,
      .lb-row.lb-you .time {
        color: #fff;
      }
      /* MORE INFO */
      #info-dim {
        position: fixed;
        inset: 0;
        z-index: 32;
        background: rgba(0, 0, 0, 0.5);
        display: none;
      }
      #info-dim.on {
        display: block;
      }
      .sheet.info {
        z-index: 33;
        height: auto;
        max-height: 86%;
      }
      .info .sheet-list {
        padding: 14px 16px calc(18px + var(--safe-b));
        -webkit-user-select: text;
        user-select: text;
      }
      .info-view {
        display: block;
        width: 100%;
        height: 150px;
        background: #222;
        border: 3px solid var(--edge);
        margin-bottom: 12px;
      }
      .info-name {
        margin: 0;
        font-size: 24px;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }
      .info-by {
        background: none;
        border: none;
        padding: 4px 0 10px;
        font-weight: bold;
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 1px;
      }
      .info-by span {
        color: #fff;
        text-decoration: underline;
      }
      .info .tags {
        margin-bottom: 12px;
      }
      .info-desc {
        font-size: 14px;
        line-height: 1.45;
        color: #ddd;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 12px;
        background: var(--bg);
        border: 3px solid var(--edge);
      }
      .info-desc .dim {
        color: var(--dim);
      }
      .istats {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .istat {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 10px 12px;
        background: var(--bg);
        border: 3px solid var(--edge);
        font-weight: bold;
      }
      .istat .k {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--dim);
      }
      .istat .v {
        font-size: 16px;
      }
      .vtags {
        margin-top: -4px;
      }
      .tag.vtag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(0, 0, 0, 0.4);
        border-color: #444;
        color: #aaa;
      }
      .tag.vtag.ok {
        background: #1d3324;
        border-color: #2ecc71;
        color: #2ecc71;
      }
      .tag.vtag.blue {
        background: #1d2533;
        border-color: #4aa3ff;
        color: #4aa3ff;
      }
      .tag.vtag.blue.no {
        border-color: #3f6fa8;
        color: #7c9cc4;
      }
      .tag.vtag.blue.no .bc {
        opacity: 0.5;
      }
      .tag.vtag.imp {
        background: #3a1520;
        border-color: #b8364f;
        color: #ff8095;
      }
      .tag.vtag .bc {
        width: 9px;
        height: 9px;
        border-width: 1px;
      }
      .vwho {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        color: inherit;
        text-decoration: underline;
        text-transform: none;
      }
      .info-music {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
        padding: 12px;
        background: var(--bg);
        border: 3px solid var(--edge);
        font-weight: bold;
      }
      .info-music svg {
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        fill: #335699;
      }
      .im-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .im-text .k {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--dim);
      }
      .im-text .t,
      .im-text .a {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .im-text .a {
        font-size: 12px;
        color: var(--dim);
      }
      .im-speed {
        flex-shrink: 0;
        background: #335699;
        padding: 3px 8px;
        font-size: 11px;
      }
      .info-sec {
        margin: 18px 0 8px;
        font-weight: bold;
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--dim);
      }
      #info-times {
        margin-top: 4px;
      }
      .info-btns {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 14px;
      }
      .info-btns .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
      }
      .info-btns .btn svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      /* A sheet sized by what's in it: its list takes its own height (a
         flex:1 list in an auto-height sheet is 0 tall on some phones) */
      .sheet.pick .sheet-list,
      .sheet.info .sheet-list {
        flex: 0 1 auto;
      }
      /* the game's leaderboard cards */
      .lb-cards {
        display: flex;
        flex-direction: column;
      }
      .lb-host {
        display: block;
        cursor: pointer;
      }
      .lb-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #222;
        padding: 15px;
        margin-bottom: 8px;
        border: 1px solid #333;
        font-weight: bold;
      }
      .lb-card.me {
        background: #1a2a40;
        border-color: #335699;
      }
      .lb-card .l {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .lb-card .n {
        font-size: 1.2rem;
        color: #666;
        width: 25px;
      }
      .lb-card .who {
        color: #ccc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lb-card .time {
        font-family: monospace;
        font-size: 1.1rem;
        flex-shrink: 0;
      }
      /* comments drawn by the game, as on the level page */
      .sheet-list.desk {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 12px;
        -webkit-user-select: none;
        user-select: none;
      }
      .dcmt {
        display: block;
        font-size: 16px;
      }
      .cmt-progress {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: bold;
        color: #ccc;
        background: rgba(0, 0, 0, 0.3);
        padding: 8px 12px;
        border: 1px solid #333;
      }
      .sheet-input .cmt-progress input {
        flex: none;
        accent-color: #335699;
        width: 16px;
        height: 16px;
        margin: 0;
        padding: 0;
      }
      .sheet-input .cmt-row input {
        background: #333;
        border: 1px solid #555;
      }
      .creator.plain,
      .info-by.plain {
        cursor: default;
      }
      .info-by.plain span {
        text-decoration: none;
      }
      /* the picking sheet */
      #pick-dim {
        position: fixed;
        inset: 0;
        z-index: 32;
        background: rgba(0, 0, 0, 0.5);
        display: none;
      }
      #pick-dim.on {
        display: block;
      }
      .sheet.pick {
        z-index: 33;
        height: auto;
        max-height: 72%;
      }
      .pick .sheet-list {
        padding: 8px 14px calc(16px + var(--safe-b));
      }
      .pick-row {
        display: block;
        width: 100%;
        background: var(--bg);
        border: 3px solid var(--edge);
        margin-top: 8px;
        padding: 13px 12px;
        font-weight: bold;
        font-size: 14px;
        letter-spacing: 1px;
        text-align: left;
      }
      .pick-row.on {
        background: var(--blue);
        border-color: var(--blue-edge);
      }
      .pick-head {
        margin: 16px 0 0;
        font-weight: bold;
        font-size: 12px;
        color: var(--dim);
        letter-spacing: 2px;
      }
      .pick-head:first-child {
        margin-top: 6px;
      }
      .pick-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .pick-grid .pick-row {
        text-align: center;
        padding: 12px 0;
      }
      .pick-grid:has(> :nth-child(3):last-child) {
        grid-template-columns: repeat(3, 1fr);
      }

      /* ---- a confirm box ---- */
      #ask {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      #ask.on {
        display: flex;
      }
      .ask-box {
        width: min(360px, 100%);
        background: var(--panel);
        border: 4px solid var(--edge);
        padding: 18px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
      .ask-box h3 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 2px;
        text-shadow: 3px 3px 0 var(--blue);
      }
      .ask-box p {
        margin: 0;
        color: #ccc;
        font-size: 14px;
        line-height: 1.4;
      }
      .ask-btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .sort {
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        font-size: 14px;
        font-weight: bold;
        color: #bbb;
        padding: 6px 1px;
        white-space: nowrap;
        text-shadow: 2px 2px 0 #000;
        letter-spacing: 1px;
      }
      .sort.on {
        color: #fff;
        border-bottom-color: #fff;
      }
      .corner {
        position: absolute;
        top: calc(var(--safe-t) + 8px);
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(17, 17, 17, 0.55);
        border: 3px solid var(--edge);
      }
      .corner svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      .corner.left {
        left: 12px;
      }
      .corner.right {
        right: 12px;
      }
      .corner:active {
        border-color: #eee;
      }

      /* ---- one level card ---- */
      .info {
        position: absolute;
        left: 14px;
        right: 84px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 2;
      }
      .creator {
        font-weight: bold;
        font-size: 15px;
        background: none;
        border: none;
        padding: 0;
        text-align: left;
        align-self: flex-start;
      }
      .lvl-name {
        background: none;
        border: none;
        padding: 0;
        text-align: left;
        font-size: 24px;
        font-weight: bold;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tag {
        font-size: 11px;
        font-weight: bold;
        padding: 3px 6px;
        border: 2px solid rgba(0, 0, 0, 0.35);
        color: #fff;
        text-shadow: none;
        text-transform: uppercase;
      }
      /* the player's own BEATEN / BLUE COIN, beside the level's tags */
      .tags:not(:has(.tag)) {
        display: none;
      }
      /* the desktop's tags, drawn by the game */
      .tags.gtags {
        display: block;
      }
      .tags.gtags.empty {
        display: none;
      }
      .dver {
        display: block;
        margin-top: -4px;
      }
      .st-tags {
        display: contents;
      }
      .tag.st-beaten {
        background: #2ecc71;
        color: #10331d;
      }
      .tag.st-blue {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(0, 0, 0, 0.55);
        border-color: #4d8ce0;
        color: #9ec0f0;
      }
      .tag.st-blue .bc {
        width: 9px;
        height: 9px;
        border-width: 1px;
        opacity: 0.5;
      }
      .tag.st-blue.got {
        background: #335699;
        border-color: #1f3a6e;
        color: #fff;
      }
      .tag.st-blue.got .bc {
        opacity: 1;
      }
      .desc {
        font-size: 13px;
        color: #ddd;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .play {
        margin-top: 4px;
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--blue);
        border: 4px solid var(--blue-edge);
        border-bottom-width: 7px;
        color: #fff;
        font-weight: bold;
        font-size: 18px;
        letter-spacing: 2px;
        padding: 10px 26px 8px 20px;
      }
      .play svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .play:active {
        border-color: #eee;
        border-bottom-width: 4px;
        transform: translateY(3px);
      }
      .rail {
        position: absolute;
        right: 10px;
        bottom: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 2;
      }
      .rail button {
        background: none;
        border: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 12px;
        font-weight: bold;
        min-width: 56px;
      }
      .rail .ico {
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(17, 17, 17, 0.6);
        border: 3px solid var(--edge);
      }
      .rail button:active .ico {
        border-color: #eee;
      }
      /* The vote you gave stays lit: up in the player's blue, down in lava */
      .rail .ico.voted-up {
        background: var(--blue);
        border-color: #fff;
      }
      .rail .ico.voted-down {
        background: #de2511;
        border-color: #fff;
      }
      .rail .ico svg {
        width: 24px;
        height: 24px;
        fill: #fff;
      }

      /* ---- bottom tabs ---- */
      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(var(--tabs-h) + var(--safe-b));
        padding-bottom: var(--safe-b);
        background: var(--panel);
        border-top: 3px solid var(--edge);
        display: flex;
        z-index: 20;
      }
      .tab {
        flex: 1;
        background: none;
        border: none;
        border-top: 4px solid transparent;
        margin-top: -3px;
        color: var(--dim);
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
      }
      .tab svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .tab.on {
        color: #fff;
        border-top-color: var(--blue);
      }
      .tab.main .sq {
        width: 50px;
        height: 30px;
        background: var(--block);
        border: 3px solid var(--edge);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .tab.main.on {
        border-top-color: transparent;
      }
      .tab.main.on .sq {
        background: var(--blue);
        border-color: var(--blue-edge);
      }

      /* ---- campaign chapter cards ---- */
      .chapter {
        background: #222;
      }
      .chapter .veil {
        position: absolute;
        inset: 0;
        background: rgba(17, 17, 17, 0.55);
      }
      .chapter .body {
        position: absolute;
        inset: 0;
        padding: calc(var(--safe-t) + 28px) 18px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        z-index: 2;
      }
      .ch-num {
        font-size: 14px;
        font-weight: bold;
        color: #ccc;
        letter-spacing: 3px;
      }
      .ch-title {
        font-size: 40px;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 4px 4px 0 var(--blue);
        text-align: center;
        margin: 0;
      }
      .ch-stat {
        font-size: 14px;
        font-weight: bold;
        color: #ddd;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bc {
        display: inline-block;
        width: 12px;
        height: 12px;
        background: var(--blue);
        border: 2px solid #fff;
      }
      .lvl-grid {
        display: grid;
        grid-template-columns: repeat(5, 56px);
        gap: 10px;
        justify-content: center;
        margin-top: 6px;
      }
      .lvl {
        position: relative;
        width: 56px;
        height: 56px;
        background: var(--block);
        border: 4px solid var(--edge);
        font-size: 22px;
        font-weight: bold;
      }
      .lvl:active:not(:disabled) {
        border-color: #eee;
      }
      .lvl.beaten {
        background: var(--blue);
        border-color: var(--blue-edge);
      }
      .lvl:disabled {
        opacity: 0.4;
      }
      .lvl .bc {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 14px;
        height: 14px;
      }
      .locked-note {
        font-size: 14px;
        font-weight: bold;
        color: #ccc;
        text-align: center;
        border: 3px solid var(--edge);
        background: rgba(17, 17, 17, 0.7);
        padding: 10px 14px;
      }

      /* ---- plain block buttons (menus stay plain) ---- */
      .btn {
        background: var(--block);
        border: 4px solid var(--edge);
        color: #fff;
        font-weight: bold;
        font-size: 15px;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 13px 12px;
        min-width: 0;
      }
      .btn:active {
        border-color: #eee;
      }
      .btn.blue {
        background: var(--blue);
        border-color: var(--blue-edge);
      }
      .btn-col {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(320px, 100%);
      }

      /* ---- ME ---- */
      .me {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        padding: calc(var(--safe-t) + 22px) 16px 24px;
      }
      /* The profile tab is drawn like the game's Account screen: your name,
         the stats boxes, your crates, your locker, the account buttons */
      .acct {
        max-width: 420px;
        margin: 0 auto;
      }
      .me-name {
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 3px 3px 0 var(--blue);
        overflow-wrap: anywhere;
        text-align: center;
        text-transform: uppercase;
        margin: 4px 0 18px;
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .stat {
        background: var(--panel);
        border: 3px solid var(--edge);
        padding: 14px 8px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-weight: bold;
        min-width: 0;
      }
      button.stat:active {
        border-color: #eee;
      }
      .stat.wide {
        grid-column: 1 / -1;
      }
      .stat .k {
        font-size: 12px;
        color: #aaa;
        letter-spacing: 1px;
      }
      .stat .v {
        font-size: 24px;
      }
      .stat .t {
        font-size: 11px;
        color: var(--dim);
        letter-spacing: 1px;
      }
      .sec-head {
        margin: 22px 0 12px;
        padding: 0 2px 8px;
        border-bottom: 2px solid var(--edge);
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
      }
      .locker-tabs {
        position: relative;
        display: flex;
        gap: 18px;
        overflow-x: auto;
        scrollbar-width: none;
        margin: 22px 0 12px;
        border-bottom: 2px solid var(--edge);
      }
      .locker-tabs::-webkit-scrollbar {
        display: none;
      }
      .locker-tab {
        flex-shrink: 0;
        background: none;
        border: none;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
        padding: 0 0 8px;
        font-size: 15px;
        font-weight: bold;
        letter-spacing: 1px;
        color: var(--dim);
        white-space: nowrap;
      }
      .locker-tab.on {
        color: #fff;
        border-bottom-color: #fff;
      }
      .acct-btns {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 28px;
      }
      .btn.red {
        background: #a44;
        border-color: #822;
      }
      .skin .art .pic {
        width: 100%;
        height: 100%;
        background: center / cover no-repeat;
      }
      .skin .art canvas {
        width: 100%;
        height: 100%;
      }
      .skins.wide .art {
        width: 100%;
        height: 64px;
      }
      .tab-name {
        max-width: 100%;
        padding: 0 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-transform: uppercase;
      }
      .me-btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        max-width: 420px;
        margin: 18px auto 0;
      }
      .me-btns .wide {
        grid-column: 1 / -1;
      }
      .me-label {
        max-width: 420px;
        margin: 24px auto 10px;
        font-weight: bold;
        font-size: 14px;
        color: var(--dim);
        letter-spacing: 2px;
      }
      .skins {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        max-width: 420px;
        margin: 0 auto;
      }
      .skin {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 4px 8px;
        background: var(--panel);
        border: 3px solid var(--edge);
        min-width: 0;
      }
      .skin:active {
        border-color: #eee;
      }
      .skin.using {
        border-color: var(--blue);
        background: #1d2533;
      }
      .skin .art {
        width: 56px;
        height: 56px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .skin .art img {
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
      }
      .skin .art .block {
        width: 30px;
        height: 56px;
        background: var(--blue);
      }
      .skin .sname {
        width: 100%;
        font-size: 11px;
        font-weight: bold;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .skin .flag,
      .skin .count {
        position: absolute;
        top: -3px;
        font-size: 10px;
        font-weight: bold;
        padding: 2px 5px;
      }
      .skin .flag {
        left: -3px;
        background: var(--blue);
      }
      .skin .count {
        right: -3px;
        background: var(--block);
        border: 2px solid var(--edge);
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        max-width: 420px;
        margin: 0 auto;
      }
      .thumb {
        position: relative;
        aspect-ratio: 3 / 4;
        background: #222 center / cover no-repeat;
        border: none;
        padding: 0;
        overflow: hidden;
      }
      .thumb canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .thumb span {
        position: absolute;
        left: 5px;
        bottom: 4px;
        right: 5px;
        font-size: 11px;
        font-weight: bold;
        text-align: left;
        text-shadow: 1px 1px 0 #000, 2px 2px 0 #000;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        color: var(--dim);
        text-align: center;
        font-weight: bold;
        padding: 18px;
        border: 3px dashed var(--edge);
        max-width: 420px;
        margin: 0 auto;
        font-size: 13px;
      }

      /* ---- a feed opened from a profile grid or search ---- */
      .layer {
        position: fixed;
        inset: 0;
        bottom: calc(var(--tabs-h) + var(--safe-b));
        z-index: 15;
        background: var(--bg);
        display: none;
      }
      .layer.on {
        display: block;
      }
      /* ---- search page ---- */
      .page {
        position: fixed;
        inset: 0;
        bottom: calc(var(--tabs-h) + var(--safe-b));
        z-index: 14;
        background: var(--bg);
        display: none;
        flex-direction: column;
      }
      .page.on {
        display: flex;
      }
      .search-bar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: calc(var(--safe-t) + 8px) 12px 8px;
        background: var(--panel);
        border-bottom: 3px solid var(--edge);
      }
      .sq-btn {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--block);
        border: 3px solid var(--edge);
      }
      .sq-btn:active {
        border-color: #eee;
      }
      .sq-btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .search-bar input {
        flex: 1;
        min-width: 0;
        height: 40px;
        background: #222;
        border: 3px solid var(--edge);
        color: #fff;
        font-family: inherit;
        font-size: 16px;
        font-weight: bold;
        padding: 0 10px;
        outline: none;
      }
      .search-bar input:focus {
        border-color: var(--blue);
      }
      .results {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px 12px 24px;
      }
      .res-label {
        max-width: 420px;
        margin: 16px auto 8px;
        font-weight: bold;
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 2px;
      }
      .players {
        max-width: 420px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .player {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: var(--panel);
        border: 3px solid var(--edge);
        padding: 8px 10px;
        font-size: 16px;
        font-weight: bold;
        text-align: left;
      }
      .player:active {
        border-color: #eee;
      }
      .player .pfp {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        background: var(--blue);
        border: 3px solid var(--blue-edge);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      .player .pname {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .more-btn {
        display: block;
        width: 100%;
        max-width: 420px;
        margin: 10px auto 0;
      }

      /* ---- comments: a sheet that slides up over the feed ---- */
      #sheet-dim {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(0, 0, 0, 0.5);
        display: none;
      }
      #sheet-dim.on {
        display: block;
      }
      .sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 72%;
        z-index: 31;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-top: 4px solid var(--edge);
        transform: translateY(105%);
        transition: transform 0.18s ease-out;
      }
      .sheet.on {
        transform: none;
      }
      @media (min-width: 700px) {
        .sheet {
          left: 50%;
          width: min(480px, 100%);
          margin-left: max(-240px, -50%);
          border-left: 3px solid var(--edge);
          border-right: 3px solid var(--edge);
        }
      }
      .sheet-head {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 3px solid var(--edge);
      }
      .sheet-head .sheet-title {
        flex: 1;
        min-width: 0;
        text-align: center;
        font-weight: bold;
        font-size: 15px;
        letter-spacing: 2px;
        padding-left: 50px;
      }
      .sheet-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px 14px 14px;
        -webkit-user-select: text;
        user-select: text;
      }
      .cmt {
        display: flex;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 2px solid #222;
      }
      .cmt .cbody {
        flex: 1;
        min-width: 0;
      }
      .cmt .cwho {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--dim);
        font-weight: bold;
      }
      .cmt .cname {
        background: none;
        border: none;
        padding: 0;
        color: #ddd;
        font-weight: bold;
        font-size: 13px;
      }
      .cmt .badge {
        font-size: 10px;
        padding: 1px 5px;
        color: #fff;
        background: #3c8d5a;
      }
      .cmt .badge.blue {
        background: var(--blue);
      }
      .cmt .ctext {
        margin-top: 3px;
        font-size: 15px;
        line-height: 1.3;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .cmt .ctext.gone {
        color: var(--dim);
        font-style: italic;
      }
      .sheet-input {
        flex-shrink: 0;
        display: flex;
        gap: 8px;
        padding: 10px 12px calc(10px + var(--safe-b));
        border-top: 3px solid var(--edge);
        background: var(--bg);
      }
      .sheet-input input {
        flex: 1;
        min-width: 0;

    <script>
      "use strict";

      // =====================================================================

      const SUPABASE_URL = "https://heqmnluegbbglmhtublu.supabase.co";

        if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, "") + "K";

      }

      function toast(text) {

      const DIFFICULTY_LABELS = {
        1: "No Skill", 2: "Very Easy", 3: "Easy", 4: "Medium", 5: "Hard",
        6: "Very Hard", 7: "Ultra Hard", 8: "Nightmare", 9: "Extreme", 10: "Insane",
      };
      const DIFFICULTY_COLORS = {
        1: "#2ecc71", 2: "#27ae60", 3: "#f1c40f", 4: "#f39c12", 5: "#e67e22",
        6: "#d35400", 7: "#e74c3c", 8: "#c0392b", 9: "#8e44ad", 10: "#ffffff",
      };

      const ICONS = {
        play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
        like: '<svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>',
        dislike: '<svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>',
        comment: '<svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>',
        plays: '<svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm3 3v12h12V6H6zm3 2.5l7 3.5-7 3.5v-7z"/></svg>',
      };

      // ---------------------------------------------------------------------
      // LEVEL PREVIEWS
      // A level drawn flat on a canvas with the game's own colours: walls
      // #444 edged #333, lava #de2511, coins #e2e838, the player and Blue
      // Coins #335699, spikes #aaa. Painted walls take their paint.
      // ---------------------------------------------------------------------

      function rleDecodeRow(encoded) {
        let out = "";
        let i = 0;
        while (i < encoded.length) {
          let digits = "";
          while (i < encoded.length && encoded[i] >= "0" && encoded[i] <= "9") digits += encoded[i++];
          if (i >= encoded.length) break;
          const ch = encoded[i++];
          out += ch.repeat(digits ? parseInt(digits, 10) : 1);
        }
        return out;
      }
      // { "#f00": "3,4 4,4" } (packed) or { "3,4": "#f00" } (plain) -> plain
      function cellValues(field, packed) {
        if (!field || typeof field !== "object") return {};
        if (!packed) return field;
        const out = {};
        Object.keys(field).forEach((value) => {
          String(field[value]).split(" ").forEach((k) => k && (out[k] = value));
        });
        return out;
      }
      function cellConfigs(field, packed) {
        if (!field) return {};
        if (Array.isArray(field)) {
          const out = {};
          field.forEach(([cfg, cells]) =>
            String(cells).split(" ").forEach((k) => k && (out[k] = cfg)),
          );
          return out;
        }
        return typeof field === "object" ? field : {};
      }
      function cellSet(field) {
        if (!field) return new Set();
        if (typeof field === "string") return new Set(field.split(" ").filter(Boolean));
        return new Set(Array.isArray(field) ? field : []);
      }
      const isColour = (v) =>
        typeof v === "string" && /^(#[0-9a-f]{3,8}|rgba?\(|hsla?\()/i.test(v.trim());
      // A picture, by the game's rule (a web or data address, or a file
      // name like sunset.png), or written as url(...)
      const isImage = (v) =>
        typeof v === "string" &&
        (/^(https?:\/\/|data:image|url\()/i.test(v.trim()) || /\.(png|jpg|jpeg|gif|webp)$/i.test(v.trim()));
      const imageUrl = (v) => v.trim().replace(/^url\(["']?|["']?\)$/g, "");
      // Any CSS colour the game would show: hex, rgb(), named ("white")
      const isPaint = (v) => {
        if (typeof v !== "string" || !v.trim()) return false;
        if (isColour(v)) return true;
        try {
          return CSS.supports("color", v.trim());
        } catch (e) {
          return false;
        }
      };
      // A gradient or other CSS background a canvas can't paint itself
      const isCssBackground = (v) => {
        if (typeof v !== "string" || !v.trim() || isImage(v) || isPaint(v)) return false;
        try {
          return CSS.supports("background", v.trim());
        } catch (e) {
          return false;
        }
      };
      // The background the game shows first: an animated one's first frame
      function levelBackground(data) {
        const anim = data.bgAnimation;
        if (anim && Array.isArray(anim.values) && anim.values.length && anim.values[0]) return anim.values[0];
        return data.background;
      }
      // Pictures for previews, loaded once; every canvas waiting on one is
      // drawn again when it arrives
      const previewImages = new Map();
      function previewImage(url, redraw) {
        let e = previewImages.get(url);
        if (!e) {
          e = { img: new Image(), ok: false, bad: false, waiting: new Set() };
          e.img.decoding = "async";
          e.img.onload = () => {
            e.ok = true;
            const w = [...e.waiting];
            e.waiting.clear();
            w.forEach((f) => f());
          };
          e.img.onerror = () => {
            e.bad = true;
            e.waiting.clear();
          };
          e.img.src = url;
          previewImages.set(url, e);
        }
        if (!e.ok && !e.bad && redraw) e.waiting.add(redraw);
        return e.ok ? e.img : null;
      }
      // A picture over a rectangle the way CSS "cover" does, cut to it
      function drawCover(g, img, x, y, w, h) {
        const iw = img.naturalWidth || img.width;
        const ih = img.naturalHeight || img.height;
        if (!iw || !ih || w <= 0 || h <= 0) return;
        const k = Math.max(w / iw, h / ih);
        const dw = iw * k;
        const dh = ih * k;
        g.save();
        g.beginPath();
        g.rect(x, y, w, h);
        g.clip();
        try {
          g.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
        } catch (e) {}
        g.restore();
      }

      function shadeHex(hex, f) {
        const m = /^#([0-9a-f]{3}|[0-9a-f]{6})/i.exec(hex || "");
        if (!m) return "#333";
        let h = m[1];
        if (h.length === 3) h = h.replace(/./g, "$&$&");
        const n = parseInt(h, 16);
        const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v * f));
        return "rgb(" + c.join(",") + ")";
      }

      // Everything the drawing needs, worked out once per level
      function parseLevel(data) {
        if (!data || !Array.isArray(data.plan)) return null;
        const packed = data.fmt === "boi1";
        const plan = packed ? data.plan.map(rleDecodeRow) : data.plan.slice();
        const rows = plan.length;
        let cols = 0;
        plan.forEach((r) => (cols = Math.max(cols, r.length)));
        let player = null;
        plan.forEach((r, y) => {
          const x = r.indexOf("@");
          if (x >= 0 && !player) player = { x, y };
        });
        const bg = levelBackground(data);
        return {
          // FORCE ZOOM: the game always shows it zoomed in on the player
          zoom: !!(data.forceZoom || data.force_zoom),
          plan,
          rows,
          cols,
          player: player || { x: cols / 2, y: rows - 2 },
          colors: cellValues(data.colors, packed),
          configs: cellConfigs(data.blockConfigs, packed),
          hidden: cellSet(data.invisibles),
          areas: Array.isArray(data.areaBackgrounds) ? data.areaBackgrounds : [],
          bg: isPaint(bg) ? bg.trim() : isImage(bg) ? "#111" : "#222",
          bgImage: isImage(bg) ? imageUrl(bg) : null,
          bgCss: isCssBackground(bg) ? bg.trim() : null,
        };
      }

      let mySkinImage = null;
      let mySkinColor = null;

      function drawCell(g, ch, x, y, s, paint) {
        const bw = Math.max(1, Math.round(s * 0.075));
        const block = (fill, edge) => {
          g.fillStyle = edge;
          g.fillRect(x, y, s, s);
          g.fillStyle = fill;
          g.fillRect(x + bw, y + bw, s - 2 * bw, s - 2 * bw);
        };
        const tri = (pts) => {
          g.fillStyle = paint || "#aaa";
          g.beginPath();
          g.moveTo(x + pts[0] * s, y + pts[1] * s);
          for (let i = 2; i < pts.length; i += 2) g.lineTo(x + pts[i] * s, y + pts[i + 1] * s);
          g.closePath();
          g.fill();
        };
        const circle = (r, fill) => {
          g.fillStyle = fill;
          g.beginPath();
          g.arc(x + s / 2, y + s / 2, r * s, 0, Math.PI * 2);
          g.fill();
        };
        switch (ch) {
          case "x":
          case "W":
          case "F":
            if (paint) block(paint, shadeHex(paint, 0.72));
            else block("#444", "#333");
            return;
          case "K":
          case "k":
          case "{":
          case "}":
            block(paint || "#444", paint ? shadeHex(paint, 0.72) : "#333");
            return;
          case "G":
            block("#4a4a4a", "#555");
            g.fillStyle = "#3a3a3a";
            g.fillRect(x + s * 0.3, y + s * 0.3, s * 0.15, s * 0.15);
            g.fillRect(x + s * 0.6, y + s * 0.55, s * 0.15, s * 0.15);
            return;
          case "!":
          case "=":
          case "|":
          case "v":
          case "^":
            g.fillStyle = paint || "#de2511";
            g.fillRect(x, y, s, s);
            return;
          case "H":
          case "V":
            block(paint || "#777", paint ? shadeHex(paint, 0.72) : "#555");
            return;
          case "I":
            block("#8ec9ee", "#eaf8ff");
            return;
          case "o":
            circle(0.3, "#e2e838");
            return;
          case "B":
            circle(0.3, "#335699");
            g.strokeStyle = "#fff";
            g.lineWidth = Math.max(1, s * 0.05);
            g.stroke();
            return;
          case "S":
            return tri([0, 1, 0.5, 0.35, 1, 1]);
          case "s":
            return tri([0, 0, 0.5, 0.65, 1, 0]);
          case "[":
            return tri([1, 0, 0.35, 0.5, 1, 1]);
          case "]":
            return tri([0, 0, 0.65, 0.5, 0, 1]);
          case ">":
            g.fillStyle = paint || "#444";
            g.beginPath();
            g.moveTo(x, y + s);
            g.lineTo(x + s, y);
            g.lineTo(x + s, y + s);
            g.fill();
            return;
          case "<":
            g.fillStyle = paint || "#444";
            g.beginPath();
            g.moveTo(x, y);
            g.lineTo(x + s, y + s);
            g.lineTo(x, y + s);
            g.fill();
            return;
          case "J":
            g.fillStyle = "#ea80fc";
            g.fillRect(x, y + s * 0.5, s, s * 0.5);
            g.fillStyle = "#4a148c";
            g.fillRect(x + bw, y + s * 0.5 + bw, s - 2 * bw, s * 0.5 - 2 * bw);
            return;
          case "R":
          case "A":
          case "E":
            g.fillStyle = ch === "R" ? "#2563eb" : ch === "A" ? "#ea580c" : "#0d9488";
            g.fillRect(x, y + s * 0.65, s, s * 0.35);
            return;
          case "D":
          case "d":
            block("#7a3b06", "#5a2a04");
            return;
          case "C":
            block("#666", "#444");
            return;
          case "P":
            g.fillStyle = "#1f3d2b";
            g.fillRect(x + s * 0.3, y + s * 0.2, s * 0.4, s * 0.8);
            return;
          case "T":
            block("#1a1a2e", "#9b6bff");
            return;
          case "@": {
            const w = s * 0.5;
            const h = s;
            const px = x + (s - w) / 2;
            const py = y + s - h;
            if (mySkinImage && mySkinImage.complete && mySkinImage.naturalWidth) {
              const iw = h * (mySkinImage.naturalWidth / mySkinImage.naturalHeight);
              g.drawImage(mySkinImage, x + (s - iw) / 2, py, iw, h);
            } else {
              g.fillStyle = mySkinColor || "#335699";
              g.fillRect(px, py, w, h);
            }
            return;
          }
        }
      }

      // Draws the level into a canvas the size of `box`. The level fills
      // the space above the card's text by height (blocks 16-34px), centred
      // on the player, and sits on the ground like it does in the game.
      function drawLevel(canvas, lvl, box) {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        const W = Math.max(1, Math.round(box.w));
        const H = Math.max(1, Math.round(box.h));
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        const g = canvas.getContext("2d");
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, W, H);
        if (!lvl) return;
        const top = box.top || 0;
        const bottom = box.bottom || 0;
        const areaH = Math.max(60, H - top - bottom);
        // Forced zoom: as the game's zoomed camera, 15 blocks across the
        // screen with the player in the middle
        const s = lvl.zoom
          ? W / 15
          : Math.max(box.min || 16, Math.min(box.max || 34, areaH / lvl.rows, (W * 1.0) / Math.min(lvl.cols, 8)));
        const levelW = lvl.cols * s;
        const levelH = lvl.rows * s;
        let ox, oy;
        if (levelW <= W) ox = (W - levelW) / 2;
        else ox = Math.min(0, Math.max(W - levelW, W / 2 - (lvl.player.x + 0.5) * s));
        if (levelH <= areaH) oy = top + areaH - levelH;
        else oy = Math.min(top, Math.max(top + areaH - levelH, top + areaH / 2 - (lvl.player.y + 0.5) * s));
        ox = Math.round(ox);
        oy = Math.round(oy);
        // Drawn again when a picture it needs arrives
        const again = () => canvas.isConnected && drawLevel(canvas, lvl, box);
        // The level's background as the game shows it: a colour fills the
        // whole screen; a picture covers the level, plain dark around it; a
        // gradient sits behind the canvas
        canvas.style.background = lvl.bgCss || "";
        if (!lvl.bgCss) {
          g.fillStyle = lvl.bg;
          g.fillRect(0, 0, W, H);
        }
        if (lvl.bgImage) {
          const img = previewImage(lvl.bgImage, again);
          if (img) drawCover(g, img, ox, oy, levelW, levelH);
        }
        lvl.areas.forEach((a) => {
          if (!a) return;
          let bg = a.bg;
          if (bg && typeof bg === "object" && Array.isArray(bg.values)) bg = bg.values[0];
          const x1 = Math.min(a.x1, a.x2), x2 = Math.max(a.x1, a.x2);
          const y1 = Math.min(a.y1, a.y2), y2 = Math.max(a.y1, a.y2);
          if (![x1, x2, y1, y2].every((n) => isFinite(n))) return;
          const rx = ox + x1 * s, ry = oy + y1 * s, rw = (x2 - x1 + 1) * s, rh = (y2 - y1 + 1) * s;
          if (isImage(bg)) {
            const img = previewImage(imageUrl(bg), again);
            if (img) drawCover(g, img, rx, ry, rw, rh);
          } else if (isPaint(bg)) {
            g.fillStyle = bg.trim();
            g.fillRect(rx, ry, rw, rh);
          }
        });
        const c0 = Math.max(0, Math.floor(-ox / s));
        const c1 = Math.min(lvl.cols, Math.ceil((W - ox) / s));
        const r0 = Math.max(0, Math.floor(-oy / s));
        const r1 = Math.min(lvl.rows, Math.ceil((H - oy) / s));
        for (let y = r0; y < r1; y++) {
          const row = lvl.plan[y];
          for (let x = c0; x < c1; x++) {
            let ch = row[x];
            if (!ch || ch === " " || ch === "Z") continue;
            const key = x + "," + y;
            if (lvl.hidden.has(key)) continue;
            const cfg = lvl.configs[key];
            if (cfg && cfg.opacity === 0) continue;
            if (cfg && typeof cfg.illusion === "string" && cfg.illusion.length === 1) ch = cfg.illusion;
            const paint = lvl.colors[key];
            if (paint === "invisible") continue;
            drawCell(g, ch, ox + x * s, oy + y * s, s, isColour(paint) ? paint : null);
          }
        }
      }

      // ---------------------------------------------------------------------
      // THE GAME FRAME
      // ---------------------------------------------------------------------
      const frame = $("game");
      let frameReady = false;
      let frameLoading = false;
      let frameOpen = false;
      let pending = null;
      let ignorePop = false;
      // Our own history.back() fires a popstate that is not the player's;
      // the flag clears itself so it can never swallow a real Back later
      let ignorePopTimer = null;
      function skipNextPop() {
        ignorePop = true;
        clearTimeout(ignorePopTimer);
        ignorePopTimer = setTimeout(() => (ignorePop = false), 700);
      }
      let gameState = null;
      // A back-button entry for something opening. Opened from MORE INFO,
      // it takes over the sheet's entry, so Back never lands on a closed sheet
      function pushEntry(state) {
        try {
          if (history.state && history.state.boiInfo && !$("info").classList.contains("on"))
            history.replaceState(state, "");
          else history.pushState(state, "");
        } catch (e) {}
      }

      // The game says it's ready within a few seconds. If it never does
      // (an old or broken copy of the game on the site), the wait says so
      // and offers another go, instead of LOADING forever
      let readyTimer = null;
      function loadFrame(fresh) {
        if (frameLoading) return;
        frameLoading = true;
        frame.src = "index.html?embed=1" + (fresh ? "&r=" + Date.now() : "");
        clearTimeout(readyTimer);
        readyTimer = setTimeout(gameDidNotLoad, 25000);
        $("wait-text").textContent = "LOADING";
        $("wait-retry").style.display = "none";
      }
      function gameDidNotLoad() {
        if (frameReady) return;
        frameLoading = false;
        $("wait-text").textContent = "THE GAME DID NOT LOAD";
        $("wait-retry").style.display = "";
      }
      $("wait-retry").onclick = () => loadFrame(true);
      // A copy opened from a folder (file://) has no real origin: messages
      // addressed to "file://" are dropped, so there it has to be "*"
      const MSG_ORIGIN = /^https?:$/.test(location.protocol) ? location.origin : "*";
      function tellGame(msg) {
        try {
          frame.contentWindow.postMessage(msg, MSG_ORIGIN);
        } catch (e) {}
      }
      // The ME tab shows the game's own Account screen, docked above the
      // tab bar, whenever someone is signed in and nothing else of the game
      // is open; the app's drawing of it is only the guest / loading view
      let docked = false;
      let dockReady = false;
      function syncDock() {
        const want = currentTab === "me" && frameReady && !frameOpen && !signingOut && !!(gameState && gameState.user);
        if (want === docked) return;
        docked = want;
        if (!want) {
          dockReady = false;
          frame.classList.remove("docked");
        }
        tellGame({ type: "boi-dock", on: want });
      }
      // Shows the game and hands it what to open; waits for it to load first
      function openGame(msg) {
        // Whatever opens replaces the docked Account screen
        docked = false;
        dockReady = false;
        frame.classList.remove("docked");
        loadFrame();
        if (!frameOpen) {
          frameOpen = true;
          pushEntry({ boiGame: true });
        }
        if (frameReady) {
          frame.classList.add("on");
          tellGame(msg);
          setTimeout(() => {
            try {
              frame.focus();
            } catch (e) {}
          }, 0);
        } else {
          pending = msg;
          $("wait").classList.add("on");
        }
      }
      function hideGame() {
        document.querySelectorAll(".card").forEach((c) => c._row && c.querySelector(".rail") && paintVotes(c));
        frameOpen = false;
        pending = null;
        frame.classList.remove("on");
        $("wait").classList.remove("on");
        // A Blue Coin may have been picked up: read them again with the state
        blueStale = true;
        tellGame({ type: "boi-state", full: currentTab === "me" });
        syncDock();
      }
      // The game says the player is done
      function gameClosed() {
        if (!frameOpen) return;
        hideGame();
        if (history.state && history.state.boiGame) {
          skipNextPop();
          history.back();
        }
      }
      // The phone's back button / gesture
      window.addEventListener("popstate", () => {
        if (ignorePop) {
          ignorePop = false;
          return;
        }
        if ($("sheet").classList.contains("on")) closeComments(true);
        else if ($("info").classList.contains("on")) closeInfo(true);
        else if (frameOpen) {
          if (!frameReady) {
            hideGame();
            tellGame({ type: "boi-stop" });
            return;
          }
          // The game goes back one screen (or closes itself when there is
          // nothing left to go back to), so the entry is put back
          try {
            history.pushState({ boiGame: true }, "");
          } catch (e) {}
          tellGame({ type: "boi-back" });
        } else if ($("layer").classList.contains("on")) closeLayer(true);
        else if ($("search").classList.contains("on")) closeSearch(true);
      });
      $("wait-cancel").onclick = () => {
        if (frameOpen) history.back();
      };
      window.addEventListener("message", (e) => {
        if (e.source !== frame.contentWindow) return;
        if (MSG_ORIGIN !== "*" && e.origin !== location.origin) return;
        const m = e.data || {};
        if (m.type === "boi-ready") {
          frameReady = true;
          clearTimeout(readyTimer);
          // A reloaded game (signed out, say) has nothing docked any more
          docked = false;
          dockReady = false;
          frame.classList.remove("docked");
          tellGame({ type: "boi-state", full: currentTab === "me" });
          if (pending && frameOpen) {
            const msg = pending;
            pending = null;
            $("wait").classList.remove("on");
            frame.classList.add("on");
            tellGame(msg);
          }
          if (livePanelOn()) tellGame({ type: "boi-live-watch", on: true });
        } else if (m.type === "boi-close") gameClosed();
        else if (m.type === "boi-commented") commentDone(m);
        else if (m.type === "boi-state") onGameState(m);
        else if (m.type === "boi-voted") voteDone(m);
        else if (m.type === "boi-docked") {
          // Shown only once the Account screen is up, so the main menu
          // never flashes in the tab
          if (m.ok && docked) {
            dockReady = true;
            setTimeout(() => docked && dockReady && frame.classList.add("docked"), 60);
          } else if (!m.ok) docked = false;
        }
        else if (m.type === "boi-played") {
          // The game counted a play: every card of that level shows it
          const id = Number(m.levelId);
          const bumped = new Set();
          document.querySelectorAll(".card").forEach((c) => {
            if (!c._row || Number(c._row.id) !== id) return;
            if (!bumped.has(c._row)) {
              bumped.add(c._row);
              c._row.plays = (Number(c._row.plays) || 0) + 1;
            }
            paintVotes(c);
          });
        }
        else if (m.type === "boi-live") onLive(m);
        else if (m.type === "boi-live-failed") toast(m.reason ? String(m.reason).slice(0, 40) : "COULD NOT JOIN");
      });

      // mode: "speedrun" / "deathrun" (swiped), or a normal play
      const playRow = (row, mode) => {
        taste.played(row);
        openGame({ type: "boi-play", row, mode: mode || null });
      };
      const openView = (view, extra) => openGame(Object.assign({ type: "boi-open", view }, extra || {}));
      const openProfile = (name) => name && openGame({ type: "boi-open", view: "profile", name });
      const openLevelPage = (row) => openGame({ type: "boi-open", view: "link", search: "?level=" + row.id });

      function onGameState(st) {
        const userChanged = !gameState || gameState.user !== st.user;
        gameState = st;
        syncDock();
        mySkinColor = st.skinColor || null;
        if (st.skinUrl) {
          if (!mySkinImage || mySkinImage.dataset.src !== st.skinUrl) {
            mySkinImage = new Image();
            mySkinImage.dataset.src = st.skinUrl;
            mySkinImage.onload = () => redrawVisible();
            mySkinImage.src = st.skinUrl;
          }
        } else mySkinImage = null;
        renderChapters();
        nameMeTab();
        if (userChanged || currentTab === "me") renderMe();
        if (userChanged) {
          signingOut = false;
          liveRoomsSig = "";
        }
        if (livePanelOn()) renderLive();
        if (userChanged || blueStale) loadMyBlue();
        else paintAllStatus();
      }

      // ---- BEATEN / BLUE COIN on each card ----
      // Beaten comes from the game's state; the Blue Coins you have from
      // community levels are bluecoin_claims rows "custom:<level id>"
      let myBlue = new Set();
      let blueFor = null;
      let blueStale = false;
      async function loadMyBlue() {
        blueStale = false;
        const user = gameState && gameState.user;
        if (!user || !db) {
          myBlue = new Set();
          blueFor = null;
          return paintAllStatus();
        }
        try {
          const { data, error } = await db
            .from("bluecoin_claims")
            .select("level_key")
            .eq("username", user)
            .like("level_key", "custom:%")
            .limit(5000);
          if (error || !gameState || gameState.user !== user) return;
          myBlue = new Set((data || []).map((r) => String(r.level_key).slice(7)));
          blueFor = user;
        } catch (e) {}
        paintAllStatus();
      }
      const planText = (data) => {
        const p = data && data.plan;
        return Array.isArray(p) ? p.join("\n") : String(p || "");
      };
      const hasBlueCoin = (row) => planText((row && row.data) || {}).includes("B");
      const beatenLevel = (row) =>
        !!(gameState && gameState.beaten && gameState.beaten.includes(String(row.id)));
      // A level's tags as desktop draws them. Before the game is up, the
      // same look from the level's own columns (no BEATEN / BLUE COIN yet)
      function levelTagsNow(row) {
        const api = gameApi();
        if (api && api.levelTags) {
          try {
            return api.levelTags(row);
          } catch (e) {}
        }
        const t = (bg, color, text, extra) =>
          '<span style="background:' + bg + "; color:" + color + "; font-size:0.7rem; padding:2px 10px; font-weight:900; letter-spacing:1px;" +
          (extra || "") + '">' + text + "</span>";
        let tags = "";
        if (row.legendary) tags += t("#1e3a8a", "white", "LEGENDARY", " box-shadow: 0 0 10px #3b82f6;");
        if (row.ultra) tags += t("#e11d48", "#fff", "ULTRA");
        if (row.impossible) tags += t("#e74c3c", "white", "IMPOSSIBLE");
        if (row.featured) tags += t("#3b82f6", "white", "FEATURED");
        if (row.awards) tags += t("linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c)", "black", "LEVEL AWARDS");
        const d = parseInt(row.difficulty, 10);
        const diff = DIFFICULTY_LABELS[d]
          ? 'Difficulty: <span style="color:' + DIFFICULTY_COLORS[d] + '; font-weight:bold;">' + esc(DIFFICULTY_LABELS[d]) +
            '</span> <span style="color:#888; font-size:0.85em;">(' + d + "/10)</span>"
          : "";
        return { tags, diff };
      }
      function paintTags(box, row) {
        if (!box || !row) return;
        const t = levelTagsNow(row);
        const html =
          (t.tags ? '<div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center; text-shadow:none; white-space:normal;">' + t.tags + "</div>" : "") +
          (t.diff ? '<div style="margin-top:' + (t.tags ? 8 : 0) + 'px; font-size:13px; font-weight:bold; color:#ddd; white-space:normal;">' + t.diff + "</div>" : "");
        const api = gameApi();
        const key = (api ? "g" : "l") + html;
        if (box._key === key) return;
        box._key = key;
        box.classList.toggle("empty", !html);
        if (api) gameBits(box, html);
        else box.innerHTML = html;
      }
      function paintStatus(card) {
        paintTags(card.querySelector(".tags"), card._row);
      }
      const paintAllStatus = () => document.querySelectorAll(".card").forEach((c) => c._row && paintStatus(c));

      // ---------------------------------------------------------------------
      // FEEDS
      // A feed is a scroll-snapped column of full-screen cards. `next()`
      // gives the next page of level rows (or [] when there are no more).
      // Cards draw their level only while they are near the screen.
      // ---------------------------------------------------------------------
      const feeds = [];
      function makeFeed(el, next, opts) {
        opts = opts || {};
        const feed = { el, next, done: false, busy: false, seen: new Set(), cards: [], current: null };
        el.innerHTML = "";
        el.scrollTop = 0;
        const tail = document.createElement("div");
        tail.className = "feed-msg loading";
        tail.textContent = "LOADING...";
        el.appendChild(tail);

        const drawer = new IntersectionObserver(
          (entries) => {
            entries.forEach((en) => {
              const card = en.target;
              if (en.isIntersecting) drawCard(card);
              else if (card._drawn) {
                card._drawn = false;
                const cv = card.querySelector("canvas");
                if (cv) cv.width = cv.height = 0;
              }
            });
          },
          { root: el, rootMargin: "150% 0px" },
        );
        const watcher = new IntersectionObserver(
          (entries) => {
            entries.forEach((en) => {
              if (!en.isIntersecting) return;
              const card = en.target;
              if (feed.current === card) return;
              if (feed.current && feed.current._row && feed.shownAt)
                taste.view(feed.current._row, Date.now() - feed.shownAt);
              feed.shownAt = Date.now();
              feed.current = card;
              fillCommentCount(card);
              if (opts.onCurrent) opts.onCurrent(card._row);
              const i = feed.cards.indexOf(card);
              if (i >= feed.cards.length - 3) more();
            });
          },
          { root: el, threshold: 0.6 },
        );
        const tailWatch = new IntersectionObserver(
          (entries) => entries.forEach((en) => en.isIntersecting && more()),
          { root: el, rootMargin: "200% 0px" },
        );
        tailWatch.observe(tail);

        async function more() {
          if (feed.busy || feed.done) return;
          feed.busy = true;
          let rows = [];
          try {
            rows = (await next()) || [];
          } catch (e) {
            console.error(e);
            tail.classList.remove("loading");
            tail.innerHTML = 'COULD NOT LOAD LEVELS<button class="btn">TRY AGAIN</button>';
            tail.querySelector("button").onclick = () => {
              tail.classList.add("loading");
              tail.textContent = "LOADING...";
              more();
            };
            feed.busy = false;
            return;
          }
          rows = rows.filter((r) => r && r.id != null && !feed.seen.has(r.id));
          rows.forEach((r) => {
            feed.seen.add(r.id);
            const card = levelCard(r);
            feed.cards.push(card);
            el.insertBefore(card, tail);
            drawer.observe(card);
            watcher.observe(card);
          });
          feed.busy = false;
          if (!rows.length && feed.lastEmpty) {
            feed.done = true;
            tail.classList.remove("loading");
            tail.textContent = feed.cards.length ? "THAT'S ALL OF THEM" : opts.empty || "NO LEVELS HERE";
          } else {
            feed.lastEmpty = !rows.length;
            if (!rows.length || feed.cards.length < 2) setTimeout(more, 0);
          }
        }
        feed.more = more;
        feed.redraw = () => feed.cards.forEach((c) => c._drawn && ((c._drawn = false), drawCard(c)));
        feed.dispose = () => {
          drawer.disconnect();
