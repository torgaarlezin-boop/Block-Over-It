    <!-- The game's skin list (skinImageFile, plain-colour skins) -->
    <script src="skins.js"></script>
    <style>
      :root {
        --bg: #111;
        --panel: #1a1a1a;
        --panel2: #161616;
        --edge: #333;
        --btn: #444;
        --blue: #335699;
        --text: #fff;
        --dim: #999;
        --faint: #666;
      }
      *, *::before, *::after { box-sizing: border-box; border-radius: 0 !important; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Courier New", Courier, monospace;
        overflow: hidden;
      }
      button, input, textarea { font-family: inherit; color: inherit; }
      .btn {
        background: var(--btn);
        border: 4px solid var(--edge);
        color: #fff;
        font-size: 1rem;
        padding: 10px 20px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
      }
      .btn:hover:not(:disabled) { background: var(--blue); border-color: #eee; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn.small { font-size: 0.8rem; padding: 6px 12px; border-width: 3px; }
      .btn.red { background: #8a2a2a; }
      .btn.red:hover:not(:disabled) { background: #b83a3a; }
      .field {
        width: 100%;
        background: #0d0d0d;
        border: 3px solid var(--edge);
        padding: 10px 12px;
        font-size: 1rem;
        outline: none;
      }
      .field:focus { border-color: var(--blue); }
      .hidden { display: none !important; }

      /* Sign in */
      #signin {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
      }
      .popup {
        width: 100%; max-width: 420px;
        background: linear-gradient(135deg, #1a1a1a 0%, #222 100%);
        border: 3px solid var(--edge);
        padding: 32px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .popup .logo { width: 96px; height: 96px; display: block; margin: 0 auto 14px; }
      .popup h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: 1px; }
      .popup .sub { color: var(--dim); margin: 0 0 22px; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 3px; }
      .popup form { display: flex; flex-direction: column; gap: 12px; }
      .popup .err { color: #ff6b6b; min-height: 1.2em; font-size: 0.9rem; }

      /* App: rail | channels | chat */
      #app { display: flex; height: 100vh; height: 100dvh; }
      #rail {
        width: 72px; flex: none;
        background: #0b0b0b;
        border-right: 4px solid var(--edge);
        display: flex; flex-direction: column; align-items: center;
        padding: 12px 0; gap: 10px;
      }
      .rail-logo { width: 50px; height: 50px; display: block; }
      .rail-logo img { width: 100%; height: 100%; display: block; }
      .rail-sep { width: 32px; height: 4px; background: var(--edge); }
      #sidebar {
        width: 240px; flex: none;
        background: var(--panel2);
        border-right: 4px solid var(--edge);
        display: flex; flex-direction: column;
      }
      .side-head {
        height: 56px; flex: none;
        display: flex; align-items: center;
        padding: 0 16px;
        border-bottom: 4px solid var(--edge);
        font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
      }
      .channels { flex: 1; padding: 14px 8px; display: flex; flex-direction: column; gap: 4px; }
      .channel {
        display: block; width: 100%; text-align: left;
        padding: 8px; background: transparent; border: none; border-left: 4px solid transparent;
        font-size: 1rem; color: var(--dim); cursor: pointer;
      }
      .channel:hover { background: #222; color: #fff; }
      /* The new-message icon, the same one as the game's News button */
      [data-ch] { position: relative; }
      [data-ch].unread::after {
        content: ""; position: absolute; top: 50%; right: 10px; margin-top: -8px;
        width: 12px; height: 12px; background: #3b82f6; border: 2px solid #333;
      }
      .m-tabs [data-ch].unread::after { top: -5px; right: -5px; margin-top: 0; }
      .channel.on { background: #2a2a2a; border-left-color: var(--blue); color: #fff; }
      .me {
        flex: none;
        border-top: 4px solid var(--edge);
        background: #0f0f0f;
        padding: 10px 12px;
        display: flex; align-items: center; gap: 10px;
      }
      .me .who { flex: 1; min-width: 0; }
      .me .name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .me .role { color: var(--dim); font-size: 0.75rem; text-transform: uppercase; }

      #chat { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
      .chat-head {
        height: 56px; flex: none;
        display: flex; align-items: center; gap: 10px;
        padding: 0 16px;
        border-bottom: 4px solid var(--edge);
        font-weight: bold; font-size: 1.1rem;
      }
      .chat-head .spacer { flex: 1; }
      .head-title { display: flex; align-items: center; gap: 6px; }
      .m-tabs { display: none; gap: 6px; }
      .m-tabs button { background: #222; border: 3px solid var(--edge); padding: 4px 8px; font-size: 0.85rem; cursor: pointer; }
      .m-tabs button.on { background: var(--blue); border-color: #eee; }
      #signout-top { display: none; }

      .messages { flex: 1; overflow-y: auto; padding: 16px 0 8px; }
      .day {
        display: flex; align-items: center; gap: 10px;
        margin: 18px 16px 6px;
        color: var(--dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
      }
      .day::before, .day::after { content: ""; flex: 1; height: 3px; background: var(--edge); }
      .msg { position: relative; display: flex; gap: 14px; padding: 4px 16px; }
      .msg:hover { background: #202020; }
      .msg.first { margin-top: 12px; }
      /* The author's skin, standing where a profile picture would be */
      .skin {
        width: 42px; height: 44px; flex: none;
        display: flex; align-items: flex-end; justify-content: center;
      }
      .skin i {
        display: block; width: 22px; height: 44px;
        background-size: contain; background-repeat: no-repeat; background-position: center bottom;
      }
      .skin i.solid { box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.4); }
      .gutter { width: 42px; flex: none; color: transparent; font-size: 0.65rem; text-align: right; padding-top: 4px; }
      .msg:hover .gutter { color: var(--faint); }
      .msg-main { flex: 1; min-width: 0; }
      .msg-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .author { font-weight: bold; }
      .stamp { color: var(--faint); font-size: 0.75rem; }
      .body { white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; margin-top: 2px; }
      .body a { color: #7ea6ef; }
      .atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: flex-start; }
      .atts img {
        max-width: min(400px, 100%); max-height: 320px;
        border: 4px solid var(--edge); background: #0d0d0d;
        cursor: zoom-in; display: block;
      }
      .att-frame { position: relative; border: 4px solid var(--edge); background: #0d0d0d; max-width: 100%; }
      .att-frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #111; }
      .att-emote { width: 240px; height: 344px; }
      .att-env { width: 480px; height: 270px; }
      .att-env:hover { border-color: #eee; }
      /* Walking around in it: the whole window */
      .att-env.playing { position: fixed; inset: 0; width: auto; height: auto; max-width: none; z-index: 50; border: 0; }
      .att-exit { display: none; position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 2; }
      .att-env.playing .att-exit { display: block; }
      /* A linked level: its picture and a bar under it */
      .att-level { width: 480px; max-width: 100%; }
      .att-level .att-pic { width: 100%; height: 270px; }
      .lvl-info {
        display: flex; align-items: center; gap: 10px;
        background: #141414; border: 4px solid var(--edge); border-top: 0; padding: 8px 10px;
      }
      .lvl-text { flex: 1; min-width: 0; }
      .lvl-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lvl-sub { color: var(--dim); font-size: 0.8rem; }
      .lvl-info .btn { text-decoration: none; white-space: nowrap; }
      .msg-actions { position: absolute; right: 16px; top: -10px; display: none; z-index: 1; }
      .msg:hover .msg-actions { display: block; }
      .empty { color: var(--dim); padding: 8px 16px; }

      /* Polls */
      .poll { margin-top: 6px; max-width: 520px; background: #141414; border: 4px solid var(--edge); padding: 14px; }
      .poll-q { font-weight: bold; font-size: 1.05rem; margin-bottom: 10px; white-space: pre-wrap; word-wrap: break-word; }
      .poll-opt {
        position: relative; display: block; width: 100%; text-align: left;
        background: #262626; border: 3px solid var(--edge); padding: 9px 12px; margin-top: 6px;
        font-size: 0.95rem; cursor: pointer; overflow: hidden;
      }
      .poll-opt:hover:not(:disabled) { background: var(--blue); border-color: #eee; }
      .poll-opt:disabled { cursor: default; }
      .poll-opt .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #2c4a82; }
      .poll-opt.mine { border-color: #eee; }
      .poll-opt .row { position: relative; display: flex; gap: 10px; }
      .poll-opt .label { flex: 1; min-width: 0; word-wrap: break-word; }
      .poll-opt .pct { color: #ddd; white-space: nowrap; }
      .poll-foot { color: var(--faint); font-size: 0.75rem; margin-top: 10px; text-transform: uppercase; }
      .poll-end { margin-top: 10px; }

      /* Composer (admins) */
      .composer { flex: none; padding: 0 16px 16px; }
      .compose-box { background: #262626; border: 4px solid var(--edge); }
      .compose-box:focus-within { border-color: var(--blue); }
      .attach-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 10px 0; }
      .attach-row:empty { display: none; }
      .chip { position: relative; width: 84px; height: 84px; border: 3px solid var(--edge); background: #0d0d0d; }
      .chip img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .chip .label {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; font-size: 0.65rem; padding: 4px; text-transform: uppercase; word-break: break-word;
      }
      .chip .label b { font-size: 0.55rem; color: rgba(255, 255, 255, 0.7); margin-bottom: 3px; }
      .chip button {
        position: absolute; top: -3px; right: -3px; width: 22px; height: 22px; padding: 0;
        background: #8a2a2a; border: 3px solid #333; cursor: pointer; font-size: 0.8rem; line-height: 1; z-index: 1;
      }
      .chip .busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); font-size: 0.7rem; }
      .compose-row { display: flex; align-items: flex-end; gap: 6px; padding: 8px; flex-wrap: wrap; }
      .compose-tools { display: flex; gap: 6px; flex-wrap: wrap; }
      #compose-text {
        flex: 1; min-width: 160px; resize: none; background: transparent; border: none; outline: none;
        font-size: 1rem; line-height: 1.4; max-height: 220px; padding: 6px 4px; min-height: 34px;
      }
      .compose-note { color: var(--faint); font-size: 0.75rem; padding: 6px 2px 0; min-height: 1em; }
      .compose-note.err { color: #ff6b6b; }
      .poll-form { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
      .poll-form .opt-line { display: flex; gap: 6px; }
      .poll-form .opt-line .field { padding: 7px 10px; font-size: 0.95rem; }
      .poll-form .opt-line button { flex: none; }
      .poll-form .actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }

      /* Pickers + picture viewer */
      .overlay {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
        display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
      }
      .picker {
        width: 100%; max-width: 760px; max-height: calc(100dvh - 32px);
        background: var(--panel); border: 3px solid var(--edge);
        display: flex; flex-direction: column;
      }
      .picker-head { display: flex; gap: 8px; padding: 14px; border-bottom: 4px solid var(--edge); align-items: center; }
      .picker-head h3 { margin: 0 8px 0 0; text-transform: uppercase; font-size: 1rem; white-space: nowrap; }
      .picker-grid {
        flex: 1; overflow-y: auto; padding: 14px;
        display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px;
      }
      .pick {
        background: #0d0d0d; border: 3px solid var(--edge); cursor: pointer; padding: 6px;
        display: flex; flex-direction: column; gap: 4px; text-align: left;
      }
      .pick:hover { border-color: #eee; }
      .pick img { width: 100%; height: 80px; object-fit: contain; }
      .pick span { font-size: 0.65rem; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pick.named { min-height: 64px; justify-content: center; font-size: 0.8rem; text-transform: uppercase; color: #fff; border-left-width: 10px; }
      .picker-msg { color: var(--dim); padding: 14px; grid-column: 1 / -1; }
      .viewer img { max-width: 100%; max-height: calc(100dvh - 32px); border: 4px solid var(--edge); background: #0d0d0d; }
      #dialog { z-index: 100; }
      .dialog-box { width: 100%; max-width: 420px; background: var(--panel); border: 3px solid var(--edge); padding: 20px; }
      .dialog-text { margin: 0 0 18px; white-space: pre-wrap; word-wrap: break-word; }
      .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

      @media (max-width: 760px) {
        #rail, #sidebar { display: none; }
        #signout-top { display: inline-block; }
        .head-title { display: none; }
        .m-tabs { display: flex; }
        .msg { gap: 10px; padding: 4px 12px; }
        .gutter, .skin { width: 34px; }
        .composer { padding: 0 10px 10px; }
        .picker-head { flex-wrap: wrap; }
        .att-env, .att-level .att-pic { width: 100%; height: auto; aspect-ratio: 16 / 9; }
      }
    </style>
  </head>
  <body>
    <div id="signin" class="hidden">
      <div class="popup">
        <img class="logo boi-logo" src="" alt="Block Over It" />
        <h1>BLOCK OVER IT</h1>
        <p class="sub">News</p>
        <form id="signin-form" autocomplete="on">
          <input class="field" id="si-user" name="username" placeholder="Username" autocomplete="username" required />
          <input class="field" id="si-pass" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
          <div class="err" id="si-err"></div>
          <button class="btn" id="si-btn" type="submit">Sign In</button>
        </form>
      </div>
    </div>

    <div id="app" class="hidden">
      <nav id="rail">
        <a class="rail-logo" href="./" target="_blank" rel="noopener" title="Play Block Over It"><img class="boi-logo" src="" alt="Block Over It" /></a>
        <div class="rail-sep"></div>
      </nav>
      <aside id="sidebar">
        <div class="side-head">Block Over It</div>
        <div class="channels">
          <button class="channel on" data-ch="news">News</button>
          <button class="channel" data-ch="polls">Polls</button>
        </div>
        <div class="me">
          <div class="skin" id="me-skin"></div>
          <div class="who">
            <div class="name" id="me-name"></div>
            <div class="role" id="me-role"></div>
          </div>
          <button class="btn small" id="signout">Sign Out</button>
        </div>
      </aside>
      <main id="chat">
        <div class="chat-head">
          <span class="head-title" id="head-name">News</span>
          <span class="m-tabs">
            <button data-ch="news" class="on">News</button>
            <button data-ch="polls">Polls</button>
          </span>
          <span class="spacer"></span>
          <button class="btn small" id="signout-top">Sign Out</button>
        </div>

        <div class="messages" id="news-list"></div>
        <div class="messages hidden" id="polls-list"></div>

        <div class="composer hidden" id="news-composer">
          <div class="compose-box">
            <div class="attach-row" id="attach-row"></div>
            <div class="compose-row">
              <span class="compose-tools">
                <button class="btn small" id="upload-btn" title="Upload a picture">Upload</button>
                <button class="btn small" id="repo-btn" title="A picture from the GitHub repo">Repo</button>
                <button class="btn small" id="emote-btn" title="Add an emote">Emote</button>
                <button class="btn small" id="env-btn" title="Add an environment">Environment</button>
                <button class="btn small" id="level-btn" title="Link a level">Level</button>
              </span>
              <textarea id="compose-text" rows="1" maxlength="4000" placeholder="Message"></textarea>
              <button class="btn small" id="send-btn">Post</button>
            </div>
          </div>
          <div class="compose-note" id="compose-note"></div>
          <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
        </div>

        <div class="composer hidden" id="poll-composer">
          <div class="compose-box">
            <div class="poll-form">
              <input class="field" id="poll-question" maxlength="300" placeholder="Ask a question" />
              <div id="poll-options"></div>
              <div class="actions">
                <button class="btn small" id="poll-add">Add Option</button>
                <button class="btn small" id="poll-send">Post Poll</button>
              </div>
            </div>
          </div>
          <div class="compose-note" id="poll-note"></div>
        </div>
      </main>
    </div>

    <div class="overlay hidden" id="picker-overlay">
      <div class="picker">
        <div class="picker-head">
          <h3 id="picker-title">Repo pictures</h3>
          <input class="field" id="picker-search" placeholder="Search" />
          <button class="btn small" id="picker-close">Close</button>
        </div>
        <div class="picker-grid" id="picker-grid"></div>
      </div>
    </div>
    <div class="overlay viewer hidden" id="viewer"><img id="viewer-img" alt="" /></div>
    <div class="overlay hidden" id="dialog">
      <div class="dialog-box" role="dialog" aria-modal="true">
        <p class="dialog-text" id="dialog-text"></p>
        <div class="dialog-actions">
          <button class="btn small" id="dialog-cancel">Cancel</button>
          <button class="btn small" id="dialog-ok">OK</button>
        </div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://heqmnluegbbglmhtublu.supabase.co";
      const SUPABASE_KEY = "sb_publishable_tOOikmqOrVhpJAjLuyeqaA_nzF6CkOA";
      const REPO = "torgaarlezin-boop/Block-Over-It";
      const RAW = "https://raw.githubusercontent.com/" + REPO + "/main/";
      // On the live site the game's files are next to this page; anywhere
      // else (a local copy) skin pictures come from the repo
      const ON_SITE = /github\.io$/i.test(location.hostname);
      const TOKEN_KEY = "boi-news-session";
      const MAX_ATTACH = 6;
      const PLAY_PAGE = "news-play.html";
      // The game's level page ("go to the level browser version")
      const LIVE_GAME = "https://torgaarlezin-boop.github.io/Block-Over-It/";
      // Messages to the game frames: a page opened from a folder has no origin
      // to name (its location.origin says "file://", which matches nothing)
      const FRAME_TARGET = /^https?:$/.test(location.protocol) ? location.origin : "*";
      // The game's difficulty names and colours (DIFFICULTY_LABELS / _COLORS there)
      const DIFFICULTY_LABELS_NEWS = { 1: "No Skill", 2: "Very Easy", 3: "Easy", 4: "Medium", 5: "Hard",
        6: "Very Hard", 7: "Ultra Hard", 8: "Nightmare", 9: "Extreme", 10: "Insane" };
      const DIFFICULTY_COLORS_NEWS = { 1: "#2ecc71", 2: "#27ae60", 3: "#f1c40f", 4: "#f39c12", 5: "#e67e22",
        6: "#d35400", 7: "#e74c3c", 8: "#c0392b", 9: "#8e44ad", 10: "#ffffff" };
      // Linked levels: id -> {id, name, creator, difficulty}
      const levelMeta = {};
      async function loadLevelMeta(ids) {
        const need = [...new Set(ids.map(String))].filter((id) => /^\d+$/.test(id) && !(id in levelMeta));
        if (!need.length || !db) return;
        const { data } = await db.from("published_levels_latest").select("id, name, creator, difficulty").in("id", need);
        (data || []).forEach((r) => (levelMeta[String(r.id)] = r));
      }

      const $ = (id) => document.getElementById(id);
      // The logo is written once, in the tab icon
      document.querySelectorAll("img.boi-logo").forEach((im) => (im.src = $("logo-src").href));
      const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
        del(k) { try { localStorage.removeItem(k); } catch (e) {} },
      };

      let token = store.get(TOKEN_KEY) || "";
      let me = null; // {user, admin, skin}
      let channel = "news";
      let posts = [];
      let polls = [];
      let pollResults = {};
      const skins = {}; // username -> equipped skin
      const imageCache = new Map(); // upload id -> data url
      let attachments = []; // {ref, src?, label?, busy}

      function sessionFetch(input, init) {
        if (!token) return fetch(input, init);
        const opts = Object.assign({}, init);
        const headers = new Headers((init && init.headers) || {});
        headers.set("x-boi-session", token);
        opts.headers = headers;
        return fetch(input, opts);
      }
      const db = window.supabase
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
            global: { headers: { "x-boi-client": "news" }, fetch: sessionFetch },
          })
        : null;

      function show(screen) {
        $("signin").classList.toggle("hidden", screen !== "signin");
        $("app").classList.toggle("hidden", screen !== "app");
      }

      // ---------- skins ----------
      function skinFile(id) {
        const f = window.skinImageFile ? window.skinImageFile(id) : id + ".png";
        return ON_SITE || /^(https?:|data:)/.test(f) ? f : RAW + f;
      }
      function skinHTML(name) {
        const id = skins[name] || "default";
        const solid = (window.SOLID_SKIN_COLORS || {})[id];
        if (solid) return '<div class="skin"><i class="solid" style="background-color:' + esc(solid) + '"></i></div>';
        if (!/^[A-Za-z0-9_-]+$/.test(id)) return '<div class="skin"></div>';
        return '<div class="skin"><i style="background-image:url(&quot;' + esc(skinFile(id)) + '&quot;)"></i></div>';
      }
      async function loadSkins(names) {
        const need = [...new Set(names)].filter((n) => n && !(n in skins));
        if (!need.length || !db) return;
        const { data } = await db.rpc("boi_news_skins", { p_names: need });
        need.forEach((n) => { skins[n] = (data && data[n]) || "default"; });
      }

      // ---------- sign in ----------
      $("signin-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = $("si-err");
        err.textContent = "";
        if (!db) { err.textContent = "Not connected. Try reloading."; return; }
        const username = $("si-user").value.trim();
        const password = $("si-pass").value;
        if (!username || !password) return;
        $("si-btn").disabled = true;
        try {
          const { data, error } = await db.rpc("boi_sign_in", { p_username: username, p_password: password });
          if (error) throw error;
          if (!data || !data.ok) {
            const why = data && data.reason;
            err.textContent =
              why === "nouser" ? "No account with that name." :
              why === "password" ? "Wrong password." :
              why === "throttled" ? "Too many tries. Wait 15 minutes." :
              why === "reset" ? "Set a new password in the game first." :
              "Could not sign in.";
            return;
          }
          token = data.token;
          store.set(TOKEN_KEY, token);
          $("si-pass").value = "";
          await enter();
        } catch (ex) {
          err.textContent = "Could not reach the server.";
        } finally {
          $("si-btn").disabled = false;
        }
      });

      async function signOut() {
        if (db && token) { try { await db.rpc("boi_sign_out"); } catch (e) {} }
        token = "";
        me = null;
        store.del(TOKEN_KEY);
        attachments = [];
        renderAttachments();
        resetNewsList();
        updateUnread();
        show("signin");
      }
      $("signout").onclick = signOut;
      $("signout-top").onclick = signOut;

      async function whoAmI() {
        if (!db || !token) return null;
        const { data, error } = await db.rpc("boi_news_me");
        if (error) throw error;
        return data && data.user ? data : null;
      }

      async function enter() {
        let who = null;
        try { who = await whoAmI(); }
        catch (e) {
          if (!me) {
            show("signin");
            $("si-err").textContent = "Could not reach the server. Try reloading.";
            return;
          }
          who = me;
        }
        if (!who) {
          if (token) { token = ""; store.del(TOKEN_KEY); }
          show("signin");
          return;
        }
        me = who;
        try { await loadSkins([me.user]); } catch (e) {}
        me.skin = skins[me.user] || "default";
        $("me-name").textContent = me.user;
        $("me-role").textContent = me.admin ? "Admin" : "Player";
        $("me-skin").outerHTML = skinHTML(me.user).replace('class="skin"', 'class="skin" id="me-skin"');
        show("app");
        setChannel(channel);
        await Promise.all([loadPosts(true), loadPolls(true)]);
      }

      // ---------- new messages ----------
      // The newest post and poll this browser has read. The game reads the
      // same key to light up its News button.
      const SEEN_KEY = "boi-news-seen";
      const PAGE_TITLE = document.title;
      function readSeen() {
        try { return JSON.parse(store.get(SEEN_KEY)) || {}; } catch (e) { return {}; }
      }
      const channelItems = (ch) => (ch === "news" ? posts : polls);
      function markRead(ch) {
        const seen = readSeen();
        const newest = channelItems(ch).reduce((a, x) => Math.max(a, x.id), 0);
        if (newest > (seen[ch] || 0)) {
          seen[ch] = newest;
          store.set(SEEN_KEY, JSON.stringify(seen));
        }
      }
      function updateUnread() {
        // What is on the screen counts as read
        if (me && !document.hidden) markRead(channel);
        const seen = readSeen();
        const count = (ch) => (me ? channelItems(ch).filter((x) => x.id > (seen[ch] || 0)).length : 0);
        document.querySelectorAll("[data-ch]").forEach((b) => b.classList.toggle("unread", count(b.dataset.ch) > 0));
        const total = count("news") + count("polls");
        document.title = total ? "(" + total + ") " + PAGE_TITLE : PAGE_TITLE;
      }
      document.addEventListener("visibilitychange", updateUnread);
      window.addEventListener("storage", (e) => { if (e.key === SEEN_KEY) updateUnread(); });

      // ---------- channels ----------
      function setChannel(ch) {
        channel = ch;
        document.querySelectorAll("[data-ch]").forEach((b) => b.classList.toggle("on", b.dataset.ch === ch));
        $("head-name").textContent = ch === "news" ? "News" : "Polls";
        $("news-list").classList.toggle("hidden", ch !== "news");
        $("polls-list").classList.toggle("hidden", ch !== "polls");
        const admin = !!(me && me.admin);
        $("news-composer").classList.toggle("hidden", !(admin && ch === "news"));
        $("poll-composer").classList.toggle("hidden", !(admin && ch === "polls"));
        const list = $(ch + "-list");
        list.scrollTop = list.scrollHeight;
        updateUnread();
      }
      document.querySelectorAll("[data-ch]").forEach((b) => (b.onclick = () => setChannel(b.dataset.ch)));

      // ---------- helpers ----------
      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }
      function formatBody(text) {
        let h = esc(text);
        h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
        h = h.replace(/(https?:\/\/[^\s<]+[^\s<.,!?)])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
        return h;
      }
      const NAME_COLORS = ["#7ea6ef", "#6fcf8f", "#b58ae0", "#e89a5c", "#e07a9a", "#5fc8c8", "#d8c45a"];
      function nameColor(name) {
        let h = 0;
        for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
        return NAME_COLORS[h % NAME_COLORS.length];
      }
      function dayLabel(d) {
        const today = new Date();
        const y = new Date(); y.setDate(today.getDate() - 1);
        const same = (a, b) => a.toDateString() === b.toDateString();
        if (same(d, today)) return "Today";
        if (same(d, y)) return "Yesterday";
        return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      }
      const timeOf = (d) => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      const fullStamp = (d) =>
        d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " " + timeOf(d);
      function el(html) {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstChild;
      }
      function errorText(error) {
        const m = (error && error.message) || "";
        if (/sign in again/i.test(m)) return "Your sign-in ran out. Sign in again.";
        if (/admins only/i.test(m)) return "Only admins can do that.";
        return "Something went wrong. Try again.";
      }
      function handleSessionError(error) {
        if (/sign in again/i.test((error && error.message) || "")) signOut();
      }

      // The site's own popups. Both give back a promise: askUser's is true
      // only if the person pressed the action button.
      let closeDialog = null;
      function openDialog(message, okLabel, cancelable, danger) {
        if (closeDialog) closeDialog(false);
        return new Promise((resolve) => {
          const before = document.activeElement;
          $("dialog-text").textContent = message;
          $("dialog-ok").textContent = okLabel;
          $("dialog-ok").classList.toggle("red", !!danger);
          $("dialog-cancel").classList.toggle("hidden", !cancelable);
          $("dialog").classList.remove("hidden");
          $("dialog-ok").focus();
          closeDialog = (answer) => {
            closeDialog = null;
            $("dialog").classList.add("hidden");
            if (before && before.focus) before.focus();
            resolve(answer);
          };
        });
      }
      const askUser = (message, okLabel, danger) => openDialog(message, okLabel, true, danger);
      const tellUser = (message) => openDialog(message, "OK", false, false);
      $("dialog-ok").onclick = () => closeDialog && closeDialog(true);
      $("dialog-cancel").onclick = () => closeDialog && closeDialog(false);
      $("dialog").onclick = (e) => { if (e.target === $("dialog") && closeDialog) closeDialog(false); };

      // A chat list: day lines, and a header (skin, name, date) unless the
      // same person posted a moment ago
      function listWriter(box) {
        let lastDay = "", lastAuthor = "", lastTime = 0;
        return function add(item, contentHTML, deleteAttr) {
          const d = new Date(item.created_at);
          if (d.toDateString() !== lastDay) {
            box.appendChild(el('<div class="day">' + esc(dayLabel(d)) + "</div>"));
            lastDay = d.toDateString();
            lastAuthor = "";
          }
          const grouped = item.author === lastAuthor && d - lastTime < 7 * 60 * 1000;
          lastAuthor = item.author;
          lastTime = d;
          let html = '<div class="msg' + (grouped ? "" : " first") + '" data-id="' + item.id + '">';
          html += grouped
            ? '<div class="gutter" title="' + esc(fullStamp(d)) + '">' + esc(timeOf(d)) + "</div>"
            : skinHTML(item.author);
          html += '<div class="msg-main">';
          if (!grouped)
            html += '<div class="msg-top"><span class="author" style="color:' + nameColor(item.author) + '">' +
              esc(item.author) + '</span><span class="stamp" title="' + esc(d.toLocaleString()) + '">' +
              esc(fullStamp(d)) + "</span></div>";
          html += contentHTML + "</div>";
          if (me && me.admin)
            html += '<div class="msg-actions"><button class="btn small red" ' + deleteAttr + '="' + item.id + '">Delete</button></div>';
          html += "</div>";
          const node = el(html);
          box.appendChild(node);
          return node;
        };
      }

      // ---------- #news ----------
      let shownPosts = []; // ids already on the page, in order
      let newsWriter = null;
      function resetNewsList() {
        shownPosts = [];
        newsWriter = null;
        $("news-list").innerHTML = "";
      }

      async function loadPosts(scrollDown) {
        if (!db) return;
        const box = $("news-list");
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        const { data, error } = await db
          .from("news_posts")
          .select("id, created_at, author, body, images")
          .order("created_at", { ascending: true })
          .limit(1000);
        if (error) {
          if (!posts.length) box.innerHTML = '<div class="empty">Could not load the news. Try reloading.</div>';
          return;
        }
        posts = data || [];
        const need = [];
        posts.forEach((p) => (p.images || []).forEach((r) => {
          if (typeof r === "string" && r.startsWith("upload:") && !imageCache.has(r.slice(7))) need.push(r.slice(7));
        }));
        for (let i = 0; i < need.length; i += 20) {
          const { data: imgs } = await db.from("news_images").select("id, data").in("id", need.slice(i, i + 20));
          (imgs || []).forEach((im) => imageCache.set(im.id, im.data));
        }
        try { await loadSkins(posts.map((p) => p.author)); } catch (e) {}
        try {
          await loadLevelMeta(posts.flatMap((p) => (p.images || []).filter((r) => typeof r === "string" && r.startsWith("level:")).map((r) => r.slice(6))));
        } catch (e) {}
        renderNews();
        updateUnread();
        if (scrollDown || nearBottom) stickToBottom(box);
      }

      function stickToBottom(box) {
        box.scrollTop = box.scrollHeight;
        box.querySelectorAll(".atts img").forEach((im) => {
          if (!im.complete) im.addEventListener("load", () => {
            if (box.scrollHeight - box.scrollTop - box.clientHeight < im.offsetHeight + 120) box.scrollTop = box.scrollHeight;
          }, { once: true });
        });
      }

      function attachmentHTML(ref, author) {
        if (typeof ref !== "string") return "";
        if (ref.startsWith("emote:")) {
          const q = "mode=emote&id=" + encodeURIComponent(ref.slice(6)) + "&skin=" + encodeURIComponent(skins[author] || "default");
          return '<div class="att-frame att-emote"><iframe loading="lazy" title="Emote" src="' + PLAY_PAGE + "?" + esc(q) + '"></iframe></div>';
        }
        if (ref.startsWith("environment:")) {
          const q = "mode=env&id=" + encodeURIComponent(ref.slice(12)) + "&skin=" + encodeURIComponent((me && me.skin) || "default");
          return '<div class="att-frame att-env"><button class="btn small att-exit">Exit</button>' +
            '<iframe loading="lazy" title="Environment" allow="fullscreen" src="' + PLAY_PAGE + "?" + esc(q) + '"></iframe></div>';
        }
        if (ref.startsWith("level:")) {
          const id = ref.slice(6);
          const lv = levelMeta[id];
          const q = "mode=level&id=" + encodeURIComponent(id) + "&skin=" + encodeURIComponent((me && me.skin) || "default");
          const diff = lv && DIFFICULTY_LABELS_NEWS[lv.difficulty];
          return '<div class="att-level">' +
            '<div class="att-frame att-pic"><iframe loading="lazy" title="Level picture" src="' + PLAY_PAGE + "?" + esc(q) + '"></iframe></div>' +
            '<div class="lvl-info"><div class="lvl-text"><div class="lvl-name">' + esc(lv ? lv.name : "Level " + id) + "</div>" +
            '<div class="lvl-sub">' + (lv ? "by " + esc(lv.creator || "?") : "") +
            (diff ? ' · <span style="color:' + esc(DIFFICULTY_COLORS_NEWS[lv.difficulty]) + '">' + esc(diff) + "</span>" : "") +
            "</div></div>" +
            '<a class="btn small" target="_blank" rel="noopener" href="' + esc(LIVE_GAME + "?level=" + encodeURIComponent(id)) + '">Open in game</a>' +
            "</div></div>";
        }
        const src = imageSrc(ref);
        return src ? '<img loading="lazy" alt="" src="' + esc(src) + '" />' : "";
      }
      function imageSrc(ref) {
        if (ref.startsWith("upload:")) return imageCache.get(ref.slice(7)) || "";
        if (ref.startsWith("repo:")) return RAW + ref.slice(5).split("/").map(encodeURIComponent).join("/");
        return "";
      }

      // New posts are added under the ones already showing, so emotes and
      // environments already on the page keep running; anything else
      // (a post taken down) redraws the list
      function renderNews() {
        const box = $("news-list");
        const ids = posts.map((p) => p.id);
        const extends_ = newsWriter && shownPosts.every((id, i) => ids[i] === id);
        if (!extends_) {
          box.innerHTML = "";
          if (!posts.length) box.appendChild(el('<div class="empty">No news yet.</div>'));
          newsWriter = listWriter(box);
          shownPosts = [];
        } else if (shownPosts.length === 0 && posts.length) {
          const e = box.querySelector(".empty");
          if (e) e.remove();
        }
        posts.slice(shownPosts.length).forEach((p) => {
          const atts = (p.images || []).map((r) => attachmentHTML(r, p.author)).join("");
          newsWriter(
            p,
            (p.body ? '<div class="body">' + formatBody(p.body) + "</div>" : "") +
              (atts ? '<div class="atts">' + atts + "</div>" : ""),
            "data-del",
          );
          shownPosts.push(p.id);
        });
      }

      $("news-list").addEventListener("click", async (e) => {
        const img = e.target.closest(".atts img");
        if (img) {
          $("viewer-img").src = img.src;
          $("viewer").classList.remove("hidden");
          return;
        }
        const exit = e.target.closest(".att-exit");
        if (exit) {
          const f = exit.parentElement.querySelector("iframe");
          f.contentWindow.postMessage({ boiNews: "exit" }, FRAME_TARGET);
          return;
        }
        const del = e.target.closest("[data-del]");
        if (del) {
          if (!(await askUser("Delete this post?", "Delete", true))) return;
          del.disabled = true;
          const { error } = await db.rpc("boi_news_delete", { p_id: Number(del.dataset.del) });
          if (error) { await tellUser(errorText(error)); handleSessionError(error); del.disabled = false; return; }
          await loadPosts(false);
        }
      });
      $("viewer").onclick = () => $("viewer").classList.add("hidden");

      // The game pages inside posts talk back here
      // (only from our own frames; a page opened from a folder has no origin)
      window.addEventListener("message", (e) => {
        if (!e.data || !e.data.boiNews) return;
        const frame = [...document.querySelectorAll("iframe")].find((f) => f.contentWindow === e.source);
        if (!frame) return;
        if (e.data.boiNews === "list") { gotGameList(e.data); return; }
        const box = frame.parentElement;
        if (e.data.boiNews === "enter-request" && box.classList.contains("att-env")) {
          box.classList.add("playing");
          frame.contentWindow.postMessage({ boiNews: "enter", skin: (me && me.skin) || "default" }, FRAME_TARGET);
          frame.focus();
        } else if (e.data.boiNews === "exited") {
          box.classList.remove("playing");
        }
      });

      // ---------- #polls ----------
      async function loadPolls(scrollDown) {
        if (!db) return;
        const box = $("polls-list");
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        const [{ data, error }, res] = await Promise.all([
          db.from("news_polls").select("id, created_at, author, question, options, ended_at").order("created_at", { ascending: true }).limit(500),
          db.rpc("boi_news_poll_results"),
        ]);
        if (error) {
          if (!polls.length) box.innerHTML = '<div class="empty">Could not load the polls. Try reloading.</div>';
          return;
        }
        polls = data || [];
        pollResults = (res && res.data) || {};
        try { await loadSkins(polls.map((p) => p.author)); } catch (e) {}
        renderPolls();
        updateUnread();
        if (scrollDown || nearBottom) box.scrollTop = box.scrollHeight;
      }

      function pollHTML(p) {
        const r = pollResults[p.id] || { counts: [], mine: null };
        // The server only sends counts once a poll has ended, or to admins
        const showCounts = Array.isArray(r.counts);
        const counts = r.counts || [];
        const total = counts.reduce((a, b) => a + b, 0);
        const voted = r.mine !== null && r.mine !== undefined;
        const ended = !!p.ended_at;
        const locked = voted || ended;
        let h = '<div class="poll"><div class="poll-q">' + esc(p.question) + "</div>";
        (p.options || []).forEach((opt, i) => {
          const n = counts[i] || 0;
          const pct = total ? Math.round((n / total) * 100) : 0;
          h += '<button class="poll-opt' + (voted && r.mine === i ? " mine" : "") + '"' +
            (locked ? " disabled" : ' data-vote="' + p.id + ":" + i + '"') + ">" +
            (showCounts ? '<span class="fill" style="width:' + pct + '%"></span>' : "") +
            '<span class="row"><span class="label">' + esc(opt) + (voted && r.mine === i ? " (your vote)" : "") + "</span>" +
            (showCounts ? '<span class="pct">' + pct + "% · " + n + "</span>" : "") + "</span></button>";
        });
        const foot = [];
        if (ended) foot.push("Poll ended");
        if (showCounts) foot.push(total + (total === 1 ? " vote" : " votes"));
        if (!ended) foot.push(voted ? "You voted" : "You can only vote once");
        if (!ended && !showCounts) foot.push("Results show when the poll ends");
        h += '<div class="poll-foot">' + foot.join(" · ") + "</div>";
        if (!ended && me && me.admin) h += '<button class="btn small poll-end" data-endpoll="' + p.id + '">End Poll</button>';
        return h + "</div>";
      }

      function renderPolls() {
        const box = $("polls-list");
        box.innerHTML = "";
        if (!polls.length) box.appendChild(el('<div class="empty">No polls yet.</div>'));
        const add = listWriter(box);
        polls.forEach((p) => add(p, pollHTML(p), "data-delpoll"));
      }

      $("polls-list").addEventListener("click", async (e) => {
        const vote = e.target.closest("[data-vote]");
        if (vote) {
          const [poll, choice] = vote.dataset.vote.split(":").map(Number);
          const opt = vote.querySelector(".label").textContent;
          if (!(await askUser('Vote "' + opt + '"? You can only vote once.', "Vote"))) return;
          vote.closest(".poll").querySelectorAll("button").forEach((b) => (b.disabled = true));
          const { data, error } = await db.rpc("boi_news_vote", { p_poll: poll, p_choice: choice });
          if (error) { await tellUser(errorText(error)); handleSessionError(error); }
          else if (data && !data.ok && data.reason === "voted") await tellUser("You already voted in this poll.");
          else if (data && !data.ok && data.reason === "ended") await tellUser("This poll has ended.");
          await loadPolls(false);
          return;
        }
        const end = e.target.closest("[data-endpoll]");
        if (end) {
          if (!(await askUser("End this poll? Everyone will see the results and no one can vote any more.", "End Poll", true))) return;
          end.disabled = true;
          const { error } = await db.rpc("boi_news_end_poll", { p_id: Number(end.dataset.endpoll) });
          if (error) { await tellUser(errorText(error)); handleSessionError(error); end.disabled = false; return; }
          await loadPolls(false);
          return;
        }
        const del = e.target.closest("[data-delpoll]");
        if (del) {
          if (!(await askUser("Delete this poll?", "Delete", true))) return;
          del.disabled = true;
          const { error } = await db.rpc("boi_news_delete_poll", { p_id: Number(del.dataset.delpoll) });
          if (error) { await tellUser(errorText(error)); handleSessionError(error); del.disabled = false; return; }
          await loadPolls(false);
        }
      });

      // New poll (admins)
      function addOptionLine(value) {
        const box = $("poll-options");
        if (box.children.length >= 10) return;
        const line = el('<div class="opt-line"><input class="field" maxlength="120" /><button class="btn small red" title="Remove">X</button></div>');
        line.querySelector("input").value = value || "";
        line.querySelector("input").placeholder = "Option " + (box.children.length + 1);
        line.querySelector("button").onclick = () => {
          if (box.children.length > 2) line.remove();
        };
        box.appendChild(line);
      }
      function resetPollForm() {
        $("poll-question").value = "";
        $("poll-options").innerHTML = "";
        addOptionLine();
        addOptionLine();
      }
      resetPollForm();
      $("poll-add").onclick = () => addOptionLine();
      $("poll-send").onclick = async () => {
        const question = $("poll-question").value.trim();
        const options = [...$("poll-options").querySelectorAll("input")].map((i) => i.value.trim()).filter(Boolean);
        const note = $("poll-note");
        note.classList.add("err");
        if (!question) { note.textContent = "Write a question."; return; }
        if (options.length < 2) { note.textContent = "Give it at least two options."; return; }
        $("poll-send").disabled = true;
        try {
          const { data, error } = await db.rpc("boi_news_new_poll", { p_question: question, p_options: options });
          if (error) { handleSessionError(error); note.textContent = errorText(error); return; }
          if (!data || !data.ok) { note.textContent = "Could not post that poll."; return; }
          note.textContent = "";
          note.classList.remove("err");
          resetPollForm();
          await loadPolls(true);
        } finally {
          $("poll-send").disabled = false;
        }
      };

      // ---------- #news composer ----------
      const HINT = "Enter posts, Shift+Enter for a new line. You can paste pictures too.";
      const text = $("compose-text");
      function grow() {
        text.style.height = "auto";
        text.style.height = Math.min(text.scrollHeight, 220) + "px";
      }
      text.addEventListener("input", grow);
      text.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          send();
        }
      });
      text.addEventListener("paste", (e) => {
        const files = [...(e.clipboardData && e.clipboardData.files || [])].filter((f) => f.type.startsWith("image/"));
        if (files.length) { e.preventDefault(); files.forEach(addUpload); }
      });
      $("send-btn").onclick = send;
      $("upload-btn").onclick = () => $("file-input").click();
      $("file-input").onchange = (e) => {
        [...e.target.files].forEach(addUpload);
        e.target.value = "";
      };

      function note(msg, isErr) {
        const n = $("compose-note");
        n.textContent = msg || HINT;
        n.classList.toggle("err", !!isErr);
      }
      note();

      function renderAttachments() {
        const row = $("attach-row");
        row.innerHTML = "";
        attachments.forEach((a, i) => {
          const chip = document.createElement("div");
          chip.className = "chip";
          if (a.src) chip.innerHTML = '<img alt="" />';
          else chip.innerHTML = '<div class="label"><b></b><span></span></div>';
          chip.innerHTML += '<button title="Remove">X</button>' + (a.busy ? '<div class="busy">UPLOADING</div>' : "");
          if (a.src) chip.querySelector("img").src = a.src;
          else {
            chip.querySelector("b").textContent = a.kind;
            chip.querySelector("span").textContent = a.label;
            if (a.color) chip.style.background = a.color;
          }
          chip.querySelector("button").onclick = () => { attachments.splice(i, 1); renderAttachments(); };
          row.appendChild(chip);
        });
      }
      function roomForMore() {
        if (attachments.length < MAX_ATTACH) return true;
        note("Up to " + MAX_ATTACH + " things per post.", true);
        return false;
      }

      function readAsDataURL(blob) {
        return new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = rej;
          r.readAsDataURL(blob);
        });
      }
      // Shrinks a picture to at most 1600px a side so it stays small in the database
      async function shrink(file) {
        const original = await readAsDataURL(file);
        if (file.type === "image/gif" && original.length < 2400000) return original;
        const img = await new Promise((res, rej) => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = rej;
          im.src = original;
        });
        const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        if (scale === 1 && original.length < 600000 && file.type !== "image/gif") return original;
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * scale));
        c.height = Math.max(1, Math.round(img.naturalHeight * scale));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        for (const q of [0.9, 0.8, 0.65, 0.5]) {
          let out = c.toDataURL("image/webp", q);
          if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/png");
          if (out.length < 2400000) return out;
        }
        throw new Error("big");
      }

      async function addUpload(file) {
        if (!roomForMore()) return;
        if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) { note("Use a PNG, JPG, WEBP or GIF.", true); return; }
        const a = { ref: null, src: "", busy: true };
        attachments.push(a);
        try {
          a.src = await shrink(file);
          renderAttachments();
          const { data, error } = await db.rpc("boi_news_upload", { p_data: a.src });
          if (error) { handleSessionError(error); throw new Error(errorText(error)); }
          if (!data || !data.ok) throw new Error(data && data.reason === "big" ? "That picture is too big." : "Could not upload that picture.");
          a.ref = "upload:" + data.id;
          imageCache.set(data.id, a.src);
          a.busy = false;
          note();
        } catch (ex) {
          attachments = attachments.filter((x) => x !== a);
          note(ex.message === "big" ? "That picture is too big." : ex.message || "Could not upload that picture.", true);
        }
        renderAttachments();
      }

      let sending = false;
      async function send() {
        if (sending || !me || !me.admin) return;
        const body = text.value.trim();
        if (attachments.some((a) => a.busy)) { note("Wait for the pictures to finish uploading.", true); return; }
        const images = attachments.map((a) => a.ref).filter(Boolean);
        if (!body && !images.length) return;
        sending = true;
        $("send-btn").disabled = true;
        try {
          const { data, error } = await db.rpc("boi_news_post", { p_body: body, p_images: images });
          if (error) { handleSessionError(error); note(errorText(error), true); return; }
          if (!data || !data.ok) {
            note(data && data.reason === "long" ? "That post is too long." : "Could not post that.", true);
            return;
          }
          text.value = "";
          grow();
          attachments = [];
          renderAttachments();
          note();
          await loadPosts(true);
        } finally {
          sending = false;
          $("send-btn").disabled = false;
        }
      }

      // ---------- pickers: repo pictures, emotes, environments ----------
      let picker = null; // {title, items: [{label, sub, img, color, pick}]}
      let repoFiles = null;
      let gameList = null;
      let gameListWaiters = [];
      function gotGameList(d) {
        gameList = { emotes: d.emotes || [], environments: d.environments || [] };
        gameListWaiters.forEach((f) => f(gameList));
        gameListWaiters = [];
        const f = $("game-list-frame");
        if (f) f.remove();
      }
      // Every emote and environment the game has, asked of the game itself
      function loadGameList() {
        if (gameList) return Promise.resolve(gameList);
        return new Promise((resolve, reject) => {
          gameListWaiters.push(resolve);
          // The game copy never answered (it could not load the game)
          setTimeout(() => { if (!gameList) reject(new Error("no game")); }, 30000);
          if (!$("game-list-frame")) {
            const f = document.createElement("iframe");
            f.id = "game-list-frame";
            f.src = PLAY_PAGE + "?mode=list";
            f.style.cssText = "position:fixed;left:-9999px;top:0;width:400px;height:300px;border:0;visibility:hidden";
            document.body.appendChild(f);
          }
        });
      }

      $("picker-close").onclick = closePicker;
      $("picker-overlay").addEventListener("click", (e) => { if (e.target.id === "picker-overlay") closePicker(); });
      $("picker-search").addEventListener("input", renderPicker);
      function closePicker() { $("picker-overlay").classList.add("hidden"); picker = null; }
      function openPicker(title, load) {
        if (!roomForMore()) return;
        picker = { title, items: null };
        $("picker-title").textContent = title;
        $("picker-overlay").classList.remove("hidden");
        $("picker-search").value = "";
        $("picker-search").focus();
        $("picker-grid").innerHTML = '<div class="picker-msg">Loading...</div>';
        const mine = picker;
        load().then((items) => {
          if (picker !== mine) return;
          mine.items = items;
          renderPicker();
        }).catch(() => {
          if (picker === mine) $("picker-grid").innerHTML = '<div class="picker-msg">Could not load the list. Try again.</div>';
        });
      }
      function renderPicker() {
        if (!picker || !picker.items) return;
        const q = $("picker-search").value.trim().toLowerCase();
        const grid = $("picker-grid");
        const list = picker.items.filter((it) => (it.label + " " + (it.sub || "")).toLowerCase().includes(q)).slice(0, 150);
        grid.innerHTML = list.length ? "" : '<div class="picker-msg">Nothing matches.</div>';
        for (const it of list) {
          const b = document.createElement("button");
          if (it.img) {
            b.className = "pick";
            b.innerHTML = '<img loading="lazy" alt="" /><span></span>';
            b.querySelector("img").src = it.img;
            b.querySelector("span").textContent = it.label;
          } else {
            b.className = "pick named";
            b.textContent = it.label;
            if (it.color) b.style.borderLeftColor = it.color;
          }
          b.onclick = () => { it.pick(); closePicker(); text.focus(); };
          grid.appendChild(b);
        }
      }
      $("picker-search").addEventListener("keydown", (e) => {
        if (e.key !== "Enter" || !picker || !picker.items) return;
        const q = $("picker-search").value.trim();
        const list = picker.items.filter((it) => it.label.toLowerCase().includes(q.toLowerCase()));
        if (list.length === 1) { list[0].pick(); closePicker(); }
        // A repo file the listing left out can still be typed in
        else if (picker.title === "Repo pictures" && q && /^[A-Za-z0-9_./ ()-]+\.(png|jpe?g|gif|webp)$/i.test(q) && !q.includes("..")) {
          pickRepo(q);
          closePicker();
        }
      });

      function repoUrl(path) { return RAW + path.split("/").map(encodeURIComponent).join("/"); }
      function pickRepo(path) {
        if (!roomForMore()) return;
        attachments.push({ ref: "repo:" + path, src: repoUrl(path), busy: false });
        renderAttachments();
      }
      $("repo-btn").onclick = () =>
        openPicker("Repo pictures", async () => {
          if (!repoFiles) {
            const r = await fetch("https://api.github.com/repos/" + REPO + "/git/trees/main?recursive=1");
            const j = await r.json();
            repoFiles = (j.tree || [])
              .filter((t) => t.type === "blob" && /\.(png|jpe?g|gif|webp)$/i.test(t.path) && /^[A-Za-z0-9_./ ()-]+$/.test(t.path))
              .map((t) => t.path)
              .sort((a, b) => a.localeCompare(b));
          }
          return repoFiles.map((p) => ({ label: p, img: repoUrl(p), pick: () => pickRepo(p) }));
        });
      // Every published level (newest first); search by name, creator or id
      let levelList = null;
      $("level-btn").onclick = () =>
        openPicker("Levels", async () => {
          if (!levelList) {
            const { data, error } = await db
              .from("published_levels_latest")
              .select("id, name, creator, difficulty")
              .order("id", { ascending: false })
              .limit(5000);
            if (error) throw error;
            levelList = data || [];
            levelList.forEach((r) => (levelMeta[String(r.id)] = r));
          }
          return levelList.map((lv) => ({
            label: (lv.name || "Level " + lv.id) + (lv.creator ? " (by " + lv.creator + ")" : ""),
            sub: "#" + lv.id + " " + lv.id,
            color: DIFFICULTY_COLORS_NEWS[lv.difficulty] || "#444",
            pick: () => {
              if (!roomForMore()) return;
              attachments.push({ ref: "level:" + lv.id, kind: "Level", label: lv.name || "Level " + lv.id, color: "#1f3357", busy: false });
              renderAttachments();
            },
          }));
        });
      $("emote-btn").onclick = () =>
        openPicker("Emotes", async () =>
          (await loadGameList()).emotes.map((em) => ({
            label: em.name, sub: em.id, color: em.color,
            pick: () => {
              if (!roomForMore()) return;
              attachments.push({ ref: "emote:" + em.id, kind: "Emote", label: em.name, color: em.color, busy: false });
              renderAttachments();
            },
          })));
      $("env-btn").onclick = () =>
        openPicker("Environments", async () =>
          (await loadGameList()).environments.map((en) => ({
            label: en.name, sub: en.id, color: "#3c8d5a",
            pick: () => {
              if (!roomForMore()) return;
              attachments.push({ ref: "environment:" + en.id, kind: "Environment", label: en.name, color: "#24402e", busy: false });
              renderAttachments();
            },
          })));

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (closeDialog) { closeDialog(false); return; }
          closePicker();
          $("viewer").classList.add("hidden");
        }
      });

      // New posts, polls and votes when the tab comes back, and every two minutes
      function refresh() {
        if (document.hidden || !me || document.querySelector(".att-env.playing")) return;
        loadPosts(false);
        loadPolls(false);
      }
      document.addEventListener("visibilitychange", refresh);
      setInterval(refresh, 120000);

      // A quick look for anything new, even while the tab is in the background
      async function checkForNew() {
        if (!me || !db) return;
        const newest = (table) => db.from(table).select("id").order("id", { ascending: false }).limit(1);
        const [a, b] = await Promise.all([newest("news_posts"), newest("news_polls")]);
        const latest = (res) => (res && res.data && res.data[0] ? res.data[0].id : 0);
        if (latest(a) > posts.reduce((m, x) => Math.max(m, x.id), 0)) loadPosts(false);
        if (latest(b) > polls.reduce((m, x) => Math.max(m, x.id), 0)) loadPolls(false);
      }
      setInterval(checkForNew, 30000);

      // ---------- start ----------
      if (token) enter();
      else show("signin");
    </script>
  </body>
</html>
